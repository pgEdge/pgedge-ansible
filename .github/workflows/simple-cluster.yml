name: "E2E: Simple Cluster"

on:
  workflow_dispatch:
    inputs:
      os:
        description: Target OS
        type: choice
        required: true
        default: all
        options:
          - all
          - debian12
          - rocky9
      environment:
        description: Package repository environment
        type: choice
        required: true
        default: release
        options:
          - release
          - staging
      coldfront:
        description: >-
          Also deploy ColdFront, with a Lakekeeper host and SeaweedFS standing in
          for the object store, and check its cold tier.
        type: boolean
        required: false
        default: false
      mesh:
        description: With coldfront, run ColdFront in mesh mode
        type: boolean
        required: false
        default: false
      repo:
        description: >-
          Where packages come from. pgedge uses pgEdge's servers directly.
          upstream and mirror set repo_url to a local proxy of those servers,
          laid out like a caching proxy or like the proposed pgEdge mirror
          procedure, and check every package came through it.
        type: choice
        required: false
        default: pgedge
        options:
          - pgedge
          - upstream
          - mirror
      zone_join:
        description: >-
          The zone-join job: a cluster of its own that zones 4 and 5 join while
          it takes writes. basic joins both, one interrupted mid-copy and
          resumed, checks the flag's gate and removes a zone; full adds every
          refusal, interruption, AutoDDL and remove_zone variant. Not with
          ColdFront.
        type: choice
        required: false
        default: basic
        options:
          - "off"
          - basic
          - full
      act_job:
        description: >-
          Under act only: which job to run. act runs every job on one Docker
          host, and the jobs' clusters share a compose project and addresses,
          so only one may run at a time. Ignored on GitHub, which runs both.
        type: choice
        required: false
        default: test
        options:
          - test
          - zone-join

jobs:
  test:
    if: ${{ github.actor != 'nektos/act' || inputs.act_job == 'test' }}
    name: >-
      Simple Cluster - ${{ matrix.os }}${{
      inputs.coldfront && ' - coldfront' || '' }}${{
      inputs.coldfront && inputs.mesh && ' - mesh' || '' }}${{
      inputs.repo != 'pgedge' && format(' - repo {0}', inputs.repo) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os == 'all' && fromJSON('["debian12","rocky9"]') || fromJSON(format('["{0}"]', inputs.os)) }}
    env:
      COMPOSE_ARGS: >-
        -f tests/compose/simple-cluster-${{ matrix.os }}.yml
        ${{ inputs.coldfront && format('-f tests/compose/coldfront-{0}.yml', matrix.os) || '' }}
        ${{ inputs.repo != 'pgedge' && '-f tests/compose/repo-proxy.yml' || '' }}
      # ColdFront is layered onto the base inventory: the Lakekeeper host,
      # coldfront_enabled, and the catalog and object store settings. Mesh mode
      # adds the ColdFront database to db_names on top.
      COLDFRONT_ARGS: >-
        ${{ inputs.coldfront && '-i tests/inventories/coldfront.yml' || '' }}
        ${{ inputs.coldfront && inputs.mesh && '-e @tests/vars/coldfront-mesh.yml' || '' }}
      # A repo_url of the site's own takes the tier as repo_name, which is how
      # an inventory would set it; switch-repo.yml leaves its definition alone.
      REPO_ARGS: >-
        ${{ inputs.repo != 'pgedge' && format('-e @tests/vars/repo-{0}.yml -e repo_name={1}', inputs.repo, inputs.environment) || '' }}
      # The pgEdge repositories authenticate clients with mutual TLS. The
      # certificate is passed as a path rather than inline so no key material
      # reaches the process arguments.
      CERT_ARGS: >-
        -e pgedge_client_cert_src=${{ github.workspace }}/tests/.certs/client.crt
        -e pgedge_client_key_src=${{ github.workspace }}/tests/.certs/client.key
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase inotify limits for systemd containers
        run: sudo sysctl -w fs.inotify.max_user_instances=512

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: pip install ansible

      # The mirror procedure carries the release tier alone, which init_server
      # would refuse too, but only after the containers were built.
      - name: Check the repository options agree
        if: inputs.repo == 'mirror' && inputs.environment != 'release'
        run: |
          echo "ERROR: the mirror layout carries only the release tier" >&2
          exit 1

      # Offline, and the only tests that can observe a topology this matrix
      # does not deploy -- in particular a cluster with pgbouncer_enabled
      # unset, whose haproxy.cfg must stay what it was before pooling
      # existed, and a repository with backup_repo_cipher_type: none.
      - name: Check rendered templates
        run: |
          python3 tests/render/check-haproxy.py
          python3 tests/render/check-patroni.py
          python3 tests/render/check-pgbackrest.py
          python3 tests/render/check-etcd.py
          python3 tests/render/check-validate.py
          python3 tests/render/check-repos.py

      - name: Generate SSH keypair
        run: |
          mkdir -p tests/.ssh
          if [ ! -f tests/.ssh/id_ed25519 ]; then
            ssh-keygen -t ed25519 -f tests/.ssh/id_ed25519 -N "" -q
          fi
          cp tests/.ssh/id_ed25519.pub tests/docker/authorized_keys

      - name: Build and install collection
        run: make install VERSION=0.0.0-dev

      - name: Start containers
        run: |
          docker compose -p e2e $COMPOSE_ARGS up -d --build
          sleep 5
          docker compose -p e2e $COMPOSE_ARGS ps

      - name: Wait for SSH
        run: |
          for host in 192.168.6.10 192.168.6.11 192.168.6.12 192.168.6.30 ${{ inputs.coldfront && '192.168.6.32' || '' }}; do
            ready=0
            for i in $(seq 1 30); do
              ssh -i tests/.ssh/id_ed25519 \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=2 \
                -o BatchMode=yes \
                ansible@$host true 2>/dev/null && { ready=1; break; }
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "ERROR: SSH not ready for $host after 30 attempts" >&2
              exit 1
            fi
          done

      - name: Install the pgEdge repository client certificate
        run: |
          # An empty secret would write a lone newline, which `test -s` accepts,
          # so the deployment would get invalid credentials instead of failing
          # here. Check the values before they reach a file.
          : "${PGEDGE_REPO_CLIENT_CRT:?is empty or unset}"
          : "${PGEDGE_REPO_CLIENT_KEY:?is empty or unset}"
          install -d -m 0700 tests/.certs
          install -m 0600 /dev/null tests/.certs/client.key
          printf '%s\n' "$PGEDGE_REPO_CLIENT_CRT" > tests/.certs/client.crt
          printf '%s\n' "$PGEDGE_REPO_CLIENT_KEY" > tests/.certs/client.key
        env:
          PGEDGE_REPO_CLIENT_CRT: ${{ secrets.PGEDGE_REPO_CLIENT_CRT }}
          PGEDGE_REPO_CLIENT_KEY: ${{ secrets.PGEDGE_REPO_CLIENT_KEY }}

      - name: Run playbook
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/playbooks/simple-cluster.yml \
            -i tests/inventories/simple-cluster.yml $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            -e repo_environment=${{ inputs.environment }} $REPO_ARGS $CERT_ARGS

      - name: Check a second deployment run changes nothing
        run: |
          tests/check-idempotence.sh \
            tests/inventories/simple-cluster.yml \
            tests/playbooks/simple-cluster.yml \
            $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            -e repo_environment=${{ inputs.environment }} $REPO_ARGS $CERT_ARGS

      - name: Check packages came from the site's repository
        if: inputs.repo != 'pgedge'
        run: |
          tests/check-repo.sh e2e $COMPOSE_ARGS -- \
            -i tests/inventories/simple-cluster.yml $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            $REPO_ARGS $CERT_ARGS

      - name: Verify cluster
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/verify/verify-simple-cluster.yml \
            -i tests/inventories/simple-cluster.yml $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519

      - name: Verify the cold tier round trip
        if: inputs.coldfront
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/verify/verify-simple-cluster-coldfront.yml \
            -i tests/inventories/simple-cluster.yml $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519

      # After the verification, which reads the inventory's parameters back:
      # this changes them, then puts them back the way it found them.
      - name: Check changed Postgres parameters are applied
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/playbooks/pg-reconfigure.yml \
            -i tests/inventories/simple-cluster.yml $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519

      # After the verification, which writes through the cold tier with
      # ColdFront loaded: this turns ColdFront off and on again.
      - name: Check the ColdFront roles on a running cluster
        if: inputs.coldfront
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/playbooks/coldfront-reconfigure.yml \
            -i tests/inventories/simple-cluster.yml $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519

      # Last, and puts the cluster back as it was deployed. Not with ColdFront
      # in mesh mode, which sets db_names as an extra variable that no role
      # variable can extend.
      - name: Check a database added to db_names is applied
        if: ${{ !inputs.coldfront }}
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/playbooks/db-add.yml \
            -i tests/inventories/simple-cluster.yml \
            --private-key tests/.ssh/id_ed25519

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p e2e $COMPOSE_ARGS logs

      # The pgEdge and Lakekeeper containers log to their own journals rather
      # than to docker.
      - name: Show systemd service status on failure
        if: failure() && inputs.coldfront
        run: |
          for host in 192.168.6.10 192.168.6.11 192.168.6.12 192.168.6.32; do
            echo "::group::$host"
            ssh -i tests/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=2 \
              -o BatchMode=yes \
              ansible@$host \
              'sudo systemctl status "pgedge-postgres-*" "postgresql@*" lakekeeper --no-pager -l; \
               sudo journalctl -xeu "pgedge-postgres-*" -u "postgresql@*" -u lakekeeper --no-pager' \
              || true
            echo "::endgroup::"
          done

      - name: Teardown
        if: always()
        run: docker compose -p e2e $COMPOSE_ARGS down -v --remove-orphans

  # Joining zones to a cluster that already holds data and keeps taking
  # writes. A job of its own, because the cluster it builds is not the one
  # above: tests/inventories/zone-join.yml is layered on from its first
  # deployment (a second database, the pool size left to the calculation, the
  # trickle writer's role), so the verify playbooks above do not hold for it,
  # and verify-zone-join.yml is its verifier. Its own runner also keeps the
  # seed data, about 1GB on each of five zones, off the disk the job above
  # filled.
  #
  # Beside the job above on GitHub, where each job has a runner of its own.
  # Under act, whose actor is nektos/act, every job shares one Docker host,
  # and both jobs use the same compose project and fixed addresses, so the
  # act_job input runs one or the other, never both.
  #
  # Each scenario is a step of tests/zone-join-scenarios.sh, which documents
  # them, and each starts from the cluster the one before it left. Not with
  # ColdFront, whose layer the joins have not been tried with.
  zone-join:
    name: >-
      Simple Cluster zone join - ${{ matrix.os }}${{
      inputs.repo != 'pgedge' && format(' - repo {0}', inputs.repo) || '' }}
    if: >-
      ${{ inputs.zone_join != 'off' && !inputs.coldfront &&
          (github.actor != 'nektos/act' || inputs.act_job == 'zone-join') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os == 'all' && fromJSON('["debian12","rocky9"]') || fromJSON(format('["{0}"]', inputs.os)) }}
    env:
      COMPOSE_ARGS: >-
        -f tests/compose/simple-cluster-${{ matrix.os }}.yml
        ${{ inputs.repo != 'pgedge' && '-f tests/compose/repo-proxy.yml' || '' }}
      REPO_ARGS: >-
        ${{ inputs.repo != 'pgedge' && format('-e @tests/vars/repo-{0}.yml -e repo_name={1}', inputs.repo, inputs.environment) || '' }}
      # Everything every playbook in the scenarios takes; the script adds the
      # base inventory and the zone-join layers itself.
      JOIN_ARGS: >-
        --private-key tests/.ssh/id_ed25519
        -e repo_environment=${{ inputs.environment }}
      ZONE_JOIN_LEVEL: ${{ inputs.zone_join }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase inotify limits for systemd containers
        run: sudo sysctl -w fs.inotify.max_user_instances=512

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: pip install ansible

      - name: Generate SSH keypair
        run: |
          mkdir -p tests/.ssh
          if [ ! -f tests/.ssh/id_ed25519 ]; then
            ssh-keygen -t ed25519 -f tests/.ssh/id_ed25519 -N "" -q
          fi
          cp tests/.ssh/id_ed25519.pub tests/docker/authorized_keys

      - name: Build and install collection
        run: make install VERSION=0.0.0-dev

      - name: Start containers
        run: |
          docker compose -p e2e $COMPOSE_ARGS up -d --build
          sleep 5
          docker compose -p e2e $COMPOSE_ARGS ps

      - name: Wait for SSH
        run: |
          for host in 192.168.6.10 192.168.6.11 192.168.6.12 192.168.6.13 192.168.6.14 192.168.6.30; do
            ready=0
            for i in $(seq 1 30); do
              ssh -i tests/.ssh/id_ed25519 \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=2 \
                -o BatchMode=yes \
                ansible@$host true 2>/dev/null && { ready=1; break; }
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "ERROR: SSH not ready for $host after 30 attempts" >&2
              exit 1
            fi
          done

      # Scenarios marked full run only with zone_join=full; the others also
      # trim their reruns at basic (ZONE_JOIN_LEVEL).
      - name: Refuse pgedge_join_zones on a new cluster (full)
        if: inputs.zone_join == 'full'
        run: tests/zone-join-scenarios.sh simple-cluster refuse-new $JOIN_ARGS $REPO_ARGS

      - name: Deploy and seed
        run: tests/zone-join-scenarios.sh simple-cluster deploy $JOIN_ARGS $REPO_ARGS

      - name: Refuse new zones without the flag
        run: tests/zone-join-scenarios.sh simple-cluster gate $JOIN_ARGS $REPO_ARGS

      - name: Refuse new zones with a database added (full)
        if: inputs.zone_join == 'full'
        run: tests/zone-join-scenarios.sh simple-cluster gate-db-added $JOIN_ARGS $REPO_ARGS

      - name: Join zones 4 and 5, interrupted mid-copy and resumed
        run: tests/zone-join-scenarios.sh simple-cluster join-two $JOIN_ARGS $REPO_ARGS

      - name: Remove a running zone (basic)
        if: inputs.zone_join == 'basic'
        run: tests/zone-join-scenarios.sh simple-cluster remove $JOIN_ARGS $REPO_ARGS

      - name: Resume a join stopped after step 3 (full)
        if: inputs.zone_join == 'full'
        run: tests/zone-join-scenarios.sh simple-cluster resume-step4 $JOIN_ARGS $REPO_ARGS

      - name: Refuse a join that cannot be resumed, release it, and reset the zone (full)
        if: inputs.zone_join == 'full'
        run: tests/zone-join-scenarios.sh simple-cluster not-resumable $JOIN_ARGS $REPO_ARGS

      - name: Refuse a join whose copy died in its data step (full)
        if: inputs.zone_join == 'full'
        run: tests/zone-join-scenarios.sh simple-cluster copy-died $JOIN_ARGS $REPO_ARGS

      - name: Join with AutoDDL during and after the copy (full)
        if: inputs.zone_join == 'full'
        run: tests/zone-join-scenarios.sh simple-cluster autoddl $JOIN_ARGS $REPO_ARGS

      - name: Refuse a rebuilt zone the others still subscribe to, then rejoin it (full)
        if: inputs.zone_join == 'full'
        run: tests/zone-join-scenarios.sh simple-cluster rebuilt $JOIN_ARGS $REPO_ARGS

      - name: Refuse to remove a zone a subscriber is behind on (full)
        if: inputs.zone_join == 'full'
        run: tests/zone-join-scenarios.sh simple-cluster remove-behind $JOIN_ARGS $REPO_ARGS

      - name: Remove a zone whose Postgres is stopped, then reset and rejoin it (full)
        if: inputs.zone_join == 'full'
        run: tests/zone-join-scenarios.sh simple-cluster remove-pg-stopped $JOIN_ARGS $REPO_ARGS

      - name: Resume a join marked unfinished after every subscription exists (full)
        if: inputs.zone_join == 'full'
        run: tests/zone-join-scenarios.sh simple-cluster resume-step10 $JOIN_ARGS $REPO_ARGS

      - name: Remove an unreachable zone (full)
        if: inputs.zone_join == 'full'
        run: tests/zone-join-scenarios.sh simple-cluster remove-unreachable $JOIN_ARGS $REPO_ARGS

      - name: Show the trickle writers' logs
        if: always()
        run: |
          ssh -i tests/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=2 \
            -o BatchMode=yes \
            ansible@192.168.6.30 \
            'sudo tail -n 20 /var/lib/zone-join-trickle/*.log' || true

      - name: Show the Postgres logs on failure
        if: failure()
        run: |
          for host in 192.168.6.10 192.168.6.11 192.168.6.12 192.168.6.13 192.168.6.14; do
            echo "::group::$host"
            ssh -i tests/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=2 \
              -o BatchMode=yes \
              ansible@$host \
              'sudo journalctl -u "pgedge-postgres-*" -u "postgresql@*" --no-pager -n 200; \
               sudo sh -c "tail -n 200 /var/log/postgresql/*.log /var/lib/pgsql/*/data/log/*.log 2>/dev/null"' \
              || true
            echo "::endgroup::"
          done

      - name: Teardown
        if: always()
        run: docker compose -p e2e $COMPOSE_ARGS down -v --remove-orphans
