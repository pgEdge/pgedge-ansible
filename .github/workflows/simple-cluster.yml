name: "E2E: Simple Cluster"

on:
  workflow_dispatch:
    inputs:
      os:
        description: Target OS
        type: choice
        required: true
        default: all
        options:
          - all
          - debian12
          - rocky9
      environment:
        description: Package repository environment
        type: choice
        required: true
        default: release
        options:
          - release
          - staging
      coldfront:
        description: >-
          Also deploy ColdFront, with a Lakekeeper host and SeaweedFS standing in
          for the object store, and check its cold tier.
        type: boolean
        required: false
        default: false
      mesh:
        description: With coldfront, run ColdFront in mesh mode
        type: boolean
        required: false
        default: false

jobs:
  test:
    name: >-
      Simple Cluster - ${{ matrix.os }}${{
      inputs.coldfront && ' - coldfront' || '' }}${{
      inputs.coldfront && inputs.mesh && ' - mesh' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os == 'all' && fromJSON('["debian12","rocky9"]') || fromJSON(format('["{0}"]', inputs.os)) }}
    env:
      COMPOSE_ARGS: >-
        -f tests/compose/simple-cluster-${{ matrix.os }}.yml
        ${{ inputs.coldfront && format('-f tests/compose/coldfront-{0}.yml', matrix.os) || '' }}
      # ColdFront is layered onto the base inventory: the Lakekeeper host,
      # coldfront_enabled, and the catalog and object store settings. Mesh mode
      # adds the ColdFront database to db_names on top.
      COLDFRONT_ARGS: >-
        ${{ inputs.coldfront && '-i tests/inventories/coldfront.yml' || '' }}
        ${{ inputs.coldfront && inputs.mesh && '-e @tests/vars/coldfront-mesh.yml' || '' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase inotify limits for systemd containers
        run: sudo sysctl -w fs.inotify.max_user_instances=512

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: pip install ansible

      # Offline, and the only tests that can observe a topology this matrix
      # does not deploy -- in particular a cluster with pgbouncer_enabled
      # unset, whose haproxy.cfg must stay what it was before pooling
      # existed, and a repository with backup_repo_cipher_type: none.
      - name: Check rendered templates
        run: |
          python3 tests/render/check-haproxy.py
          python3 tests/render/check-patroni.py
          python3 tests/render/check-pgbackrest.py
          python3 tests/render/check-etcd.py
          python3 tests/render/check-validate.py

      - name: Generate SSH keypair
        run: |
          mkdir -p tests/.ssh
          if [ ! -f tests/.ssh/id_ed25519 ]; then
            ssh-keygen -t ed25519 -f tests/.ssh/id_ed25519 -N "" -q
          fi
          cp tests/.ssh/id_ed25519.pub tests/docker/authorized_keys

      - name: Build and install collection
        run: make install VERSION=0.0.0-dev

      - name: Start containers
        run: |
          docker compose -p e2e $COMPOSE_ARGS up -d --build
          sleep 5
          docker compose -p e2e $COMPOSE_ARGS ps

      - name: Wait for SSH
        run: |
          for host in 192.168.6.10 192.168.6.11 192.168.6.12 192.168.6.30 ${{ inputs.coldfront && '192.168.6.32' || '' }}; do
            ready=0
            for i in $(seq 1 30); do
              ssh -i tests/.ssh/id_ed25519 \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=2 \
                -o BatchMode=yes \
                ansible@$host true 2>/dev/null && { ready=1; break; }
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "ERROR: SSH not ready for $host after 30 attempts" >&2
              exit 1
            fi
          done

      - name: Run playbook
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/playbooks/simple-cluster.yml \
            -i tests/inventories/simple-cluster.yml $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            -e repo_environment=${{ inputs.environment }}

      - name: Check the pooler roles are idempotent
        run: |
          tests/check-idempotence.sh \
            tests/inventories/simple-cluster.yml \
            tests/playbooks/simple-cluster.yml \
            $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            -e repo_environment=${{ inputs.environment }}

      - name: Verify cluster
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/verify/verify-simple-cluster.yml \
            -i tests/inventories/simple-cluster.yml $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519

      - name: Verify the cold tier round trip
        if: inputs.coldfront
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/verify/verify-simple-cluster-coldfront.yml \
            -i tests/inventories/simple-cluster.yml $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519

      # After the verification, which reads the inventory's parameters back:
      # this changes them, then puts them back the way it found them.
      - name: Check changed Postgres parameters are applied
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/playbooks/pg-reconfigure.yml \
            -i tests/inventories/simple-cluster.yml $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519

      # After the verification, which writes through the cold tier with
      # ColdFront loaded: this turns ColdFront off and on again.
      - name: Check the ColdFront roles on a running cluster
        if: inputs.coldfront
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/playbooks/coldfront-reconfigure.yml \
            -i tests/inventories/simple-cluster.yml $COLDFRONT_ARGS \
            --private-key tests/.ssh/id_ed25519

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p e2e $COMPOSE_ARGS logs

      # The pgEdge and Lakekeeper containers log to their own journals rather
      # than to docker.
      - name: Show systemd service status on failure
        if: failure() && inputs.coldfront
        run: |
          for host in 192.168.6.10 192.168.6.11 192.168.6.12 192.168.6.32; do
            echo "::group::$host"
            ssh -i tests/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=2 \
              -o BatchMode=yes \
              ansible@$host \
              'sudo systemctl status "pgedge-postgres-*" "postgresql@*" lakekeeper --no-pager -l; \
               sudo journalctl -xeu "pgedge-postgres-*" -u "postgresql@*" -u lakekeeper --no-pager' \
              || true
            echo "::endgroup::"
          done

      - name: Teardown
        if: always()
        run: docker compose -p e2e $COMPOSE_ARGS down -v --remove-orphans
