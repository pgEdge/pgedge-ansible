name: "E2E: Ultra-HA"

on:
  workflow_dispatch:
    inputs:
      os:
        description: Target OS
        type: choice
        required: true
        default: all
        options:
          - all
          - debian12
          - rocky9
      environment:
        description: Package repository environment
        type: choice
        required: true
        default: release
        options:
          - release
          - staging
      dcs:
        description: Distributed configuration store
        type: choice
        required: true
        default: etcd3
        options:
          - all
          - etcd3
          - consul
      backup:
        description: >-
          Backup repository: ssh is a dedicated backup server per zone, s3 a
          MinIO object store over TLS from a private CA.
        type: choice
        required: true
        default: ssh
        options:
          - all
          - ssh
          - s3
      coldfront:
        description: >-
          Also deploy ColdFront in mesh mode, with a Lakekeeper host and
          SeaweedFS standing in for the object store, and check its cold tier.
          The recovery test does not run with it.
        type: boolean
        required: false
        default: false
      repo:
        description: >-
          Where packages come from. pgedge uses pgEdge's servers directly.
          upstream and mirror set repo_url to a local proxy of those servers,
          laid out like a caching proxy or like the proposed pgEdge mirror
          procedure, and check every package came through it.
        type: choice
        required: false
        default: pgedge
        options:
          - pgedge
          - upstream
          - mirror
      ai_dba_workbench:
        description: >-
          Also deploy the pgEdge AI DBA Workbench on a host of its own, and
          check it monitors every member. Its server package requires a
          knowledge base package of about 2.2 GB to download. The recovery
          test does not run with it.
        type: boolean
        required: false
        default: false
      recover:
        description: >-
          Also rebuild the cluster from its backup repository and verify the
          data came back. Roughly doubles the run: it wipes the cluster,
          restores one zone, refills the rest across Spock, and commits.
        type: boolean
        required: false
        default: false
      recover_to:
        description: >-
          With recover, where to restore to. latest replays the whole archive;
          lsn stops at a recorded WAL position and checks rows written after it
          stayed out; both runs latest and then lsn against the same cluster,
          doubling the recovery's share of the run.
        type: choice
        required: false
        default: both
        options:
          - both
          - latest
          - lsn

jobs:
  test:
    name: >-
      Ultra-HA - ${{ matrix.os }} - ${{ matrix.dcs }} - ${{ matrix.backup }}${{
      inputs.coldfront && ' - coldfront' || '' }}${{
      inputs.repo != 'pgedge' && format(' - repo {0}', inputs.repo) || '' }}${{
      inputs.ai_dba_workbench && ' - ai-dba-workbench' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os == 'all' && fromJSON('["debian12","rocky9"]') || fromJSON(format('["{0}"]', inputs.os)) }}
        dcs: ${{ inputs.dcs == 'all' && fromJSON('["etcd3","consul"]') || fromJSON(format('["{0}"]', inputs.dcs)) }}
        backup: ${{ inputs.backup == 'all' && fromJSON('["ssh","s3"]') || fromJSON(format('["{0}"]', inputs.backup)) }}
    env:
      COMPOSE_ARGS: >-
        -f tests/compose/ultra-ha-${{ matrix.os }}.yml
        ${{ matrix.dcs != 'etcd3' && format('-f tests/compose/dcs-{0}.yml', matrix.dcs) || '' }}
        ${{ matrix.backup == 's3' && '-f tests/compose/backup-s3.yml' || '' }}
        ${{ inputs.coldfront && format('-f tests/compose/coldfront-{0}.yml', matrix.os) || '' }}
        ${{ inputs.repo != 'pgedge' && '-f tests/compose/repo-proxy.yml' || '' }}
        ${{ inputs.ai_dba_workbench && format('-f tests/compose/ai-dba-workbench-{0}.yml', matrix.os) || '' }}
      DCS_VARS: ${{ matrix.dcs != 'etcd3' && format('-e @tests/vars/dcs-{0}.yml', matrix.dcs) || '' }}
      # The repository is layered onto the base inventory: the backup servers
      # for SSH, or the MinIO store's variables for S3, which may not have any.
      BACKUP_ARGS: ${{ matrix.backup == 's3' && '-e @tests/vars/backup-s3.yml' || '-i tests/inventories/ultra-ha-ssh.yml' }}
      # ColdFront is layered onto the base inventory as well, always in mesh
      # mode, which an HA cluster needs.
      COLDFRONT_ARGS: ${{ inputs.coldfront && '-i tests/inventories/coldfront.yml -e @tests/vars/coldfront-mesh.yml' || '' }}
      # A repo_url of the site's own takes the tier as repo_name, which is how
      # an inventory would set it; switch-repo.yml leaves its definition alone.
      REPO_ARGS: >-
        ${{ inputs.repo != 'pgedge' && format('-e @tests/vars/repo-{0}.yml -e repo_name={1}', inputs.repo, inputs.environment) || '' }}
      # The AI DBA Workbench is layered onto the base inventory too: its host,
      # and the passwords it and the nodes share.
      AI_DBA_WORKBENCH_ARGS: ${{ inputs.ai_dba_workbench && '-i tests/inventories/ai-dba-workbench.yml' || '' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase inotify limits for systemd containers
        run: sudo sysctl -w fs.inotify.max_user_instances=512

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: pip install ansible

      # The mirror procedure carries the release tier alone, which init_server
      # would refuse too, but only after the containers were built.
      - name: Check the repository options agree
        if: inputs.repo == 'mirror' && inputs.environment != 'release'
        run: |
          echo "ERROR: the mirror layout carries only the release tier" >&2
          exit 1

      # Offline, and the only tests that can observe a topology this matrix
      # does not deploy -- in particular a cluster with pgbouncer_enabled
      # unset, whose haproxy.cfg must stay what it was before pooling
      # existed, and a repository with backup_repo_cipher_type: none.
      - name: Check rendered templates
        run: |
          python3 tests/render/check-haproxy.py
          python3 tests/render/check-patroni.py
          python3 tests/render/check-pgbackrest.py
          python3 tests/render/check-etcd.py
          python3 tests/render/check-validate.py
          python3 tests/render/check-repos.py
          python3 tests/render/check-ai-dba-workbench.py

      - name: Generate SSH keypair
        run: |
          mkdir -p tests/.ssh
          if [ ! -f tests/.ssh/id_ed25519 ]; then
            ssh-keygen -t ed25519 -f tests/.ssh/id_ed25519 -N "" -q
          fi
          cp tests/.ssh/id_ed25519.pub tests/docker/authorized_keys

      - name: Build and install collection
        run: make install VERSION=0.0.0-dev

      - name: Start containers
        run: |
          docker compose -p e2e $COMPOSE_ARGS up -d --build
          sleep 5
          docker compose -p e2e $COMPOSE_ARGS ps

      - name: Wait for SSH
        run: |
          for host in 192.168.6.10 192.168.6.11 192.168.6.12 192.168.6.13 192.168.6.14 192.168.6.15 192.168.6.16 192.168.6.17 192.168.6.18 192.168.6.19 192.168.6.30 ${{ inputs.coldfront && '192.168.6.32' || '' }} ${{ inputs.ai_dba_workbench && '192.168.6.33' || '' }}; do
            ready=0
            for i in $(seq 1 30); do
              ssh -i tests/.ssh/id_ed25519 \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=2 \
                -o BatchMode=yes \
                ansible@$host true 2>/dev/null && { ready=1; break; }
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "ERROR: SSH not ready for $host after 30 attempts" >&2
              exit 1
            fi
          done

      - name: Wait for external DCS
        if: matrix.dcs == 'consul'
        run: |
          for i in $(seq 1 30); do
            leader=$(curl -sf http://192.168.6.20:8500/v1/status/leader |
                     tr -d '"' || true)
            if [ -n "$leader" ]; then
              echo "Consul leader: $leader"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Consul did not elect a leader" >&2
          exit 1

      # Before the deployment: the first thing to reach the repository is
      # setup_postgres's identity check, which skips a repository it cannot
      # read, so a CA that arrived late would only fail the final backup.
      - name: Wait for S3 and install its CA on the nodes
        if: matrix.backup == 's3'
        run: |
          tests/prepare-s3.sh e2e $COMPOSE_ARGS -- \
            -i tests/inventories/ultra-ha.yml $BACKUP_ARGS \
            --private-key tests/.ssh/id_ed25519

      - name: Run playbook
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/playbooks/ultra-ha.yml \
            -i tests/inventories/ultra-ha.yml $BACKUP_ARGS $COLDFRONT_ARGS \
            $AI_DBA_WORKBENCH_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            -e repo_environment=${{ inputs.environment }} \
            $DCS_VARS $REPO_ARGS

      - name: Check the pooler roles are idempotent
        run: |
          tests/check-idempotence.sh \
            tests/inventories/ultra-ha.yml \
            tests/playbooks/ultra-ha.yml \
            $BACKUP_ARGS $COLDFRONT_ARGS $AI_DBA_WORKBENCH_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            -e repo_environment=${{ inputs.environment }} \
            $DCS_VARS $REPO_ARGS

      - name: Check packages came from the site's repository
        if: inputs.repo != 'pgedge'
        run: |
          tests/check-repo.sh e2e $COMPOSE_ARGS -- \
            -i tests/inventories/ultra-ha.yml $BACKUP_ARGS $COLDFRONT_ARGS \
            $AI_DBA_WORKBENCH_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            $DCS_VARS $REPO_ARGS

      - name: Verify cluster
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/verify/verify-ultra-ha.yml \
            -i tests/inventories/ultra-ha.yml $BACKUP_ARGS $COLDFRONT_ARGS \
            $AI_DBA_WORKBENCH_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            $DCS_VARS

      - name: Verify the cold tier on every member
        if: inputs.coldfront
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/verify/verify-ultra-ha-coldfront.yml \
            -i tests/inventories/ultra-ha.yml $BACKUP_ARGS $COLDFRONT_ARGS \
            $AI_DBA_WORKBENCH_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            $DCS_VARS

      - name: Verify the AI DBA Workbench
        if: inputs.ai_dba_workbench
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/verify/verify-ai-dba-workbench.yml \
            -i tests/inventories/ultra-ha.yml $BACKUP_ARGS $COLDFRONT_ARGS \
            $AI_DBA_WORKBENCH_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            $DCS_VARS

      - name: Check the AI DBA Workbench roles are idempotent
        if: inputs.ai_dba_workbench
        run: |
          tests/check-ai-dba-workbench-idempotence.sh \
            tests/inventories/ultra-ha.yml \
            tests/playbooks/ultra-ha.yml \
            $BACKUP_ARGS $COLDFRONT_ARGS $AI_DBA_WORKBENCH_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            $DCS_VARS

      # After the verification, which reads the inventory's own parameters, and
      # ending on them again, so the steps below see the cluster as deployed.
      - name: Check changed Postgres parameters are applied through Patroni
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/playbooks/pg-reconfigure.yml \
            -i tests/inventories/ultra-ha.yml $BACKUP_ARGS $COLDFRONT_ARGS \
            $AI_DBA_WORKBENCH_ARGS \
            --private-key tests/.ssh/id_ed25519 \
            $DCS_VARS

      # After the verification, because it restarts every etcd member: the
      # cluster has to come through that with each zone's leader where it was.
      - name: Check a changed etcd configuration is applied by rolling restart
        if: ${{ matrix.dcs == 'etcd3' }}
        run: |
          ANSIBLE_CONFIG=tests/ansible.cfg ansible-playbook \
            tests/playbooks/etcd-reconfigure.yml \
            -i tests/inventories/ultra-ha.yml $BACKUP_ARGS \
            --private-key tests/.ssh/id_ed25519

      # Last, because it wipes the cluster the steps above just verified.
      # The deployment is what produces the backups this restores from, so the
      # two belong in one job against one set of containers rather than a job
      # that would have to build a cluster of its own to have anything to
      # recover.
      #
      # DEPLOY_PLAYBOOK_DIR points at the directory this workflow deployed
      # from: setup_postgres stages its certificates from a path resolved
      # against the playbook's own location, and the recovery reuses them when
      # recover_postgres applies setup_postgres to every node.
      #
      # both is latest first and then lsn. Each pass commits, so the second
      # starts from a working cluster and seeds it again; in that order the
      # targeted pass also restores across the timeline the first one created,
      # which is the case recover_postgres's timeline handling is for.
      #
      # Not with ColdFront: run-recovery-test.sh deploys without its layer.
      # Nor with the Workbench: the recovery's inventory has no Workbench host,
      # so its setup_patroni would leave out the rule that admits that host.
      # With the deployment's repo_url, which it re-applies install_repos with.
      - name: Recover the cluster from its backup repository
        if: inputs.recover && !inputs.coldfront && !inputs.ai_dba_workbench
        env:
          DEPLOY_PLAYBOOK_DIR: tests/playbooks
          RECOVER_TO: ${{ inputs.recover_to || 'both' }}
        run: |
          case "$RECOVER_TO" in
            both) passes="latest lsn" ;;
            *) passes="$RECOVER_TO" ;;
          esac
          for pass in $passes; do
            tests/run-recovery-test.sh \
              ultra-ha ${{ matrix.os }} ${{ matrix.dcs }} ${{ matrix.backup }} \
              "$pass" -- $REPO_ARGS
          done

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p e2e $COMPOSE_ARGS logs

      # The pgEdge and Lakekeeper containers log to their own journals rather
      # than to docker, so Patroni's view of each member has to be fetched.
      - name: Show Patroni and service status on failure
        if: failure() && inputs.coldfront
        run: |
          for host in 192.168.6.10 192.168.6.11 192.168.6.12 192.168.6.13 192.168.6.14 192.168.6.15 192.168.6.32; do
            echo "::group::$host"
            ssh -i tests/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=2 \
              -o BatchMode=yes \
              ansible@$host \
              'for c in /etc/patroni/*.yml; do \
                 [ -f "$c" ] && sudo -u postgres patronictl -c "$c" list; \
               done; \
               sudo systemctl status "patroni*" "pgedge-postgres-*" "postgresql@*" lakekeeper --no-pager -l; \
               sudo journalctl -u "patroni*" -u "pgedge-postgres-*" -u "postgresql@*" -u lakekeeper --no-pager -n 200' \
              || true
            echo "::endgroup::"
          done

      # The AI DBA Workbench's services log to their own files, and nginx to
      # its journal, rather than to docker.
      - name: Show AI DBA Workbench status on failure
        if: failure() && inputs.ai_dba_workbench
        run: |
          ssh -i tests/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=2 \
            -o BatchMode=yes \
            ansible@192.168.6.33 \
            'sudo systemctl status "pgedge-ai-dba-*" nginx --no-pager -l; \
             sudo tail -n 200 /var/log/pgedge/ai-dba-*/*.log; \
             sudo journalctl -u nginx --no-pager -n 100' \
            || true

      - name: Teardown
        if: always()
        run: docker compose -p e2e $COMPOSE_ARGS down -v --remove-orphans
