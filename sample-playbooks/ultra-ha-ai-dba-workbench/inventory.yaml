# This inventory will produce an HA cluster with the following:
#
# * 2 zones
# * 3 pgEdge nodes in each zone
# * 1 HAProxy node in each zone
# * 1 Backup node in each zone
# * 1 AI DBA Workbench host monitoring every member of every zone
#
# To add a pooled endpoint, set pgbouncer_enabled on the pgedge group below,
# along with pgbouncer_auth_password, which the playbook refuses to leave at
# its default. Every pgEdge node then runs a pooler in front of its own
# Postgres, and HAProxy serves pooler_port (6432) beside proxy_port (5432).
#
# Pooling is a property of the cluster, like is_ha_cluster, and not of a node.
# The pooled listener health-checks Patroni's leader endpoint, so a zone that
# pooled only some of its nodes would lose that endpoint the moment the leader
# moved to one of the others.
#
#   pgbouncer_enabled: true
#   pgbouncer_auth_password: <a real password>

# PgBackRest encrypts the repository with this, and it has no default: a
# generated password would have to be identical on every run and also
# unguessable, and nothing can be both. It belongs under 'all' rather than
# under 'pgedge', because the backup servers render the same repository
# configuration and have to arrive at the same value as the nodes they serve:
#
#   all:
#     vars:
#       backup_repo_cipher: "{{ vault_backup_repo_cipher }}"
#
# Or leave PgBackRest's own encryption off and let the storage layer do it,
# which is the arrangement that permits key rotation -- again under 'all', for
# the same reason:
#
#   all:
#     vars:
#       backup_repo_cipher_type: none

# The monitoring role's password goes under all, because the pgedge group
# creates the role and the ai_dba_workbench group logs in with it. The
# passwords belong in Ansible Vault.

all:
  vars:
    ai_dba_workbench_monitor_password: >-
      {{ vault_ai_dba_workbench_monitor_password }}

pgedge:
  vars:
    db_password: secret
    is_ha_cluster: true
  hosts:
    192.168.6.10:
      zone: 1
    192.168.6.11:
      zone: 1
    192.168.6.12:
      zone: 1
    192.168.6.13:
      zone: 2
    192.168.6.14:
      zone: 2
    192.168.6.15:
      zone: 2

haproxy:
  hosts:
    192.168.6.16:
      zone: 1
    192.168.6.17:
      zone: 2

backup:
  hosts:
    192.168.6.18:
      zone: 1
    192.168.6.19:
      zone: 2

# The Workbench needs a host of its own: it keeps its datastore in a Postgres
# instance there, and its server package brings a documentation knowledge base
# of about 2.6 GB with it, except on Ubuntu 26.04. The web client is then at
# https://192.168.6.21:8444, where admin signs in with
# ai_dba_workbench_admin_password, which has to be at least 12 characters long.
#
# Without a language model the Workbench monitors and alerts, with its AI
# features off. To turn them on, name a provider, a model and its key:
#
#   ai_dba_workbench_llm_provider: anthropic
#   ai_dba_workbench_llm_model: claude-sonnet-4-5
#   ai_dba_workbench_llm_api_key: "{{ vault_ai_dba_workbench_llm_api_key }}"

ai_dba_workbench:
  vars:
    ai_dba_workbench_db_password: "{{ vault_ai_dba_workbench_db_password }}"
    ai_dba_workbench_admin_password: >-
      {{ vault_ai_dba_workbench_admin_password }}
  hosts:
    192.168.6.21:
