# This inventory will produce a pgEdge cluster with ColdFront tiered storage:
#
# * 3 zones
# * 1 pgEdge node in each zone, running ColdFront
# * 1 Lakekeeper host serving the Iceberg catalog ColdFront commits through
#
# Note: zones are currently a logical node assignment. This is also
#       used for snowflake IDs.
#
# To give every node a pooled endpoint as well, set pgbouncer_enabled on the
# pgedge group below, along with pgbouncer_auth_password, which the playbook
# refuses to leave at its default. Pooled clients then use pgbouncer_port
# (6432) where direct ones use pg_port (5432). Pooling is a property of the
# cluster, like is_ha_cluster: it is on for every node or for none.
#
#   pgbouncer_enabled: true
#   pgbouncer_auth_password: <a real password>

# Both groups read the catalog and object store settings, so those go under
# all. This collection deploys no object store. Point coldfront_s3_endpoint at
# an S3-compatible store whose bucket already exists; for AWS S3, leave it
# empty, set coldfront_s3_region, and set coldfront_s3_path_style to false.
# The keys belong in Ansible Vault, beside the passwords.

all:
  vars:
    lakekeeper_host: 192.168.6.20
    coldfront_s3_endpoint: https://s3.example.com
    coldfront_s3_bucket: iceberg
    coldfront_s3_access_key: "{{ vault_coldfront_s3_access_key }}"
    coldfront_s3_secret_key: "{{ vault_coldfront_s3_secret_key }}"

# With coldfront_mesh at its default of false, each node serializes only its
# own cold-tier commits, so write any one Iceberg table from a single node. To
# order cold-tier commits across all three nodes instead, turn on mesh mode,
# which needs the ColdFront database in db_names as well:
#
#   coldfront_mesh: true
#   db_names:
#   - demo
#   - coldfront

pgedge:
  vars:
    db_password: secret
    coldfront_enabled: true
  hosts:
    192.168.6.10:
      zone: 1
    192.168.6.11:
      zone: 2
    192.168.6.12:
      zone: 3

lakekeeper:
  vars:
    lakekeeper_db_password: secret
  hosts:
    192.168.6.20:
