# This playbook will create a standard pgEdge cluster with the ColdFront
# tiered-storage add-on
#
# Make sure all nodes are in the pgedge node group, and the host that
# serves the Lakekeeper Iceberg catalog is in the lakekeeper group.
#
# This collection does not deploy an object store. Point
# coldfront_s3_endpoint at whatever S3-compatible store you already
# have, or leave it empty to use AWS S3.
#
# coldfront_mesh stays at its default of false, so each node serializes
# only its own cold-tier commits. Write any one Iceberg table from a
# single node.
#
# CHECK the README for how these roles work
---

# All hosts being managed by this collection should be initialized, the
# Lakekeeper host included. This also checks the inventory before anything
# is installed, and gathers every host's facts.

- hosts: all
  any_errors_fatal: true

  collections:
  - pgedge.platform

  roles:
  - init_server

# Set up Lakekeeper first. Every cold-tier commit goes through this
# catalog, and setup_coldfront fails if the catalog is not already
# answering.

- hosts: lakekeeper

  collections:
  - pgedge.platform

  roles:
  - install_repos
  - install_lakekeeper
  - setup_lakekeeper

- hosts: pgedge

  collections:
  - pgedge.platform

  # install_coldfront comes before setup_postgres, which preloads ColdFront's
  # libraries where coldfront_enabled is set, and Postgres will not start
  # with a library it cannot find.

  roles:
  - install_repos
  - install_pgedge
  - install_coldfront
  - setup_postgres
  - setup_pgedge
  - setup_coldfront
