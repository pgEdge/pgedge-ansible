---

# Address Lakekeeper binds to, as distinct from the address the pgEdge
# nodes reach it on, for a host where those differ.
lakekeeper_bind_ip: "{{ lakekeeper_host }}"

# Catalog state. This Postgres instance exists for Lakekeeper alone, and
# listens on pg_port. lakekeeper_db_password is in role_config, so
# init_server can check it.
lakekeeper_pg_data: "{{ pg_home }}/{{ pg_version }}/lakekeeper"
lakekeeper_pg_service_name: lakekeeper-postgres
lakekeeper_db: lakekeeper
lakekeeper_db_user: lakekeeper

# Iceberg namespace pre-created in the warehouse. Decoupled (Iceberg-only)
# tables need it to exist in its own committed REST call, because
# coldfront.create_iceberg_table() defers the Iceberg CREATE SCHEMA to
# commit but POSTs the CREATE TABLE eagerly.
lakekeeper_namespace: public
