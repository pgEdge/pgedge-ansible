---

lakekeeper_url: "http://{{ lakekeeper_bind_ip }}:{{ lakekeeper_port }}"

# The user and password are percent-encoded, since a character such as
# @, : or / in either would otherwise change how the URI is split.
# urlencode leaves / alone, as it is meant for paths, so that is
# replaced separately.
lakekeeper_dsn: >-
  postgresql://{{ lakekeeper_db_user | urlencode | replace('/', '%2F')
  }}:{{ lakekeeper_db_password | urlencode | replace('/', '%2F')
  }}@127.0.0.1:{{ pg_port }}/{{ lakekeeper_db }}

# The warehouse's storage profile, which setup_lakekeeper creates the warehouse
# with and keeps it in step with.
#
# Lakekeeper 0.13.1 reads endpoint as an optional URL (S3Profile in
# crates/lakekeeper/src/service/storage/s3.rs). Left out, the region
# determines the endpoint, which is what AWS S3 needs; an empty string is not
# a URL, and the whole request fails with a 422. The flavor only changes
# behaviour once STS is enabled, which it is not here, but aws is
# Lakekeeper's own name for AWS S3.
lakekeeper_storage_profile: >-
  {{ {
       'type': 's3',
       'bucket': coldfront_s3_bucket,
       'region': coldfront_s3_region,
       'path-style-access': coldfront_s3_path_style | bool,
       'flavor': 's3-compat' if coldfront_s3_endpoint | length > 0 else 'aws',
       'sts-enabled': false,
       'remote-signing-enabled': false,
     }
     | combine({'endpoint': coldfront_s3_endpoint}
               if coldfront_s3_endpoint | length > 0 else {}) }}

# Field names come from the management API of the packaged Lakekeeper 0.13.1
# (lakekeeper management-openapi: S3AccessKeyCredential). ColdFront's own
# setup notes use the older aws-access-key-id / aws-secret-access-key
# spelling, which this version does not accept.
lakekeeper_storage_credential:
  type: s3
  credential-type: access-key
  access-key-id: "{{ coldfront_s3_access_key }}"
  secret-access-key: "{{ coldfront_s3_secret_key }}"

# Referenced only after tasks/main.yaml has read the encryption key.
lakekeeper_env:
  LAKEKEEPER__PG_DATABASE_URL_WRITE: "{{ lakekeeper_dsn }}"
  LAKEKEEPER__PG_DATABASE_URL_READ: "{{ lakekeeper_dsn }}"
  LAKEKEEPER__PG_ENCRYPTION_KEY: >-
    {{ lakekeeper_key.content | b64decode | trim }}
