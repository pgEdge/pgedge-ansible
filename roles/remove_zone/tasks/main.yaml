---

# Take one zone out of a running cluster's Spock mesh, so that it can be
# joined again from scratch, or its hosts retired.
#
# Spock keeps a zone's membership on both sides. Every other zone has a
# subscription from it, a replication slot that its own subscription reads
# from, and a row for its node. The zone has its own node and a subscription
# from every other zone. A zone that only goes away leaves all of that behind
# on the others, and an unread slot keeps WAL until the disk fills. A zone that
# is to join again must start with empty databases, because a join copies the
# schema and the data into them.
#
# So, for every database in db_names:
#
# 0. If the zone can be reached, every other zone that subscribes to it is
#    waited on until it has applied every write the zone committed
#    (catch_up.yaml). Nothing has been changed until this has passed for every
#    database, so a zone that is behind stops the run with the cluster as it
#    was.
# 1. Every other zone drops its subscriptions from the zone; then, if the zone
#    can be reached, the zone drops its own, which stops it reading from the
#    other zones; then every other zone drops the slots that served it, and
#    its node (remaining_zones.yaml). One database is finished before the
#    next is started, and in this order a run that stops anywhere leaves each
#    database either as it was or with the other zones no longer subscribing
#    to the zone, which the preflight recognizes as detached, so the next run
#    goes on. Apart from the zone's own subscriptions this never connects to
#    the zone, so it runs whether the zone is reachable or not, and the join
#    in setup_pgedge uses it on its own to release what a join that cannot be
#    resumed was holding.
# 2. If the zone can be reached, its databases are dropped
#    (reset_zone.yaml), and the next deployment run creates them again empty.
#
# The zone stays in the inventory throughout. Afterwards an ordinary
# deployment run refuses to go on while it is there, since the zone is no
# longer part of a cluster that holds data. Join it again with
# -e pgedge_join_zones=<N>, or take its hosts out of the inventory.
#
# Every step selects only what is still there, so a run that stopped partway
# picks up where it left off, and a second run changes nothing.

- include_tasks: preflight.yaml

- name: Wait for the other zones to have every write zone {{ remove_zone }} made
  include_tasks: catch_up.yaml
  loop: "{{ db_names }}"
  loop_control:
    loop_var: remove_zone_db
  when:
  - remove_zone_reachable | bool
  - inventory_hostname in remove_zone_answered

- name: Clear zone {{ remove_zone }} from the other zones
  include_tasks: remaining_zones.yaml
  loop: "{{ db_names }}"
  loop_control:
    loop_var: remove_zone_db
  vars:
    remove_zone_detach_host: >-
      {{ remove_zone_target.host
         if remove_zone_reachable | bool
            and ((hostvars[remove_zone_target.host].pgedge_spock_state.dbs
                  | default({}))[remove_zone_db] | default({})).spock_version
                | default(none)
         else '' }}
  when: inventory_hostname in remove_zone_answered

- name: Reset zone {{ remove_zone }}'s databases
  include_tasks: reset_zone.yaml
  when:
  - remove_zone_reachable | bool
  - inventory_hostname == remove_zone_target.host
