---

nodes_in_zone: >-
  {{ groups['pgedge'] |
  map('extract', hostvars) |
  selectattr('zone', 'eq', zone) |
  map(attribute='inventory_hostname') | list }}

proxies_in_zone: >-
  {{ groups['haproxy'] | default([]) |
  map('extract', hostvars) |
  selectattr('zone', 'eq', zone) |
  map(attribute='inventory_hostname') | list }}

backups_in_zone: >-
  {{ groups['backup'] | default([]) |
  map('extract', hostvars) |
  selectattr('zone', 'eq', zone) |
  map(attribute='inventory_hostname') | list }}

# Whether this cluster pools, answerable from any host. pgbouncer_enabled is a
# cluster-wide setting normally given to the 'pgedge' group, so a proxy or
# backup host does not carry it itself — and role defaults never appear in
# hostvars, hence the default on the extraction. init_server asserts the pgEdge
# nodes agree, so any one of them speaks for the cluster; every node is read
# anyway so that a disagreeing inventory renders a pooled endpoint and then
# fails validation, rather than the reverse.
cluster_is_pooled: >-
  {{ groups['pgedge'] | map('extract', hostvars) |
  map(attribute='pgbouncer_enabled', default=false) |
  map('bool') | select | list | length > 0 }}

# The servers a zone's pooled endpoint is built from, which is the whole zone or
# nothing at all — that is the point of making pooling cluster-wide. Both
# listeners in haproxy.cfg then carry the same nodes, differing only in the port
# they reach, so a Patroni failover can never land on a node the pooled endpoint
# does not know about.
pooled_nodes_in_zone: "{{ nodes_in_zone if cluster_is_pooled | bool else [] }}"

first_node_in_zone: "{{ nodes_in_zone | first }}"

spock_exception_behaviour: >-
  {{ exception_behaviour if exception_behaviour in (
       'discard', 'transdiscard', 'sub_disable'
     ) else 'transdiscard' }}

backup_type: "{{ backup_repo_type if backup_repo_type in ('ssh', 's3') else 'ssh' }}"

# The S3 repository, with whatever the inventory gave in backup_repo_params laid
# over these. uri_style, storage_ca_file, storage_port and storage_verify_tls
# are empty so that the configuration omits them and PgBackRest keeps its own
# defaults -- virtual-host addressing, the system CA bundle, port 443 and a
# verified certificate -- which are what AWS S3 itself wants. An S3-compatible
# store such as MinIO typically needs uri_style "path", often a port of its own,
# and a storage_ca_file when its certificate comes from a private authority.
# storage_ca_file is a path on the pgEdge nodes; nothing here copies it there.
# storage_verify_tls is a boolean, and false is for test environments only: it
# accepts any certificate at all.

default_repo_params:
  region: "us-east-1"
  endpoint: "s3.amazonaws.com"
  bucket: "pgbackrest"
  access_key: ""
  secret_key: ""
  uri_style: ""
  storage_ca_file: ""
  storage_port: ""
  storage_verify_tls: ""

backup_params: "{{ default_repo_params | combine(backup_repo_params) }}"

# The account Ansible logs in to these hosts as, which is what the backup
# repository belongs to by default.
#
# ansible_user first, because it is a connection variable and says who Ansible
# connects as. ansible_user_id is a *fact*, and a fact records who the setup
# module ran as -- so a play that gathers facts under become records root, and
# every host in that run then believes the repository belongs to root. Fact
# caching spreads it: gathering is smart by default, so one play with
# play-level become poisons the value for every later play in the same run.
# PgBackRest refuses to run as root, which is the only reason this ever
# surfaces rather than silently building a repository in /home/root.
#
# ansible_user is undefined when neither the inventory nor remote_user names a
# user, so the fact remains the fallback -- no worse than before, and correct
# wherever the login user is actually configured, which every inventory in this
# collection does.

connection_user: "{{ ansible_user | default(ansible_user_id) }}"

# The pgBackRest stanza this zone reads and writes. Every zone keeps its own,
# because a stanza describes one physical cluster and the zones are independent
# ones. Derived here rather than repeated at each use: it names the directory a
# recovery restores from, so a value that differs between the archive command
# and the restore command is a cluster that cannot be recovered, and nothing
# would say so until the day it mattered.

backup_stanza: "pgedge-{{ cluster_name }}-{{ zone }}"

# Whether PgBackRest encrypts the repository itself, as opposed to leaving it to
# the storage underneath. "none" is PgBackRest's own spelling for the latter.
# Read by the configuration template and by init_server's validation, which have
# to agree: a repository configured to encrypt with no password is one
# PgBackRest refuses to write, and a password supplied where nothing encrypts is
# a false sense of one.

backup_repo_encrypted: "{{ backup_repo_cipher_type != 'none' }}"

# Whether this cluster has a backup repository to speak of, which decides
# whether Postgres archives WAL to pgBackRest and whether a recovery is possible
# at all. An S3 repository needs nothing but the setting, since the repository is
# the object store; an SSH repository is only reachable if some host offers it,
# which is backup_host or a member of the 'backup' group in this zone.
#
# setup_backrest gates its client configuration on this rather than on a backup
# server being named, which is what it used to do -- and what made an S3
# repository silently do nothing, since S3 mode has no server to name.

backup_repo_configured: >-
  {{ backup_type == 's3' or backup_host > '' or backups_in_zone | length > 0 }}

replica_from_backup: >-
  {{ patroni_replica_from_backup | bool and backup_repo_configured | bool }}

pg_service_name: >-
  {{ 
    'pgedge-postgres-' + pg_version|string if ansible_facts['os_family'] == 'RedHat' else
    'postgresql@' + pg_version|string + '-' + cluster_name if ansible_facts['os_family'] == 'Debian'
  }}

pg_config_dir: >-
  {{ 
    '/etc/postgresql/' + pg_version|string + '/' + cluster_name if ansible_facts['os_family'] == 'Debian'
    else pg_data
  }}

# Postgres configuration parameters, built in layers. The collection's defaults
# come first, the inventory's pg_parameters are laid over them, and the
# parameters the collection requires go last, so nothing an inventory says can
# displace them. init_server refuses an inventory that tries, rather than
# letting it believe a setting took effect.
#
# Every name is lower case. Postgres matches parameter names without regard to
# case, and a configuration holding both TimeZone and timezone is one where the
# winner depends on the order the lines happen to be written in.
#
# The defaults are what pgEdge needs to work well but an operator may
# reasonably tune. Values that should follow from the rest of the inventory,
# such as worker counts that grow with db_names, belong here as expressions.

pg_default_parameters:
  ssl: true
  timezone: UTC
  max_worker_processes: 12
  max_replication_slots: 16
  max_wal_senders: 16
  hot_standby_feedback: true
  spock.enable_ddl_replication: true
  spock.allow_ddl_from_functions: true
  spock.include_ddl_repset: true
  spock.conflict_resolution: last_update_wins
  spock.save_resolutions: true
  spock.conflict_log_level: DEBUG

# What the collection itself depends on: where Postgres listens and with which
# certificate, logical decoding and commit timestamps for Spock, the snowflake
# node number, and the archive commands, which follow the backup repository.
# Each of these is governed by some other setting, or by nothing at all.

pg_required_parameters: >-
  {{ {
       'port': pg_port | int,
       'listen_addresses': '0.0.0.0',
       'ssl_cert_file': pg_data ~ '/server.crt',
       'ssl_key_file': pg_data ~ '/server.key',
       'wal_level': 'logical',
       'track_commit_timestamp': true,
       'archive_mode': true,
       'snowflake.node': zone | int,
       'spock.exception_behaviour': spock_exception_behaviour,
     }
     | combine({
         'archive_command': 'pgbackrest --stanza=' ~ backup_stanza ~ ' archive-push %p',
         'restore_command': 'pgbackrest --stanza=' ~ backup_stanza ~ ' archive-get %f %p',
       } if backup_repo_configured | bool else {
         'archive_command': '/bin/true',
       })
     | combine({
         'output_plugin_libraries': 'pgoutput, test_decoding, spock_output',
       } if pg_supports_output_plugin_libraries | default(false) | bool else {}) }}

# Parameters an inventory may not set, each with the reason or what to set
# instead. The
# required parameters above are refused too, whether or not they appear here;
# the rest are ones Patroni sets on its own in an HA zone, or paths the
# collection's tasks depend on.

pg_protected_parameters:
  port: "set pg_port instead"
  listen_addresses: "Postgres listens on every address"
  ssl_cert_file: "the collection issues the certificate"
  ssl_key_file: "the collection issues the certificate"
  wal_level: "Spock requires logical"
  track_commit_timestamp: "Spock requires it"
  archive_mode: "set by the backup_* settings"
  archive_command: "set by the backup_* settings"
  restore_command: "set by the backup_* settings"
  snowflake.node: "set zone instead"
  spock.exception_behaviour: "set exception_behaviour instead"
  output_plugin_libraries: "the collection sets it where supported"
  hot_standby: "Patroni sets it"
  cluster_name: "Patroni sets it"
  data_directory: "set pg_data instead"
  config_file: "the collection places it"
  hba_file: "use custom_hba_rules instead"
  ident_file: "the collection places it"
  unix_socket_directories: "the collection's tasks connect through /var/run/postgresql"

# shared_preload_libraries is a list in all but syntax, so the inventory's
# entries join the collection's rather than replacing them. Spock and snowflake
# always load, first; pg_stat_statements loads unless the inventory sets the
# parameter to null; whatever the inventory names comes after.

pg_required_preload_libraries:
- spock
- snowflake

pg_default_preload_libraries:
- pg_stat_statements

# pg_parameters with every name in lower case.

pg_user_parameters: >-
  {{ dict(pg_parameters | dict2items | map(attribute='key') | map('lower')
          | zip(pg_parameters | dict2items | map(attribute='value'))) }}

pg_user_preload_libraries: >-
  {{ ([] if pg_user_parameters.shared_preload_libraries | default(none) is none
      else pg_user_parameters.shared_preload_libraries.split(',')
      if pg_user_parameters.shared_preload_libraries is string
      else pg_user_parameters.shared_preload_libraries)
     | map('string') | map('trim') | reject('equalto', '') | list }}

pg_preload_libraries: >-
  {{ (pg_required_preload_libraries
      + ([] if 'shared_preload_libraries' in pg_user_parameters
              and pg_user_parameters.shared_preload_libraries is none
         else pg_default_preload_libraries)
      + pg_user_preload_libraries) | unique | list }}

pg_merged_parameters: >-
  {{ pg_default_parameters
     | combine(pg_user_parameters, pg_required_parameters,
               {'shared_preload_libraries': pg_preload_libraries | join(', ')}) }}

# The configuration as Postgres is given it: nulls dropped, and booleans
# spelled on and off. Every template and task that writes parameters reads
# this, so the simple and HA paths cannot drift apart.

pg_effective_parameters: >-
  {{ pg_merged_parameters | dict2items | rejectattr('value', 'none') | items2dict
     | combine(dict(pg_merged_parameters | dict2items
                    | selectattr('value', 'sameas', true)
                    | map(attribute='key') | product(['on'])),
               dict(pg_merged_parameters | dict2items
                    | selectattr('value', 'sameas', false)
                    | map(attribute='key') | product(['off']))) }}

# The subset of the above an HA node writes into postgresql.conf for the time
# it runs outside Patroni. Patroni moves that file aside as
# postgresql.base.conf and includes it beneath its own, so anything else
# written there would outlive its removal from the zone's configuration.

pg_standalone_parameters: >-
  {{ pg_effective_parameters | dict2items
     | selectattr('key', 'in', pg_required_parameters.keys() | list
                               + ['shared_preload_libraries'])
     | items2dict }}

# pgBouncer's packaging differs by platform and neither layout needs new
# directories or a logrotate file, provided the native paths are used. The RHEL
# package creates a dedicated pgbouncer user and owns /var/log/pgbouncer and
# /run/pgbouncer (the latter via tmpfiles.d); the Debian package ships no such
# user — its unit runs as postgres — and logs beside Postgres, where
# pgedge-postgresql-common's logrotate glob already covers the file.

pgbouncer_user: >-
  {{
    'pgbouncer' if ansible_facts['os_family'] == 'RedHat' else
    'postgres' if ansible_facts['os_family'] == 'Debian'
  }}

pgbouncer_group: "{{ pgbouncer_user }}"

pgbouncer_log_file: >-
  {{
    '/var/log/pgbouncer/pgbouncer.log' if ansible_facts['os_family'] == 'RedHat' else
    '/var/log/postgresql/pgbouncer.log' if ansible_facts['os_family'] == 'Debian'
  }}

pgbouncer_pid_file: >-
  {{
    '/run/pgbouncer/pgbouncer.pid' if ansible_facts['os_family'] == 'RedHat' else
    '/var/run/postgresql/pgbouncer.pid' if ansible_facts['os_family'] == 'Debian'
  }}

# Where the pooler puts its unix socket. pgBouncer's compiled default is /tmp,
# which is world-writable and shared with everything else on the host, so the
# console and every local client resolve through a path no package owns. Each
# platform already has a directory for this: RHEL's package owns /run/pgbouncer
# (created 0700 pgbouncer by its tmpfiles.d, which also holds the pidfile), and
# Debian's shipped configuration uses /var/run/postgresql, beside Postgres's own
# socket, where its pooler already runs as postgres.
#
# The 0700 on RHEL is the difference worth knowing: only root and the pgbouncer
# user can reach a socket there, so local administration is root's. On Debian
# the directory is 2775 postgres, so root and postgres both reach it. Neither
# platform needs a directory this role creates.

pgbouncer_socket_dir: >-
  {{
    '/run/pgbouncer' if ansible_facts['os_family'] == 'RedHat' else
    '/var/run/postgresql' if ansible_facts['os_family'] == 'Debian'
  }}

# Where setup_pgbouncer stages the certificate it serves clients from. The
# pooler needs its own copy because on RHEL it runs as pgbouncer while PGDATA is
# 0700 postgres, so Postgres's copy is unreadable to it. Debian's pooler runs as
# postgres and could read PGDATA directly, but it stages too: one code path and
# one pair of paths in pgbouncer.ini is worth more than saving a file copy.
# These are the destinations, not a knob — point pgbouncer_tls_cert_source at a
# different certificate to change what is served.

pgbouncer_tls_cert_file: /etc/pgbouncer/server.crt
pgbouncer_tls_key_file: /etc/pgbouncer/server.key

# The pooler's own client-authentication rules, beside its configuration for the
# same reason the certificate is: on RHEL the pooler runs as pgbouncer and
# cannot read Postgres's pg_hba.conf inside a 0700 PGDATA. A destination rather
# than a knob — the rules themselves come from custom_hba_rules and
# pgbouncer_hba_rules.

pgbouncer_hba_file: /etc/pgbouncer/pg_hba.conf

patroni_config_dir: "/etc/patroni"

patroni_service_name: >-
  {{
    'patroni@' + pg_version|string + '-' + cluster_name if ansible_facts['os_family'] == 'Debian'
    else 'patroni'
  }}

patroni_config_file: >-
  {{
    pg_version|string + '-' + cluster_name + '.yml' if ansible_facts['os_family'] == 'Debian'
    else 'patroni.yml'
  }}

# Whether Patroni's store is the etcd this collection hosts on the pgEdge nodes:
# an etcd type with no parameters of its own, which the template fills in with
# the local member below. Any other store -- an external etcd, Consul -- is
# somebody else's, and is only ever asked to forget this cluster.

patroni_dcs_managed: >-
  {{ patroni_dcs.type | default('etcd3') in ('etcd', 'etcd3') and
     patroni_dcs.parameters is not defined }}

# Set default Patroni DCS values here since many of them depend on inventory
# settings. The template will substitute user dcs values if provided.

default_patroni_dcs_params:
  host: "{{ inventory_hostname }}:2379"
  ttl: 30
  protocol: "https"
  cacert: "{{ patroni_tls_dir }}/ca.crt"
  cert: "{{ patroni_tls_dir }}/patroni.crt"
  key: "{{ patroni_tls_dir }}/patroni.key"
