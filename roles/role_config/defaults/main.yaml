---

cluster_name: demo
repo_name: release
repo_prefix: ""
zone: 1
pg_version: 17
spock_version: "5.0.4"
tls_validity_days: 3560

db_names:
- demo
db_user: admin
db_password: secret

pgedge_user: pgedge
pgedge_password: secret

replication_user: replicator
replication_password: secret

custom_hba_rules: []

# pgBouncer connection pooler. Pooling is a property of the cluster, the way
# is_ha_cluster is: set pgbouncer_enabled on the 'pgedge' group and every pgEdge
# node gets a pooler in front of its own Postgres. It is deliberately not a
# per-node choice. A pooled zone's HAProxy listener follows the Patroni leader,
# so a zone that pools only some of its nodes has an endpoint that breaks the
# moment the leader moves to one of the others, and init_server rejects a
# cluster whose nodes disagree.

pgbouncer_enabled: false

# Only the settings more than one role reads live here. The pooler's own
# tunables — listen address, pool mode, sizes, TLS, startup parameters — are
# defaults of the roles that write them: install_pgbouncer for the package,
# setup_pgbouncer for pgbouncer.ini. Override any of them from the inventory
# exactly the same way.

pgbouncer_port: 6432
# Read by setup_haproxy as well as setup_pgbouncer: the pooled listener's
# maxconn is derived from it, so it cannot be a setup_pgbouncer default.
pgbouncer_max_client_conn: 1000
# pgBouncer keeps no list of Postgres passwords. It logs in as this role and
# calls a SECURITY DEFINER lookup to fetch the requested user's stored SCRAM
# verifier, so any Postgres role can use the pooled endpoint — including roles
# created long after deployment. setup_postgres creates the role and the lookup
# wherever pooling is on; this password is the only one written to disk, in
# pgBouncer's auth_file, because the admin console cannot use the lookup.
pgbouncer_auth_user: pgbouncer_auth
pgbouncer_auth_password: secret
# Extra client-authentication rules for the pooled endpoint, in the same shape
# as custom_hba_rules, and beside it because it is the same kind of decision.
# The pooler enforces its own HBA file: it admits the cluster's own nodes, this
# zone's proxies, the node's loopback and local administration, and nothing
# else, so an application reaching the pooler across the network has to be named
# somewhere. Naming it in custom_hba_rules admits it to both endpoints; naming
# it here admits it to the pooled endpoint alone, which is the narrower grant
# and usually the one that was meant.
pgbouncer_hba_rules: []

is_ha_cluster: false
exception_behaviour: "transdiscard"

proxy_port: 5432
proxy_node: ''

# The proxy-layer port for the pooled listener, mirroring how proxy_port fronts
# pg_port: pooler_port fronts each pooled node's pgbouncer_port. It is a
# separate setting because HAProxy may share a host with Postgres and pgBouncer
# (see docs/configuration/proxy.md), and identical values collide there.
# Nothing is emitted on this port unless pgbouncer_enabled is set.
pooler_port: 6432

pg_port: 5432

pg_home: >-
  {{ 
    "/var/lib/pgsql" if ansible_facts['os_family'] == "RedHat" 
    else
    "/var/lib/postgresql" if ansible_facts['os_family'] == 'Debian'
  }}

pg_path: >-
  {{
    "/usr/pgsql-" + pg_version|string if ansible_facts['os_family'] == "RedHat"
     else
    "/usr/lib/postgresql/" + pg_version|string if ansible_facts['os_family'] == 'Debian'
  }}

pg_data: >-
  {{ 
    pg_home + "/" + pg_version|string + "/data" if ansible_facts['os_family'] == "RedHat"
    else
    pg_home + "/" + pg_version|string + "/" + cluster_name if ansible_facts['os_family'] == 'Debian' 
  }}

backup_host: ""
backup_user: backrest
backup_password: secret

backup_repo_type: ssh

# The S3 repository's settings, merged over default_repo_params in this role's
# vars, so an inventory names only the keys it changes. Here rather than in
# setup_backrest, which renders them, because init_server validates them too.

backup_repo_params: {}

# How the backup repository is encrypted, and with what.
#
# The password has no default, and that is the point. It cannot be generated,
# because a generated one has to satisfy two things at once that nothing can:
# it must be the same on every run -- a repository whose cipher changed is a
# repository that can no longer be read -- and it must not be guessable. This
# parameter used to be derived from cluster_name and zone, which made it
# perfectly reproducible and perfectly public: anyone who knew the cluster's
# name could decrypt its backups, which is not encryption in any sense worth
# having. Only a secret the operator keeps can be both.
#
# Set backup_repo_cipher_type to "none" where the storage layer encrypts
# instead -- S3 bucket default encryption, SSE-KMS, an encrypted filesystem --
# which is a legitimate arrangement and the one that permits key rotation,
# since PgBackRest cannot rotate its own. No password is then needed or
# emitted, and init_server stops asking for one.
#
# Upgrading a cluster deployed before this changed: its repository is encrypted
# with the old derived value, and the old derivation is public, so the value can
# be recovered and set explicitly. See docs/configuration/backup.md.

backup_repo_cipher: ""
backup_repo_cipher_type: aes-256-cbc
# Both default to the account Ansible logs in as. See connection_user in this
# role's vars for why that is not ansible_user_id: a fact gathered under become
# reports root, and a repository path of /home/root is not something anyone
# would notice until a restore.
backup_repo_user: "{{ connection_user }}"
backup_repo_path: "/home/{{ connection_user }}"

# Whether Patroni rebuilds a replica from the backup repository instead of
# streaming a fresh pg_basebackup from the zone's leader. Off by default, so an
# existing cluster renders the replica configuration it already had. Turning it
# on is worth it for a large database -- a delta restore moves only the blocks
# that changed, and it reads from the repository rather than from the leader --
# but it makes replica creation depend on the repository being healthy, so it is
# a decision an inventory should make deliberately. pg_basebackup remains the
# fallback either way: Patroni walks the method list in order.

patroni_replica_from_backup: false

patroni_tls_dir: "/etc/patroni/tls"

# The certificate authority that signs etcd's server and peer certificates and
# every node's Patroni client certificate. Both PEM blobs, and both empty by
# default, which leaves the collection generating one on the controller exactly
# as it always has.
#
# Supply them -- from Ansible Vault, beside the passwords -- when the authority
# should be managed rather than left in a gitignored directory beside the
# playbook. It is the one artifact there that nothing can recreate: setup_etcd
# creates it and then skips itself forever after, so a controller that loses it
# can no longer add a replica, rebuild a node, or re-run the deployment against
# that cluster.
#
# Set them together or not at all, and do not change them on a live cluster: the
# nodes trust the authority their etcd was built with, and signing against a
# different one leaves none of them able to reach the store.

etcd_ca_cert: ""
etcd_ca_key: ""

# Where each node keeps its etcd configuration, its data and the certificates
# etcd serves with. setup_etcd and install_etcd use them, and so does everything
# that has to reach a node's etcd without running either role: the certificate
# authority check reads the authority each existing member trusts, and
# wipe_cluster erases all three.

etcd_config_dir: "/etc/etcd"
etcd_data_dir: "/var/lib/etcd"
etcd_tls_dir: "/etc/etcd/tls"

# Patroni cluster name within the DCS. This is the second half of every key
# Patroni writes, and the collection derives it from values that are identical
# on every node. A store shared by more than one zone needs a distinct scope
# per zone so the zones do not claim the same keys.

patroni_scope: "{{ pg_version }}-{{ cluster_name }}"

# Key prefix Patroni uses within the DCS, forming the first half of every key.
# The collection-managed etcd cluster is deployed per zone, so every zone can
# safely share this default. A store that spans zones needs each zone to write
# to a distinct key, which patroni_scope usually provides; change this instead
# when the prefix itself must differ, such as when the store grants access per
# prefix.

patroni_namespace: /db/

patroni_dcs:
  type: etcd3
  # parameters: intentionally omitted to trigger default substitution

# Settings the ColdFront tiered-storage add-on shares with Lakekeeper,
# its Iceberg catalog. They live here, rather than in the role that
# installs each service, because both setup_coldfront and
# setup_lakekeeper need to agree on them: the archiver writes to the
# object store directly, and Lakekeeper's warehouse points at the same
# store to prove its credentials by writing to it. A setting only one
# role reads belongs in that role's own defaults instead, the way
# coldfront_db lives in setup_coldfront's.

lakekeeper_host: ""
lakekeeper_port: 8181
lakekeeper_warehouse: wh

# Lakekeeper also serves Prometheus metrics on a second port, and exits
# at startup if that port is taken. Shared because install_lakekeeper
# checks it for collisions and setup_lakekeeper writes it into the
# service environment.
lakekeeper_metrics_port: 9000

# ColdFront's cold tier writes to any S3-compatible object store. Real
# AWS S3, MinIO, and a self-hosted store are all equally valid, and
# this collection deploys none of them. coldfront_s3_endpoint stays
# empty to use AWS's own endpoint resolution; set it to point at
# another store instead.

coldfront_s3_endpoint: ""
coldfront_s3_region: us-east-1
coldfront_s3_bucket: iceberg
coldfront_s3_access_key: ""
coldfront_s3_secret_key: ""
coldfront_s3_path_style: true

# shared_preload_libraries for a pgEdge Distributed Postgres instance.
# setup_postgres templates postgresql.conf from this list rather than a
# literal string so setup_coldfront can extend it (pg_duckdb, coldfront)
# without overwriting the entries pgEdge itself needs.

pgedge_preload_libraries:
- spock
- snowflake
- pg_stat_statements
