---

cluster_name: demo
repo_name: release
repo_prefix: ""
zone: 1
pg_version: 17
spock_version: "5.0.4"
tls_validity_days: 3560

db_names:
- demo
db_user: admin
db_password: secret

pgedge_user: pgedge
pgedge_password: secret

replication_user: replicator
replication_password: secret

custom_hba_rules: []

is_ha_cluster: false
exception_behaviour: "transdiscard"

proxy_port: 5432
proxy_node: ''

pg_port: 5432

pg_home: >-
  {{ 
    "/var/lib/pgsql" if ansible_facts['os_family'] == "RedHat" 
    else
    "/var/lib/postgresql" if ansible_facts['os_family'] == 'Debian'
  }}

pg_path: >-
  {{
    "/usr/pgsql-" + pg_version|string if ansible_facts['os_family'] == "RedHat"
     else
    "/usr/lib/postgresql/" + pg_version|string if ansible_facts['os_family'] == 'Debian'
  }}

pg_data: >-
  {{ 
    pg_home + "/" + pg_version|string + "/data" if ansible_facts['os_family'] == "RedHat"
    else
    pg_home + "/" + pg_version|string + "/" + cluster_name if ansible_facts['os_family'] == 'Debian' 
  }}

backup_host: ""
backup_user: backrest
backup_password: secret

backup_repo_type: ssh
backup_repo_user: "{{ ansible_user_id }}"
backup_repo_path: "/home/{{ ansible_user_id }}"

patroni_tls_dir: "/etc/patroni/tls"

# Patroni cluster name within the DCS. This is the second half of every key
# Patroni writes, and the collection derives it from values that are identical
# on every node. A store shared by more than one zone needs a distinct scope
# per zone so the zones do not claim the same keys.

patroni_scope: "{{ pg_version }}-{{ cluster_name }}"

# Key prefix Patroni uses within the DCS, forming the first half of every key.
# The collection-managed etcd cluster is deployed per zone, so every zone can
# safely share this default. A store that spans zones needs each zone to write
# to a distinct key, which patroni_scope usually provides; change this instead
# when the prefix itself must differ, such as when the store grants access per
# prefix.

patroni_namespace: /db/

patroni_dcs:
  type: etcd3
  # parameters: intentionally omitted to trigger default substitution
