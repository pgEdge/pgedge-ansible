---

- name: Ensure the wipe was asked for explicitly
  assert:
    that:
    - wipe_confirm | bool
    fail_msg: >-
      This role stops Postgres, Patroni, pgBouncer and etcd on every pgEdge
      node and erases their configuration and data. Backup repositories are
      left alone, but nothing else it removes can be recovered from the
      cluster. Re-run with -e wipe_confirm=true once that is what you mean to
      do.
  run_once: true

# A zone's data survives a wipe only in its repository, so refuse to wipe a zone
# whose repository holds no backup of the cluster that is there now. Only a zone
# that has a cluster is asked: hosts that never got one have nothing to lose.
#
# Asked from the zone's first node, through its own pgbackrest.conf, which
# reaches the repository however the zone is configured. info exits 0 even for
# a repository it could not read, so the stanza's status code is what says it
# looked inside: 0, 1 and 2 are the codes that mean it did.
#
# A backup counts only if it was taken of this cluster. A stanza a recovery
# upgraded also lists the backups of the cluster it replaced, under an older db
# entry, and those cannot bring this one back.

- block:
  - name: Check whether this zone's first node holds a cluster
    stat:
      path: "{{ pg_data }}/global/pg_control"
    register: wipe_pg_control
    become: true

  - name: Read the system identifier of the cluster this zone holds
    command:
      argv:
      - "{{ pg_path }}/bin/pg_controldata"
      - "-D"
      - "{{ pg_data }}"
    register: wipe_control_data
    changed_when: false
    check_mode: false
    become: true
    become_user: postgres
    when: wipe_pg_control.stat.exists

  - name: Ask the repository what it holds for this zone
    command:
      argv:
      - pgbackrest
      - "--stanza={{ backup_stanza }}"
      - "--output=json"
      - info
    register: wipe_repo_info
    changed_when: false
    check_mode: false
    failed_when: false
    become: true
    become_user: postgres
    when:
    - wipe_pg_control.stat.exists
    - backup_repo_configured | bool

  - name: Ensure the repository holds a backup of the cluster being wiped
    vars:
      wipe_stanza: >-
        {{ (wipe_repo_info.stdout | from_json |
            selectattr('name', 'eq', backup_stanza) | first | default({}))
           if wipe_repo_info.rc | default(1) == 0 else {} }}
      wipe_system_id: >-
        {{ wipe_control_data.stdout_lines |
           select('search', 'Database system identifier') | first |
           split(':') | last | trim }}
      wipe_db_ids: >-
        {{ wipe_stanza.db | default([]) |
           selectattr('system-id', 'eq', wipe_system_id | int) |
           map(attribute='id') | list }}
      wipe_backups: >-
        {{ wipe_stanza.backup | default([]) |
           selectattr('database.id', 'in', wipe_db_ids) | list }}
    assert:
      that:
      - backup_repo_configured | bool
      - wipe_stanza.status.code | default(-1) | int in [0, 1, 2]
      - wipe_backups | length > 0
      fail_msg: >-
        {% if not backup_repo_configured | bool %}
        Zone {{ zone }} has no backup repository configured,
        {% elif wipe_stanza.status.code | default(-1) | int not in [0, 1, 2] %}
        pgbackrest could not read stanza {{ backup_stanza }} from
        {{ inventory_hostname }}
        ({{ (wipe_stanza.repo | default([]) |
             map(attribute='status.message') | join('; '))
            or (wipe_repo_info.stderr | default('') | trim) }}),
        {% else %}
        Stanza {{ backup_stanza }} holds no backup of the cluster running in
        zone {{ zone }} (system identifier {{ wipe_system_id }}),
        {% endif %}
        so wiping the zone would lose its data for good. Nothing has been
        touched. Take a backup first, or re-run with
        -e wipe_without_backup=true if the data is not worth keeping.
    when: wipe_pg_control.stat.exists

  when:
  - inventory_hostname in groups.pgedge
  - inventory_hostname == first_node_in_zone
  - not wipe_without_backup | bool
