---

# ColdFront's role, database and extensions: the NOLOGIN role pg_duckdb gates
# DuckDB execution on, and the database of its own that ColdFront's tiered
# storage lives in. This runs after setup_postgres, or setup_patroni in an HA
# zone, and before setup_pgedge.
#
# In mesh mode coldfront_db is one of db_names, which setup_pgedge puts into
# Spock, and the bakery's claim and release go through dblink. Spock replicates
# a CREATE EXTENSION issued once a database has a Spock node to the other
# nodes, which create the extension themselves, so all of them are created
# here, before setup_pgedge, as upstream's mesh setup does.
#
# Under HA this runs on each zone's leader only, and the replicas receive the
# results through physical replication. After a failover the leader need not
# be first_node_in_zone, so each node asks its own Postgres whether it is a
# standby, as setup_coldfront does. A replica Patroni is still bringing up
# does not answer at once, so the question is asked until it does.

- name: Ask Postgres whether this node is a standby
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: postgres
    login_unix_socket: /var/run/postgresql
    query: >-
      SELECT pg_is_in_recovery() AS standby,
             current_setting('shared_preload_libraries') AS loaded
  register: coldfront_db_node
  until: coldfront_db_node is success
  retries: 30
  delay: 2
  changed_when: false
  become: true
  become_user: postgres

# Creating the extensions needs ColdFront's libraries loaded, and Postgres
# loads them only when it starts. A restart that pg_allow_restart held back
# stops the run here, with its reason, rather than at CREATE EXTENSION.

- name: Ensure Postgres has loaded ColdFront's libraries
  assert:
    that:
    - "'pg_duckdb' in loaded"
    - "'coldfront' in loaded"
    fail_msg: >-
      Postgres on {{ inventory_hostname }} has loaded
      {{ loaded | join(', ') }}, not ColdFront's libraries, so ColdFront's
      extensions cannot be created yet. Postgres loads them when it restarts,
      which setup_postgres, or setup_patroni in an HA zone, does only where
      pg_allow_restart allows. Restart Postgres, then run setup_coldfront_db
      again.
    quiet: true
  vars:
    loaded: >-
      {{ coldfront_db_node.query_result[0].loaded
         | split(',') | map('trim') | list }}

- block:
  - name: Create the role pg_duckdb gates DuckDB execution on
    community.postgresql.postgresql_user:
      name: "{{ coldfront_duckdb_role }}"
      role_attr_flags: NOLOGIN
      login_port: "{{ pg_port }}"
      login_unix_socket: /var/run/postgresql

  - name: Create the ColdFront database
    community.postgresql.postgresql_db:
      name: "{{ coldfront_db }}"
      login_port: "{{ pg_port }}"
      login_unix_socket: /var/run/postgresql

  - name: Create the ColdFront extensions
    community.postgresql.postgresql_ext:
      name: "{{ item }}"
      login_db: "{{ coldfront_db }}"
      login_port: "{{ pg_port }}"
      login_unix_socket: /var/run/postgresql
    loop: >-
      {{ (['dblink'] if coldfront_mesh | bool else [])
         + ['pg_duckdb', 'coldfront'] }}

  become: true
  become_user: postgres
  when: not coldfront_db_node.query_result[0].standby
