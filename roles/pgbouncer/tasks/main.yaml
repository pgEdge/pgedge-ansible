---

# Install and configure pgBouncer on each pgEdge node. pgBouncer listens on
# pgbouncer_port and forwards to the node's local Postgres on 127.0.0.1. The
# local pg_hba.conf already permits "host all all 127.0.0.1/32 scram-sha-256",
# so Patroni is not modified.

- name: Install pgBouncer
  package:
    name: "{{ pgbouncer_package }}"
    state: present
  become: true
  retries: 5
  delay: 20
  register: pgbouncer_pkg
  until: pgbouncer_pkg is success

- name: Ensure pgBouncer configuration directory exists
  file:
    path: /etc/pgbouncer
    state: directory
    owner: pgbouncer
    group: pgbouncer
    mode: "0750"
  become: true

# Write the userlist with plain passwords so pgBouncer can both verify clients
# and authenticate to the backend Postgres. auth_type = scram-sha-256 keeps
# SCRAM on the wire; pgBouncer derives the verifier from the plain password.
- name: Write pgBouncer userlist
  copy:
    dest: /etc/pgbouncer/userlist.txt
    owner: pgbouncer
    group: pgbouncer
    mode: "0640"
    content: |
      {% for u in pgbouncer_userlist %}
      "{{ u.user }}" "{{ u.password }}"
      {% endfor %}
  become: true
  notify: restart pgbouncer

- name: Write pgBouncer configuration
  template:
    src: pgbouncer.ini.j2
    dest: /etc/pgbouncer/pgbouncer.ini
    owner: pgbouncer
    group: pgbouncer
    mode: "0640"
  become: true
  notify: restart pgbouncer

- name: Ensure pgBouncer is enabled and running
  service:
    name: pgbouncer
    enabled: true
    state: started
  become: true

# --- Resilience -----------------------------------------------------------
# 1) Always restart pgBouncer, forever (StartLimitIntervalSec=0 disables the
#    systemd rate-limit that would otherwise give up after a few crashes).
- name: Ensure pgBouncer systemd drop-in directory exists
  file:
    path: /etc/systemd/system/pgbouncer.service.d
    state: directory
    mode: "0755"
  become: true

- name: Configure pgBouncer to always restart
  copy:
    dest: /etc/systemd/system/pgbouncer.service.d/override.conf
    mode: "0644"
    content: |
      [Unit]
      StartLimitIntervalSec=0

      [Service]
      Restart=always
      RestartSec=2
  become: true
  notify: restart pgbouncer

# 2) A per-connection HAProxy agent that reports pgBouncer liveness ("up" /
#    "down"). HAProxy uses it to mark a node's pooler down and fall back to
#    direct Postgres, independent of the Patroni leader health check.
- name: Install the pgBouncer HAProxy agent-check script
  template:
    src: pgbouncer-agent-check.sh.j2
    dest: /usr/local/bin/pgbouncer-agent-check.sh
    mode: "0755"
  become: true

- name: Install the pgBouncer agent per-connection service
  copy:
    dest: /etc/systemd/system/pgbouncer-agent@.service
    mode: "0644"
    content: |
      [Unit]
      Description=HAProxy agent-check for pgBouncer (per connection)

      [Service]
      ExecStart=/usr/local/bin/pgbouncer-agent-check.sh
      StandardInput=socket
      StandardOutput=socket
  become: true
  notify: restart pgbouncer-agent

- name: Install the pgBouncer agent socket
  template:
    src: pgbouncer-agent.socket.j2
    dest: /etc/systemd/system/pgbouncer-agent.socket
    mode: "0644"
  become: true
  notify: restart pgbouncer-agent

- name: Ensure the pgBouncer agent socket is enabled and running
  systemd:
    name: pgbouncer-agent.socket
    enabled: true
    state: started
    daemon_reload: true
  become: true
