---

# Install and configure pgBouncer on each pgEdge node. pgBouncer listens on
# pgbouncer_port and forwards to the node's local Postgres on 127.0.0.1. The
# local pg_hba.conf already permits "host all all 127.0.0.1/32 scram-sha-256",
# so Patroni is not modified.

- name: Install pgBouncer
  package:
    name: "{{ pgbouncer_package }}"
    state: present
  become: true
  retries: 5
  delay: 20
  register: pgbouncer_pkg
  until: pgbouncer_pkg is success

- name: Ensure pgBouncer configuration directory exists
  file:
    path: /etc/pgbouncer
    state: directory
    owner: pgbouncer
    group: pgbouncer
    mode: "0750"
  become: true

# Write the userlist with plain passwords so pgBouncer can both verify clients
# and authenticate to the backend Postgres. auth_type = scram-sha-256 keeps
# SCRAM on the wire; pgBouncer derives the verifier from the plain password.
- name: Write pgBouncer userlist
  copy:
    dest: /etc/pgbouncer/userlist.txt
    owner: pgbouncer
    group: pgbouncer
    mode: "0640"
    content: |
      {% for u in pgbouncer_userlist %}
      "{{ u.user }}" "{{ u.password }}"
      {% endfor %}
  become: true
  notify: restart pgbouncer

- name: Write pgBouncer configuration
  template:
    src: pgbouncer.ini.j2
    dest: /etc/pgbouncer/pgbouncer.ini
    owner: pgbouncer
    group: pgbouncer
    mode: "0640"
  become: true
  notify: restart pgbouncer

- name: Ensure pgBouncer is enabled and running
  service:
    name: pgbouncer
    enabled: true
    state: started
  become: true
