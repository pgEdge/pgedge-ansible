---

# Install and configure pgBouncer on each pgEdge node. pgBouncer listens on
# pgbouncer_port and forwards to the node's local Postgres on 127.0.0.1. The
# local pg_hba.conf already permits "host all all 127.0.0.1/32 scram-sha-256",
# so Patroni is not modified.

- name: Install pgBouncer
  package:
    name: "{{ pgbouncer_package }}"
    state: present
  become: true
  retries: 5
  delay: 20
  register: pgbouncer_pkg
  until: pgbouncer_pkg is success

- name: Ensure pgBouncer configuration directory exists
  file:
    path: /etc/pgbouncer
    state: directory
    owner: pgbouncer
    group: pgbouncer
    mode: "0750"
  become: true

# Read the SCRAM verifiers straight from pg_shadow (requires superuser, so run
# as the postgres peer user). pgBouncer uses these to authenticate clients and
# to log in to the local Postgres (SCRAM pass-through), so no plaintext
# passwords are stored.
- name: Collect SCRAM secrets for the pgBouncer users
  community.postgresql.postgresql_query:
    login_unix_socket: /var/run/postgresql
    login_port: "{{ pg_port }}"
    login_db: postgres
    query: "SELECT usename, passwd FROM pg_shadow WHERE usename = ANY(%s) AND passwd IS NOT NULL"
    positional_args:
    - "{{ pgbouncer_users }}"
  become: true
  become_user: postgres
  register: pgbouncer_shadow

- name: Write pgBouncer userlist
  copy:
    dest: /etc/pgbouncer/userlist.txt
    owner: pgbouncer
    group: pgbouncer
    mode: "0640"
    content: |
      {% for row in pgbouncer_shadow.query_result %}
      "{{ row.usename }}" "{{ row.passwd }}"
      {% endfor %}
  become: true
  notify: restart pgbouncer

- name: Write pgBouncer configuration
  template:
    src: pgbouncer.ini.j2
    dest: /etc/pgbouncer/pgbouncer.ini
    owner: pgbouncer
    group: pgbouncer
    mode: "0640"
  become: true
  notify: restart pgbouncer

- name: Ensure pgBouncer is enabled and running
  service:
    name: pgbouncer
    enabled: true
    state: started
  become: true
