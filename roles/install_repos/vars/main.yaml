---

repo: "{{ repo_name if repo_name in ('release', 'staging', 'daily') else 'release' }}"

# Where pgedge-subscription-manager keeps the client certificate. It differs by
# family and the manager derives the same paths itself.
pgedge_cert_dir: "{{ '/etc/pki/pgedge' if ansible_os_family == 'RedHat' else '/etc/pgedge' }}"

# The owner and mode pgedge-subscription-manager gives the key. apt drops
# privileges to _apt before fetching, so on Debian the key belongs to _apt;
# dnf does not, so on RHEL it stays root's. Writing the key with anything else
# would undo the manager's work on every run, and leave apt unable to read the
# key until the manager ran again.
pgedge_cert_key_owner: "{{ 'root' if ansible_os_family == 'RedHat' else '_apt' }}"
pgedge_cert_key_mode: "{{ '0600' if ansible_os_family == 'RedHat' else '0400' }}"

# The repository definition pgedge-release installs, and the line that the
# manager's own status check takes to mean the repositories are enabled.
pgedge_repo_file: "{{ '/etc/yum.repos.d/pgedge.repo' if ansible_os_family == 'RedHat' else '/etc/apt/sources.list.d/pgedge.sources' }}"

# Everything below describes a repo_url of the site's own, in the repo_layout
# it was given. pgEdge's own repository is defined by its pgedge-release
# package instead, and none of this applies to it.

repo_base: "{{ repo_url | regex_replace('/+$', '') }}"

# A mirror names each Debian-family platform for its distribution and release
# number, as debian12 or ubuntu24.04.

apt_platform: >-
  {{ ansible_distribution | lower }}{{
     ansible_distribution_version if ansible_distribution == 'Ubuntu'
     else ansible_distribution_major_version }}

apt_repo_uri: >-
  {{ repo_base ~ '/apt/' ~ apt_platform if repo_layout == 'mirror'
     else repo_base ~ '/' ~ repo ~ '/' ~ ansible_distribution_release }}

# Both layouts keep the key pgEdge signs its RPMs with under keys/. The mirror
# keeps a copy of the APT key with each Debian-family platform instead.

repo_key_url: >-
  {{ repo_gpg_key or (
       repo_base ~ '/apt/' ~ apt_platform ~ '/pgedge.gpg'
       if repo_layout == 'mirror' and ansible_os_family == 'Debian'
       else repo_base ~ '/keys/pgedge-rsa.pub') }}

# The repositories pgedge-release defines, under the same IDs, so that a host
# moved from pgEdge's servers to the site's own keeps no stale definitions. The
# mirror has no source RPMs, so it defines no repository for them.

dnf_repos: "{{ dnf_layouts[repo_layout] }}"

dnf_layouts:
  upstream:
  - id: pgedge
    name: pgEdge RPM Repository
    path: "{{ repo }}/{{ ansible_distribution_major_version }}/RPMS/$basearch"
    enabled: true
  - id: pgedge-noarch
    name: pgEdge RPM Repository (noarch)
    path: "{{ repo }}/{{ ansible_distribution_major_version }}/RPMS/noarch"
    enabled: true
  - id: pgedge-srpm
    name: pgEdge RPM Repository (Source RPMs)
    path: "{{ repo }}/{{ ansible_distribution_major_version }}/SRPMS"
    enabled: false
  mirror:
  - id: pgedge
    name: pgEdge RPM Repository
    path: "el{{ ansible_distribution_major_version }}/$basearch/pgedge"
    enabled: true
  - id: pgedge-noarch
    name: pgEdge RPM Repository (noarch)
    path: "el{{ ansible_distribution_major_version }}/$basearch/pgedge-noarch"
    enabled: true
