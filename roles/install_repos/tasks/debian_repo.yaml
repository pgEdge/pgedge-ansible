---

- name: Install Debian-family prerequisite packages
  apt:
    name:
    - curl
    - gnupg2
    - lsb-release
    - openssl
    state: present
  retries: 5
  delay: 20
  register: result
  until: result is success
  become: true

# downloads.pgedge.com, not apt.pgedge.com -- see rhel_repo.yaml.
- name: Install the pgEdge repo package
  apt:
    deb: 'https://downloads.pgedge.com/repodeb/pgedge-release_latest_all.deb'
    state: present
  retries: 5
  delay: 20
  register: result
  until: result is success
  become: true

# Harmless while the pgEdge source is still disabled, and other roles expect a
# fresh cache even when no client certificate was supplied.
- name: Update APT cache
  apt:
    update_cache: true
  become: true
