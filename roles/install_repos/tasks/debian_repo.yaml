---

# update_cache here, not only on the task below that picks up the pgEdge
# packages. A freshly provisioned Debian image can carry no package
# lists at all, and this is the first task in the collection that
# installs anything, so without it the run dies on "No package matching
# 'curl' is available". init_server refreshes the cache and normally
# runs first, but a play that only needs the repos, such as one setting
# up a Lakekeeper host, has no reason to include it.

- name: Install Debian-family prerequisite packages
  apt:
    name:
    - curl
    - gnupg2
    - lsb-release
    state: present
    update_cache: true
  retries: 5
  delay: 20
  register: result
  until: result is success
  become: true

- name: Install the pgEdge repo package
  apt:
    deb: 'https://apt.pgedge.com/repodeb/pgedge-release_latest_all.deb'
    state: present
  retries: 5
  delay: 20
  register: result
  until: result is success
  become: true

- name: Update APT cache to include pgEdge packages
  apt:
    update_cache: true
  become: true
