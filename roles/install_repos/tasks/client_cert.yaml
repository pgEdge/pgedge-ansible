---

# The repositories authenticate clients with mutual TLS. pgedge-release ships
# them disabled and pgedge-subscription-manager enables them once a certificate
# is installed and verified, so this runs after the repo package.

- name: Decide whether a client certificate was supplied
  set_fact:
    pgedge_have_client_cert: >-
      {{ ((pgedge_client_cert | length > 0) or (pgedge_client_cert_src | length > 0))
         and ((pgedge_client_key | length > 0) or (pgedge_client_key_src | length > 0)) }}

- name: Warn when no client certificate was supplied
  debug:
    msg: >-
      No pgEdge client certificate supplied: the repositories stay disabled and
      pgEdge packages will not install. Set pgedge_client_cert and
      pgedge_client_key (or the _src variants).
  when: not pgedge_have_client_cert

# pgedge-subscription-manager ships in pgedge-release, which repo_url mode
# removes. A host mirroring the gated repositories still needs the certificate
# installed, so this turns on whether the tool is there rather than on
# repo_url.
- name: Look for pgedge-subscription-manager
  stat:
    path: /usr/bin/pgedge-subscription-manager
  register: pgedge_sm_bin
  when: pgedge_have_client_cert

- name: Warn when the subscription manager is not installed
  debug:
    msg: >-
      A pgEdge client certificate was supplied but pgedge-subscription-manager
      is not installed, so the certificate was not installed and the gated
      repositories were not enabled. It ships in pgedge-release, which setting
      repo_url removes.
  when:
  - pgedge_have_client_cert
  - not pgedge_sm_bin.stat.exists

- name: Install the client certificate
  when:
  - pgedge_have_client_cert
  - pgedge_sm_bin.stat.exists
  become: true
  block:
  - name: Create the pgEdge configuration directory
    file:
      path: "{{ pgedge_cert_dir }}"
      state: directory
      owner: root
      group: root
      mode: '0755'

  - name: Write the client certificate from a variable
    copy:
      content: "{{ pgedge_client_cert | trim }}\n"
      dest: "{{ pgedge_cert_dir }}/client.crt"
      owner: root
      group: root
      mode: '0644'
    register: pgedge_cert_inline
    when: pgedge_client_cert | length > 0
    no_log: true

  - name: Copy the client certificate from the controller
    copy:
      src: "{{ pgedge_client_cert_src }}"
      dest: "{{ pgedge_cert_dir }}/client.crt"
      owner: root
      group: root
      mode: '0644'
    register: pgedge_cert_file
    when: pgedge_client_cert | length == 0

  # The key gets the owner and mode pgedge-subscription-manager would give it,
  # so that a later run finds nothing to change; see vars/main.yaml.
  - name: Write the client key from a variable
    copy:
      content: "{{ pgedge_client_key | trim }}\n"
      dest: "{{ pgedge_cert_dir }}/client.key"
      owner: "{{ pgedge_cert_key_owner }}"
      group: root
      mode: "{{ pgedge_cert_key_mode }}"
    register: pgedge_key_inline
    when: pgedge_client_key | length > 0
    no_log: true

  - name: Copy the client key from the controller
    copy:
      src: "{{ pgedge_client_key_src }}"
      dest: "{{ pgedge_cert_dir }}/client.key"
      owner: "{{ pgedge_cert_key_owner }}"
      group: root
      mode: "{{ pgedge_cert_key_mode }}"
    register: pgedge_key_file
    when: pgedge_client_key | length == 0
    no_log: true

  # Looks for any repository the manager enables that is still disabled: on
  # RHEL every stanza but the srpm one, which the manager leaves off; on Debian
  # the single source. This is stricter than the manager's own status command,
  # which on RHEL counts the repositories enabled when any stanza is, so a
  # [pgedge] stanza disabled by hand beside an enabled [pgedge-noarch] would
  # pass it. pgedge-release ships every stanza disabled, so this also catches
  # a package upgrade that put its disabled definition back. The command exits
  # 0 when it finds one, 1 when it does not, and 2 when the file is missing or
  # unreadable, which pgedge-release being installed rules out, so that fails.
  - name: Look for a pgEdge repository that is still disabled
    command: >-
      {{ "awk '/^[[]/ { s = $0 } s !~ /srpm/ && /^enabled=0/ { found = 1 } END { exit !found }'"
         if ansible_os_family == 'RedHat' else "grep -q '^Enabled: no$'" }}
      {{ pgedge_repo_file }}
    register: pgedge_repo_disabled
    changed_when: false
    failed_when: pgedge_repo_disabled.rc > 1
    check_mode: false

  # Running the manager rewrites the repository definition and refreshes the
  # package cache, so it runs only when there is something for it to do: a
  # certificate or key that changed, or a repository it has not enabled, which
  # its install command enables along with all the others. A second run
  # against a host it has set up then changes nothing.
  - name: Validate the certificate and enable the pgEdge repositories
    command: >-
      pgedge-subscription-manager install
      {{ pgedge_cert_dir }}/client.crt {{ pgedge_cert_dir }}/client.key --force
    register: pgedge_sm
    when: >-
      pgedge_repo_disabled.rc == 0
      or pgedge_cert_inline is changed or pgedge_cert_file is changed
      or pgedge_key_inline is changed or pgedge_key_file is changed

  - name: Show what the subscription manager did
    debug:
      var: pgedge_sm.stdout_lines
    when: pgedge_sm is not skipped
