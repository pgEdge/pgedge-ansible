---

# downloads.pgedge.com, not dnf.pgedge.com: the gated repository cannot serve
# the package that configures access to it.
- name: Install the pgEdge repo GPG Keys
  rpm_key:
    key: https://dnf.pgedge.com/keys/pgedge-rsa.pub
    state: present
  become: true

- name: Install the pgEdge repo package
  dnf:
    name: https://downloads.pgedge.com/reporpm/pgedge-release-latest.noarch.rpm
    state: present
  retries: 5
  delay: 20
  register: result
  until: result is success
  become: true
