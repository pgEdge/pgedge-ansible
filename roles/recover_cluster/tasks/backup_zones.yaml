---

# Give every zone that needs one a backup of the cluster it now holds.
#
# A rebuilt zone has none. Every backup its stanza lists belongs to the cluster
# that stanza-upgrade recorded as replaced, so until a new one is taken the zone
# has no recovery point at all: a second incident there would restore the old
# cluster, and a replica built with patroni_replica_from_backup would be cloned
# from it and never stream from its leader. The scheduled jobs would fix this
# eventually, which is too late for either.
#
# The restored zone needs one only after a point-in-time recovery. Promotion at
# the target starts a new timeline, and any backup taken after the target is on
# the abandoned one; a later restore that takes the latest backup lands there
# instead of on the cluster running now. A restore that replays everything the
# archive holds has no such backups, and its existing ones are still the right
# recovery point, so they are left alone. Under the default retention a new
# full backup expires the previous one, which would take away the means to
# rerun the recovery with a different target for no gain.
#
# Before the replicas are rebuilt, so a replica that restores from the
# repository finds this backup rather than the old cluster's.

- name: Back up this zone from one of its pgEdge nodes
  include_tasks: run_zone_backup.yaml
  vars:
    os_user: postgres
  when:
  - inventory_hostname in groups.pgedge
  - backup_repo_configured | bool
  - backup_type != 'ssh'
  - inventory_hostname == first_node_in_zone
  - zone != recovery_zone or recovery_target_type > ''

# The same split upgrade_stanza makes: an SSH repository is driven from its
# backup server, an S3 one from the zone's first pgEdge node.

- name: Back up this zone from its backup server
  include_tasks: run_zone_backup.yaml
  vars:
    os_user: "{{ backup_repo_user }}"
  when:
  - groups.backup is defined
  - inventory_hostname in groups.backup
  - backup_type == 'ssh'
  - zone != recovery_zone or recovery_target_type > ''
