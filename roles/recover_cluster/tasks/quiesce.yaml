---

# Stop the whole cluster before anything is erased. This runs on every pgEdge
# node in every zone, not only the zone being restored: the rebuilt zones are
# refilled from the restored one across Spock, and a zone still accepting writes
# while that happens has changes of its own that nothing will carry anywhere.
#
# Both services are disabled as well as stopped. The plays that follow bring
# each node back deliberately and in order, and a node that restarted itself
# partway through -- a reboot, a watchdog -- would rejoin a cluster that is not
# finished being assembled.
#
# Each is acted on only if systemd has a unit for it. A recovery is also how a
# cluster is rebuilt onto replacement hardware, where the deployment stopped
# before it created everything: on RHEL the Postgres unit file is written by
# setup_postgres, so a node that never got that far has no unit to stop, and
# asking systemd to stop one that does not exist is an error rather than a
# no-op.

- name: Populate service facts to see which units exist on this node
  service_facts:

- name: Stop and disable Patroni on every pgEdge node
  systemd_service:
    name: "{{ patroni_service_name }}"
    state: stopped
    enabled: false
  become: true
  when: patroni_service_name + '.service' in ansible_facts.services

- name: Ensure Postgres is not running outside Patroni either
  systemd_service:
    name: "{{ pg_service_name }}"
    state: stopped
    enabled: false
  become: true
  when: pg_service_name + '.service' in ansible_facts.services

# Neither unit is the last word on whether Postgres is still running. Patroni
# starts the postmaster itself rather than through the Postgres unit, and a
# Patroni in maintenance mode leaves it running when Patroni stops. validate
# refuses a paused cluster, but a node can still end up with a postmaster
# nothing above owns: one started by hand, or left behind by a Patroni that
# crashed. wipe_data erases the data directory next, so ask the directory
# itself. pg_ctl status exits 0 only when a live postmaster holds it; a stopped
# server and a missing directory both exit with something else.

- name: Check whether a postmaster still holds the data directory
  command:
    argv:
    - "{{ pg_path }}/bin/pg_ctl"
    - status
    - -D
    - "{{ pg_data }}"
  register: recovery_postmaster
  changed_when: false
  check_mode: false
  failed_when: false
  become: true
  become_user: postgres

- name: Ensure no postmaster is still running on the data directory
  assert:
    that:
    - recovery_postmaster.rc != 0
    fail_msg: >-
      Postgres is still running on {{ inventory_hostname }} in {{ pg_data }}
      after Patroni and the Postgres service were both stopped:
      {{ recovery_postmaster.stdout | trim }}. Patroni and the service are
      now disabled, but no data directory has been erased. Stop that server
      with {{ pg_path }}/bin/pg_ctl stop -D {{ pg_data }} as postgres, then
      run the recovery again.
