---

# A full backup reads the whole database, which after a recovery is the whole
# refilled dataset, so it runs under async like the restore and the refill
# rather than holding one SSH session open for the duration.

- name: Take a full backup of the cluster this zone now holds
  command:
    argv:
    - pgbackrest
    - "--stanza={{ backup_stanza }}"
    - backup
    - "--type=full"
  async: "{{ recovery_max_hours | int * 3600 }}"
  poll: "{{ recovery_poll_seconds }}"
  become: true
  become_user: "{{ os_user }}"
