---

# Hold the scheduled backups until the recovery is finished.
#
# A recovery can take more than one attempt, and from the moment the restored
# zone is up it is a cluster the schedule can back up. A full backup that lands
# there between attempts completes against the cluster as restored, and under
# the default full_backup_count of 1 it expires the full backup the recovery was
# restored from, along with the WAL that belongs to it. The next attempt then
# has nothing to restore from that is older than the incident, and a
# point-in-time target before that new backup can no longer be reached at all.
# A backup that is merely running when backup_zones takes its own holds the
# stanza's lock, and fails the recovery's.
#
# So each entry is disabled rather than removed, through the cron module that
# installed it. finalize_backrest, which the recovery playbook runs last,
# installs the same entry by the same name, and that re-enables it. An attempt
# that fails partway leaves the schedule paused, which is what the next attempt
# needs; it ends with finalize_backrest like the first.
#
# Only an entry that exists is touched, and only one this collection would
# install again: an empty schedule installs nothing, so an entry left by an
# earlier deployment with a different setting would stay disabled for good.
# The backup documentation already says to remove such an entry by hand.
#
# Entries live where finalize_backrest puts them: in postgres's crontab on every
# pgEdge node when the repository is not reached over SSH, and in the
# repository owner's on the backup server when it is.

- block:
  - name: Read the crontab the backup schedule is installed in
    command: crontab -l
    register: recovery_crontab
    changed_when: false
    failed_when: false
    check_mode: false
    become: true
    become_user: "{{ recovery_cron_user }}"

  - name: Pause the scheduled backups for the length of the recovery
    cron:
      name: "{{ item.name }}"
      minute: "{{ item.schedule.split(' ')[0] }}"
      hour: "{{ item.schedule.split(' ')[1] }}"
      day: "{{ item.schedule.split(' ')[2] }}"
      month: "{{ item.schedule.split(' ')[3] }}"
      weekday: "{{ item.schedule.split(' ')[4] }}"
      job: "pgbackrest --stanza={{ backup_stanza }} backup --type={{ item.type }}"
      disabled: true
    loop:
    - { name: Full PgBackRest schedule, type: full,
        schedule: "{{ full_backup_schedule }}" }
    - { name: Differential PgBackRest schedule, type: diff,
        schedule: "{{ diff_backup_schedule }}" }
    loop_control:
      label: "{{ item.name }}"
    become: true
    become_user: "{{ recovery_cron_user }}"
    when:
    - "('#Ansible: ' ~ item.name) in recovery_crontab.stdout_lines"
    - item.schedule.split(' ') | length == 5

  vars:
    recovery_cron_user: >-
      {{
        'postgres' if inventory_hostname in groups.pgedge
                      and backup_repo_configured | bool
                      and backup_type != 'ssh'
        else backup_repo_user if groups.backup is defined
                                 and inventory_hostname in groups.backup
                                 and backup_type == 'ssh'
        else ''
      }}
  when: recovery_cron_user | length > 0
