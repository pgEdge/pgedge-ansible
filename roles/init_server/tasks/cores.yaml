---

# Allow for "infinite" core dumps

- name: Set the security core limits to "unlimited"
  blockinfile:
    path: /etc/security/limits.conf
    marker: "# {mark} ANSIBLE MANAGED"
    insertbefore: "^# End of file"
    block: |
      *                -       core            unlimited
  become: true
  tags:
  - debug

# The systemd settings below go in drop-ins rather than in coredump.conf and
# system.conf under /etc/systemd, which EL10 no longer installs: its systemd
# keeps the defaults in /usr/lib/systemd and leaves /etc for the
# administrator's overrides. Every supported distribution's systemd reads
# these drop-in directories.

- name: Create the systemd drop-in directories for core dumps
  file:
    path: "/etc/systemd/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
  - coredump.conf.d
  - system.conf.d
  become: true
  tags:
  - debug

- name: Limit core dump processing to 32GB each, and 64GB total
  copy:
    dest: /etc/systemd/coredump.conf.d/50-pgedge.conf
    content: |
      # Managed by Ansible (pgedge.platform init_server).
      [Coredump]
      ProcessSizeMax=32G
      ExternalSizeMax=32G
      MaxUse=64G
    owner: root
    group: root
    mode: '0644'
  become: true
  tags:
  - debug

- name: Set the default systemd core limit to "infinity"
  copy:
    dest: /etc/systemd/system.conf.d/50-pgedge.conf
    content: |
      # Managed by Ansible (pgedge.platform init_server).
      [Manager]
      DefaultLimitCORE=infinity:infinity
    owner: root
    group: root
    mode: '0644'
  become: true
  tags:
  - debug
