# There are some Best Practices and basic sanity-checks we'd like to enforce
# before any bootstrapping steps take place. Those take place here under the
# assumption this role is required for all hosts managed by this collection.

---

# Do not allow multiple pgEdge nodes to exist in a single zone. The Spock
# subscription wiring and snowflake node ID are derived from this value. In
# this case, a zone is an artificial construct not related to cloud
# availability zones or regions.

- name: Ensure only one pgEdge node exists per Zone in non-HA clusters
  assert:
    that:
    - zone_map | unique | count == zone_map | count
    fail_msg: >-
      Non-HA clusters cannot have more than one pgEdge node per zone. Zones
      define node-to-node communication channels and must be unique across the
      cluster.
  run_once: true
  vars:
    zone_map: >-
      {{ groups['pgedge'] | map('extract', hostvars) |
      map(attribute='zone', default='') | list }}
  when:
  - not is_ha_cluster
  - inventory_hostname in groups.pgedge

# Begin by disallowing the use of default passwords. This should go without
# saying, but there are several of these and it's easy to miss one.

- name: Ensure default passwords have been changed
  assert:
    that:
    - db_password != 'secret'
    - pgedge_password != 'secret'
    - replication_password != 'secret'
    - backup_password != 'secret'
    fail_msg: >-
      One or more passwords are still set to the default value 'secret'. Please
      make sure to specify the following variables:
      db_password, pgedge_password, replication_password, backup_password
  run_once: true
  when: inventory_hostname in groups.pgedge | union(groups.backup | default([]))

# These roles simply won't work on anything but RHEL / Debian systems right
# now. There may be workarounds, but for now it's best to fail early.

- name: These roles currently only work on Debian and RHEL family systems
  assert:
    that:
    - ansible_facts['os_family'] in ('Debian', 'RedHat')
    fail_msg: >-
      These roles make many assumptions based on OS distribution. Currently
      only distributions in the RedHat and Debian families are supported.
  run_once: true

# Don't let backup servers and pgEdge servers overlap. The intention here is
# that there's a dedicated backup server.

- name: Ensure no host is in both the pgedge and backup groups
  assert:
    that:
    - groups.pgedge | default([]) | intersect(groups.backup | default([])) | length == 0
    fail_msg: "A host cannot be in both the 'pgedge' and 'backup' groups."
  run_once: true

# Pooling is opt-in by membership in the 'pgbouncer' group. A pooler forwards
# to the Postgres instance on its own host, so a pooled host with no Postgres
# has nothing to forward to.

- name: Ensure every host in the pgbouncer group is also a pgEdge node
  assert:
    that:
    - groups.pgbouncer | default([]) | difference(groups.pgedge | default([])) | length == 0
    fail_msg: >-
      The 'pgbouncer' group must be a subset of the 'pgedge' group. pgBouncer
      runs on a pgEdge node, in front of that node's own Postgres. Offending
      hosts:
      {{ groups.pgbouncer | default([]) | difference(groups.pgedge | default([])) | join(', ') }}
  run_once: true

# The pooler's own Postgres login is the one credential this collection still
# writes to disk, so it gets the same treatment as the rest. Asserted only when
# the cluster actually pools: an unpooled cluster never creates the role, and
# demanding a password for it would change what an existing inventory needs.

- name: Ensure the pgBouncer authentication password has been changed
  assert:
    that:
    - pgbouncer_auth_password != 'secret'
    fail_msg: >-
      pgbouncer_auth_password is still set to the default value 'secret'. It is
      the login pgBouncer uses to look up client credentials in Postgres, and it
      is written to the pooler's auth_file, so it must be set explicitly.
  run_once: true
  when: groups.pgbouncer | default([]) | length > 0

# A typo here would render a pgbouncer.ini the pooler refuses to start on, and
# the failure would surface as a systemd error several tasks later. verify-ca
# and verify-full are valid pgBouncer settings but unsupported here: both demand
# a client certificate, which needs pg_hba option syntax pgBouncer cannot parse,
# so a pooler configured that way would reject every client.
#
# Only checked when the value is set. The default is a setup_pgbouncer default,
# so it is not in scope in this role — and it does not need checking, being ours.
# What needs checking is what the inventory supplied.

- name: Ensure the pooler's client TLS mode is one this collection supports
  assert:
    that:
    - pgbouncer_client_tls_sslmode is not defined or
      pgbouncer_client_tls_sslmode in ('disable', 'allow', 'prefer', 'require')
    fail_msg: >-
      pgbouncer_client_tls_sslmode is "{{ pgbouncer_client_tls_sslmode | default('') }}".
      It must be one of disable, allow, prefer or require. Client certificates
      (verify-ca, verify-full) are not supported on the pooled endpoint.
  run_once: true
  when: groups.pgbouncer | default([]) | length > 0

# A pooled node renders these rules into the pooler's own HBA file, and
# pgBouncer's parser accepts a narrower syntax than Postgres's. What makes that
# dangerous is the failure mode: an unsupported line is skipped with a WARNING
# rather than refused, so the rule silently disappears from the pooled endpoint
# — and a dropped "reject" leaves it more permissive than the direct one. Catch
# it in the inventory instead. The three lists below were measured against
# pgBouncer 1.25.1: no ident, gss, sspi, radius, pam or bsd, no option syntax
# such as clientcert=verify-ca, no uppercase spellings, and no hostname, bare
# address or samehost/samenet in the source, all of which Postgres accepts.

- name: Ensure the HBA rules are ones the pooler can parse too
  vars:
    pooler_hba_contypes: [local, host, hostssl, hostnossl]
    pooler_hba_methods: [trust, reject, md5, password, scram-sha-256, peer, cert]
    hba_rules: "{{ custom_hba_rules + pgbouncer_hba_rules }}"
    # Rules with no contype default to host, so they are networked too.
    networked_rules: >-
      {{ (hba_rules | rejectattr('contype', 'defined') | list) +
      (hba_rules | selectattr('contype', 'defined') |
      rejectattr('contype', 'eq', 'local') | list) }}
    hosted_sources: >-
      {{ networked_rules | rejectattr('source', 'undefined') |
      rejectattr('source', 'eq', 'all') | map(attribute='source') | list }}
    bad_contype: >-
      {{ hba_rules | rejectattr('contype', 'undefined') |
      rejectattr('contype', 'in', pooler_hba_contypes) | list }}
    bad_method: >-
      {{ hba_rules | rejectattr('method', 'undefined') |
      rejectattr('method', 'in', pooler_hba_methods) | list }}
    bad_source: >-
      {{ ((hosted_sources | reject('search', '/[0-9]+$') | list) +
      (hosted_sources | reject('ansible.utils.ip') | list)) | unique }}
  assert:
    that:
    - bad_contype | length == 0
    - bad_method | length == 0
    - bad_source | length == 0
    fail_msg: >-
      custom_hba_rules and pgbouncer_hba_rules also feed the pooler's own HBA
      file, and pgBouncer skips a line it cannot parse with only a warning, so
      an unsupported rule disappears from the pooled endpoint instead of
      failing. contype must be one of {{ pooler_hba_contypes | join(', ') }};
      method must be one of {{ pooler_hba_methods | join(', ') }}, lowercase and
      with no option syntax; source must carry a prefix length or be "all".
      Rejected contypes: {{ bad_contype | map(attribute='contype') | list }}.
      Rejected methods: {{ bad_method | map(attribute='method') | list }}.
      Rejected sources: {{ bad_source }}.
  run_once: true
  when: groups.pgbouncer | default([]) | length > 0

# A pooled node binds both Postgres and the pooler, and since the pooler's
# unix_socket_dir is /var/run/postgresql on Debian — beside Postgres's own
# socket — an equal port collides twice: on the TCP listener and on the socket
# name, .s.PGSQL.<port>. Both surface late and confusingly (the socket one as
# "unix socket is in use" from whichever process starts second), so catch it
# here instead.

- name: Ensure pgbouncer_port does not collide with pg_port on a pooled node
  assert:
    that:
    - pgbouncer_port | int != pg_port | int
    fail_msg: >-
      pgbouncer_port and pg_port are both {{ pg_port }} on
      {{ inventory_hostname }}, which runs Postgres and a pooler. They share a
      host, and on Debian a socket directory, so the two must differ.
  when: inventory_hostname in (groups.pgbouncer | default([]))

# proxy_port and pooler_port are proxy-layer ports, so they only collide with
# the node-level ports when HAProxy shares a host with Postgres — a topology
# docs/configuration/proxy.md explicitly supports. Checked only when the
# cluster actually pools, since pooler_port is otherwise inert.

- name: Ensure pooler_port does not collide on hosts that also run Postgres
  assert:
    that:
    - pooler_port | int != pg_port | int
    - pooler_port | int != proxy_port | int
    - pooler_port | int != pgbouncer_port | int or
      inventory_hostname not in (groups.pgbouncer | default([]))
    fail_msg: >-
      pooler_port ({{ pooler_port }}) collides with another port on
      {{ inventory_hostname }}, which runs HAProxy alongside Postgres. It must
      differ from pg_port ({{ pg_port }}), proxy_port ({{ proxy_port }}), and —
      on a pooled node — pgbouncer_port ({{ pgbouncer_port }}).
  when:
  - groups.pgbouncer | default([]) | length > 0
  - inventory_hostname in (groups.haproxy | default([]))
  - inventory_hostname in (groups.pgedge | default([]))

# Ensure that only "supported" DCS types are used. These are pulled from the
# Patroni documentation:
#  - https://patroni.readthedocs.io/en/latest/yaml_configuration.html
#
# Patroni's kubernetes type is deliberately excluded. It takes no endpoint
# setting: Patroni discovers the API server from the environment variables and
# service account files injected into a pod, and otherwise falls back to a
# kubeconfig file. This collection installs Patroni under systemd on ordinary
# hosts, where neither source exists, so the type cannot work here.

- name: Check DCS type for HA clusters
  run_once: true
  assert:
    that:
    - patroni_dcs.type | default('') in ('etcd', 'etcd3', 'consul', 'zookeeper', 'exhibitor')
    fail_msg: "DCS type must be one of: etcd, etcd3, consul, zookeeper, exhibitor"
  when:
  - is_ha_cluster

# The collection only knows how to reach the etcd cluster it builds itself, so
# it can substitute connection defaults for the etcd types alone. Every other
# store is unmanaged and the inventory is the only source of its address and
# credentials. Catch that here rather than in setup_patroni, where the missing
# key surfaces as an undefined-attribute error after the whole cluster has
# already been provisioned.

- name: Check DCS parameters are supplied for unmanaged stores
  run_once: true
  assert:
    that:
    - patroni_dcs.parameters is defined
    - patroni_dcs.parameters is mapping
    - patroni_dcs.parameters | length > 0
    fail_msg: >-
      patroni_dcs.parameters is required when patroni_dcs.type is
      '{{ patroni_dcs.type | default('') }}'. The collection substitutes
      connection defaults only for the etcd and etcd3 types, because those
      describe the etcd cluster it deploys. Supply the settings this store
      needs, such as the host and any credentials, and see the DCS
      Configuration document for the settings each store accepts.
  when:
  - is_ha_cluster
  - patroni_dcs.type | default('etcd3') not in ('etcd', 'etcd3')
