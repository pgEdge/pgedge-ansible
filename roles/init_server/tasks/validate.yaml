# There are some Best Practices and basic sanity-checks we'd like to enforce
# before any bootstrapping steps take place. Those take place here under the
# assumption this role is required for all hosts managed by this collection.
#
# A note on run_once, since most of these assertions deliberately do without it.
# Ansible runs such a task on the first host of the play and evaluates its
# condition there and nowhere else, so a check gated on group membership, or one
# reading a variable a group carries, answers for that host alone. Where the
# first host is not the kind of host the check is about, the assertion is not
# merely wrong: it is skipped, and the run reports nothing at all. Inventory
# order is enough to decide it, so run_once appears below only on assertions
# that read the inventory as a whole -- groups and hostvars, resolving the same
# from anywhere -- and every check of a host's own variables is gated on the
# group that carries them and left to run on each of those hosts.

---

# Do not allow multiple pgEdge nodes to exist in a single zone. The Spock
# subscription wiring and snowflake node ID are derived from this value. In
# this case, a zone is an artificial construct not related to cloud
# availability zones or regions.

- name: Ensure only one pgEdge node exists per Zone in non-HA clusters
  assert:
    that:
    - zone_map | unique | count == zone_map | count
    fail_msg: >-
      Non-HA clusters cannot have more than one pgEdge node per zone. Zones
      define node-to-node communication channels and must be unique across the
      cluster.
  vars:
    zone_map: >-
      {{ groups['pgedge'] | map('extract', hostvars) |
      map(attribute='zone', default='') | list }}
  when:
  - not is_ha_cluster
  - inventory_hostname in (groups.pgedge | default([]))

# Begin by disallowing the use of default passwords. This should go without
# saying, but there are several of these and it's easy to miss one.

- name: Ensure default passwords have been changed
  assert:
    that:
    - db_password != 'secret'
    - pgedge_password != 'secret'
    - replication_password != 'secret'
    - backup_password != 'secret'
    fail_msg: >-
      One or more passwords are still set to the default value 'secret'. Please
      make sure to specify the following variables:
      db_password, pgedge_password, replication_password, backup_password
  when: inventory_hostname in (groups.pgedge | default([]))

# The backup repository's encryption, checked the same way the passwords are and
# for the same reason: the value cannot be defaulted into existence.
#
# A generated cipher password would have to be identical on every run -- change
# it and the repository can no longer be read -- and also unguessable, and
# nothing can be both. The value this parameter used to default to was derived
# from cluster_name and zone, which achieved the first by giving up the second:
# anyone who knew the cluster's name could decrypt its backups.
#
# Asked of pgEdge nodes and backup servers alike, because both render the
# repository configuration and both have to arrive at the same answer. An
# inventory that sets this on the 'pgedge' group alone leaves the backup server
# writing a different configuration than the nodes it serves, which is a
# repository neither can read.

- name: Ensure the backup repository cipher type is one PgBackRest accepts
  assert:
    that:
    - backup_repo_cipher_type in ('none', 'aes-256-cbc')
    fail_msg: >-
      backup_repo_cipher_type is "{{ backup_repo_cipher_type }}". PgBackRest
      accepts aes-256-cbc, or none where the storage layer encrypts instead.
  when:
  - backup_repo_configured | bool
  - inventory_hostname in (groups.pgedge | default([])) or
    inventory_hostname in (groups.backup | default([]))

- name: Ensure an encrypted backup repository has been given a password
  assert:
    that:
    - backup_repo_cipher | length > 0
    fail_msg: >-
      backup_repo_cipher is empty and backup_repo_cipher_type is
      "{{ backup_repo_cipher_type }}", so PgBackRest is being asked to encrypt
      this repository with nothing. It has no default on purpose: a generated
      one would have to be identical on every run and also unguessable, and
      nothing can be both. Set it to a secret you keep -- Ansible Vault, beside
      the passwords -- or set backup_repo_cipher_type to none where the storage
      encrypts instead, such as S3 bucket default encryption.
      Store it somewhere you will still have it later: a lost cipher is an
      unreadable repository, and this collection cannot rotate it.
      Upgrading a cluster deployed before this parameter required a value? Its
      repository still uses the old derived password, and the old derivation was
      public, so recover it with:
      ansible localhost -m debug -a
      "msg={{ '{{' }} lookup('password', '/dev/null', length=20,
      seed='pgedge{{ cluster_name }}-{{ zone }}') {{ '}}' }}"
  when:
  - backup_repo_configured | bool
  - backup_repo_encrypted | bool
  - inventory_hostname in (groups.pgedge | default([])) or
    inventory_hostname in (groups.backup | default([]))

# A password set where nothing encrypts is not harmless: it reads as encryption
# to anyone reviewing the inventory, and PgBackRest refuses the configuration
# outright rather than quietly ignoring it.

- name: Ensure no cipher password is set where nothing is encrypting
  assert:
    that:
    - backup_repo_cipher | length == 0
    fail_msg: >-
      backup_repo_cipher is set but backup_repo_cipher_type is none, so
      PgBackRest is not encrypting this repository and the password does
      nothing. Either remove it, or set a cipher type so it is used.
  when:
  - backup_repo_configured | bool
  - not backup_repo_encrypted | bool
  - inventory_hostname in (groups.pgedge | default([])) or
    inventory_hostname in (groups.backup | default([]))

# An S3 repository is the object store and nothing else. A backup server exists
# to hold an SSH repository and to drive it over SSH, and none of that is set up
# in S3 mode -- no SSH keys are exchanged -- so a server in the zone would fail
# partway through the deployment trying to reach nodes it was never given
# access to. Refused here instead, while nothing has been changed.
#
# Asked of the pgEdge nodes, which are the hosts the repository type is set for:
# a backup server given no backup_repo_type of its own would think itself in SSH
# mode and see nothing wrong.

- name: Ensure an S3 zone has no backup server
  assert:
    that:
    - backups_in_zone | length == 0
    fail_msg: >-
      Zone {{ zone }} uses an S3 repository, but has backup servers:
      {{ backups_in_zone | join(', ') }}. A backup server only serves an SSH
      repository. Remove these hosts from the 'backup' group, or set
      backup_repo_type to ssh.
  when:
  - backup_type == 's3'
  - inventory_hostname in (groups.pgedge | default([]))

# The S3 settings have defaults only where one is plausible. The credentials
# have none, and a configuration that leaves them empty fails only when
# finalize_backrest first writes to the repository -- the last step of the
# deployment, long after Postgres was built expecting to archive there.

- name: Ensure the S3 repository settings are complete
  assert:
    that:
    - s3_problems | length == 0
    fail_msg: >-
      backup_repo_type is s3, so backup_repo_params must name the bucket, region
      and endpoint, and supply access_key and secret_key -- from Ansible Vault,
      beside the passwords. If set, uri_style must be host or path, storage_port
      a number from 1 to 65535, and storage_verify_tls true or false.
      Missing or invalid: {{ s3_problems | join(', ') }}.
  vars:
    s3_problems: >-
      {{ ['access_key', 'secret_key', 'bucket', 'region', 'endpoint']
         | reject('in', backup_params | dict2items | selectattr('value')
                        | map(attribute='key') | list) | list
         + (['uri_style'] if backup_params.uri_style not in ('', 'host', 'path')
            else [])
         + (['storage_port'] if port_given > ''
              and not (port_given is match('^[0-9]+$')
                       and port_given | int in range(1, 65536))
            else [])
         + (['storage_verify_tls'] if verify_given | lower not in
              ('', 'true', 'false', 'yes', 'no', 'y', 'n', 'on', 'off',
               '1', '0')
            else []) }}
    port_given: "{{ backup_params.storage_port | string }}"
    verify_given: "{{ backup_params.storage_verify_tls | string }}"
  when:
  - backup_type == 's3'
  - inventory_hostname in (groups.pgedge | default([]))

# These roles simply won't work on anything but RHEL / Debian systems right
# now. There may be workarounds, but for now it's best to fail early.

- name: These roles currently only work on Debian and RHEL family systems
  assert:
    that:
    - ansible_facts['os_family'] in ('Debian', 'RedHat')
    fail_msg: >-
      These roles make many assumptions based on OS distribution. Currently
      only distributions in the RedHat and Debian families are supported.

# Don't let backup servers and pgEdge servers overlap. The intention here is
# that there's a dedicated backup server.

- name: Ensure no host is in both the pgedge and backup groups
  assert:
    that:
    - groups.pgedge | default([]) | intersect(groups.backup | default([])) | length == 0
    fail_msg: "A host cannot be in both the 'pgedge' and 'backup' groups."
  run_once: true

# The same for the Lakekeeper host. Its catalog store is a Postgres instance
# built from the same cluster_name, pg_port and pg_data as a pgEdge node's, so
# on a pgEdge node setup_lakekeeper would find the node's own instance and put
# the catalog in it.

- name: Ensure no host is in both the pgedge and lakekeeper groups
  assert:
    that:
    - groups.pgedge | default([]) | intersect(groups.lakekeeper | default([])) | length == 0
    fail_msg: "A host cannot be in both the 'pgedge' and 'lakekeeper' groups."
  run_once: true

# Pooling is a property of the cluster, not of a node: pgbouncer_enabled belongs
# on the 'pgedge' group, and every pgEdge node then runs a pooler in front of its
# own Postgres. Per-node values are rejected here rather than honoured, because
# a half-pooled zone is a broken zone. Its HAProxy pooled listener follows the
# Patroni leader, so it works until the leader moves to a node with no pooler and
# then has no backend at all — and the direct endpoint cannot stand in for it,
# since the two resolve against different pg_hba rules.

- name: Ensure pooling is either on or off for the whole cluster
  assert:
    that:
    - pooling_flags | unique | length <= 1
    fail_msg: >-
      pgbouncer_enabled must be the same on every pgEdge node: it is a
      cluster-wide setting, like is_ha_cluster, and belongs in the vars of the
      'pgedge' group. Values seen: {{ pooling_flags | unique | join(', ') }}.
  run_once: true
  vars:
    pooling_flags: >-
      {{ groups['pgedge'] | default([]) | map('extract', hostvars) |
      map(attribute='pgbouncer_enabled', default=false) | map('bool') | list }}

# The pooler's own Postgres login is the one credential this collection still
# writes to disk, so it gets the same treatment as the rest. Asserted only when
# the cluster actually pools: an unpooled cluster never creates the role, and
# demanding a password for it would change what an existing inventory needs.

# Checked on the pgEdge nodes, which are the hosts that carry the value:
# pgbouncer_auth_password is normally given to the 'pgedge' group, so a proxy,
# backup or client host does not have it. Deliberately not run_once — Ansible
# evaluates a run_once task's condition against the first host of the play
# alone, so a group gate there would skip the assert outright whenever that
# host is not a pgEdge node, turning a validation into a no-op. Every node
# reports instead, which costs a repeated message on an inventory that is
# wrong anyway.

- name: Ensure the pgBouncer authentication password has been changed
  assert:
    that:
    - pgbouncer_auth_password != 'secret'
    fail_msg: >-
      pgbouncer_auth_password is still set to the default value 'secret'. It is
      the login pgBouncer uses to look up client credentials in Postgres, and it
      is written to the pooler's auth_file, so it must be set explicitly.
  when:
  - cluster_is_pooled | bool
  - inventory_hostname in (groups.pgedge | default([]))

# A typo here would render a pgbouncer.ini the pooler refuses to start on, and
# the failure would surface as a systemd error several tasks later. verify-ca
# and verify-full are valid pgBouncer settings but unsupported here: both demand
# a client certificate, which needs pg_hba option syntax pgBouncer cannot parse,
# so a pooler configured that way would reject every client.
#
# Only checked when the value is set. The default is a setup_pgbouncer default,
# so it is not in scope in this role — and it does not need checking, being ours.
# What needs checking is what the inventory supplied.

- name: Ensure the pooler's client TLS mode is one this collection supports
  assert:
    that:
    - pgbouncer_client_tls_sslmode is not defined or
      pgbouncer_client_tls_sslmode in ('disable', 'allow', 'prefer', 'require')
    fail_msg: >-
      pgbouncer_client_tls_sslmode is "{{ pgbouncer_client_tls_sslmode | default('') }}".
      It must be one of disable, allow, prefer or require. Client certificates
      (verify-ca, verify-full) are not supported on the pooled endpoint.
  when:
  - cluster_is_pooled | bool
  - inventory_hostname in (groups.pgedge | default([]))

# A pooled node renders these rules into the pooler's own HBA file, and
# pgBouncer's parser accepts a narrower syntax than Postgres's. What makes that
# dangerous is the failure mode: an unsupported line is skipped with a WARNING
# rather than refused, so the rule silently disappears from the pooled endpoint
# — and a dropped "reject" leaves it more permissive than the direct one. Catch
# it in the inventory instead. The three lists below were measured against
# pgBouncer 1.25.1: no ident, gss, sspi, radius, pam or bsd, no option syntax
# such as clientcert=verify-ca, no uppercase spellings, and no hostname, bare
# address or samehost/samenet in the source, all of which Postgres accepts.

- name: Ensure the HBA rules are ones the pooler can parse too
  vars:
    pooler_hba_contypes: [local, host, hostssl, hostnossl]
    pooler_hba_methods: [trust, reject, md5, password, scram-sha-256, peer, cert]
    hba_rules: "{{ custom_hba_rules + pgbouncer_hba_rules }}"
    # Rules with no contype default to host, so they are networked too.
    networked_rules: >-
      {{ (hba_rules | rejectattr('contype', 'defined') | list) +
      (hba_rules | selectattr('contype', 'defined') |
      rejectattr('contype', 'eq', 'local') | list) }}
    hosted_sources: >-
      {{ networked_rules | rejectattr('source', 'undefined') |
      rejectattr('source', 'eq', 'all') | map(attribute='source') | list }}
    bad_contype: >-
      {{ hba_rules | rejectattr('contype', 'undefined') |
      rejectattr('contype', 'in', pooler_hba_contypes) | list }}
    bad_method: >-
      {{ hba_rules | rejectattr('method', 'undefined') |
      rejectattr('method', 'in', pooler_hba_methods) | list }}
    bad_source: >-
      {{ ((hosted_sources | reject('search', '/[0-9]+$') | list) +
      (hosted_sources | reject('ansible.utils.ip') | list)) | unique }}
  assert:
    that:
    - bad_contype | length == 0
    - bad_method | length == 0
    - bad_source | length == 0
    fail_msg: >-
      custom_hba_rules and pgbouncer_hba_rules also feed the pooler's own HBA
      file, and pgBouncer skips a line it cannot parse with only a warning, so
      an unsupported rule disappears from the pooled endpoint instead of
      failing. contype must be one of {{ pooler_hba_contypes | join(', ') }};
      method must be one of {{ pooler_hba_methods | join(', ') }}, lowercase and
      with no option syntax; source must carry a prefix length or be "all".
      Rejected contypes: {{ bad_contype | map(attribute='contype') | list }}.
      Rejected methods: {{ bad_method | map(attribute='method') | list }}.
      Rejected sources: {{ bad_source }}.
  when:
  - cluster_is_pooled | bool
  - inventory_hostname in (groups.pgedge | default([]))

# A pooled node binds both Postgres and the pooler, and since the pooler's
# unix_socket_dir is /var/run/postgresql on Debian — beside Postgres's own
# socket — an equal port collides twice: on the TCP listener and on the socket
# name, .s.PGSQL.<port>. Both surface late and confusingly (the socket one as
# "unix socket is in use" from whichever process starts second), so catch it
# here instead.

- name: Ensure pgbouncer_port does not collide with pg_port on a pooled node
  assert:
    that:
    - pgbouncer_port | int != pg_port | int
    fail_msg: >-
      pgbouncer_port and pg_port are both {{ pg_port }} on
      {{ inventory_hostname }}, which runs Postgres and a pooler. They share a
      host, and on Debian a socket directory, so the two must differ.
  when:
  - cluster_is_pooled | bool
  - inventory_hostname in (groups.pgedge | default([]))

# The one port check here that pooling has nothing to do with: proxy_port fronts
# pg_port in every cluster, so a co-resident HAProxy configured with the same
# value cannot bind its listener whether the cluster pools or not. This is the
# topology docs/configuration/proxy.md tells the reader to change proxy_port
# for, so catch the omission rather than leaving HAProxy to fail at startup.

- name: Ensure proxy_port does not collide with pg_port on a host running both
  assert:
    that:
    - proxy_port | int != pg_port | int
    fail_msg: >-
      proxy_port and pg_port are both {{ pg_port }} on {{ inventory_hostname }},
      which runs HAProxy alongside Postgres, so HAProxy cannot bind its
      listener. Set proxy_port to a port Postgres does not hold.
  when:
  - inventory_hostname in (groups.haproxy | default([]))
  - inventory_hostname in (groups.pgedge | default([]))

# proxy_port and pooler_port are proxy-layer ports. Both checks below are gated
# on the cluster pooling, since pooler_port is otherwise inert.
#
# A dedicated HAProxy host binds nothing but the two proxy ports, so that is the
# only pair it can collide on. Its pooler_port matching the pgbouncer_port of the
# nodes it fronts is not a collision: those are other hosts, and the shared 6432
# default is the ordinary case.

- name: Ensure the two proxy-layer ports do not collide with each other
  assert:
    that:
    - pooler_port | int != proxy_port | int
    fail_msg: >-
      pooler_port and proxy_port are both {{ proxy_port }} on
      {{ inventory_hostname }}, which serves both listeners, so the two must
      differ.
  when:
  - cluster_is_pooled | bool
  - inventory_hostname in (groups.haproxy | default([]))

# The proxy-layer ports meet the node-level ones only where HAProxy shares a
# host with Postgres and its pooler — a topology docs/configuration/proxy.md
# explicitly supports, and the only one where all four ports bind on the same
# address. Hence both group conditions: a pooler_port equal to the pgbouncer_port
# of a node this host merely fronts is not a collision, so a dedicated HAProxy
# host has nothing to check here.

- name: Ensure the proxy-layer ports do not collide with the node's own
  assert:
    that:
    - pooler_port | int != pg_port | int
    - pooler_port | int != pgbouncer_port | int
    - proxy_port | int != pgbouncer_port | int
    fail_msg: >-
      The proxy-layer ports collide with the node's own on
      {{ inventory_hostname }}, which runs HAProxy alongside Postgres and its
      pooler. pooler_port ({{ pooler_port }}) must differ from pg_port
      ({{ pg_port }}) and pgbouncer_port ({{ pgbouncer_port }}), and proxy_port
      ({{ proxy_port }}) must differ from pgbouncer_port
      ({{ pgbouncer_port }}).
  when:
  - cluster_is_pooled | bool
  - inventory_hostname in (groups.haproxy | default([]))
  - inventory_hostname in (groups.pgedge | default([]))

# pg_parameters is laid over the collection's own Postgres configuration, so a
# value of the wrong shape would surface as a templating error halfway through
# setup_postgres or setup_patroni. shared_preload_libraries is the one parameter
# with a shape of its own: a list, or the comma-separated string Postgres takes.
# A mapping passes Jinja's sequence test, so it is ruled out by name; its keys
# would otherwise be loaded as libraries.

- name: Ensure pg_parameters is a mapping of parameter names to values
  assert:
    that:
    - pg_parameters is mapping
    - pg_user_parameters.shared_preload_libraries | default(none) is none or
      pg_user_parameters.shared_preload_libraries is string or
      (pg_user_parameters.shared_preload_libraries is sequence and
       pg_user_parameters.shared_preload_libraries is not mapping)
    fail_msg: >-
      pg_parameters must map Postgres parameter names to values, and its
      shared_preload_libraries, if given, must be a list or a comma-separated
      string.
  when: inventory_hostname in (groups.pgedge | default([]))

# Names are matched without regard to case, so TimeZone and timezone are one
# parameter. Given both, one value would silently win over the other.

- name: Ensure pg_parameters names each parameter once
  assert:
    that:
    - duplicated | length == 0
    fail_msg: >-
      pg_parameters on {{ inventory_hostname }} sets {{ duplicated | join(', ') }}
      more than once, in different letter case. Postgres treats parameter names
      without regard to case, so keep one of each.
  vars:
    names: "{{ pg_parameters.keys() | map('lower') | list }}"
    duplicated: >-
      {% set seen = [] %}{% set repeated = [] %}
      {%- for name in names | sort %}
      {%-   if name in seen and name not in repeated %}
      {%-     set _ = repeated.append(name) %}
      {%-   endif %}
      {%-   set _ = seen.append(name) %}
      {%- endfor %}{{ repeated }}
  when: inventory_hostname in (groups.pgedge | default([]))

# Some parameters are the collection's to set. Spock cannot work without
# logical decoding, the archive commands have to name the repository the backup
# settings describe, and Patroni overrides several more in an HA zone no matter
# what its configuration says. Refusing them here is kinder than accepting a
# value that is silently replaced, which is what would happen otherwise: the
# collection's own values are laid over the inventory's.

- name: Ensure pg_parameters leaves the collection's own parameters alone
  assert:
    that:
    - refused | length == 0
    fail_msg: >-
      pg_parameters on {{ inventory_hostname }} sets parameters the collection
      controls itself:
      {% for name in refused %}{{ name }} ({{ pg_protected_parameters[name]
      | default('the collection requires its value') }}){{ '; ' if not loop.last
      else '.' }}{% endfor %}
  vars:
    refused: >-
      {{ pg_user_parameters.keys()
         | intersect(pg_protected_parameters.keys() | list
                     + pg_required_parameters.keys() | list)
         | sort }}
  when: inventory_hostname in (groups.pgedge | default([]))

# The collection sizes Spock's worker, walsender, slot and origin pools from the
# inventory (pg_sized_parameters in role_config). pg_parameters may raise them,
# but a value below the calculation, or a null that falls back to Postgres's own
# smaller default, leaves Spock unable to start a worker it needs sooner or
# later, and replication then never starts: an error in the server log, not in
# this run. A cluster that cannot replicate is not one to build, so the
# inventory is refused here instead.

- name: Ensure pg_parameters leaves Spock the pools it needs
  assert:
    that:
    - undersized | length == 0
    fail_msg: >-
      pg_parameters on {{ inventory_hostname }} sets
      {{ undersized | join('; ') }}. The collection calculates these from the
      zones, db_names, the zone's standbys and max_parallel_workers, and a
      smaller pool keeps Spock from starting the workers it needs. Raise them,
      or remove them from pg_parameters to use the calculated values. See
      "Worker and Replication Sizing" in the Postgres configuration docs.
  vars:
    undersized: >-
      {% set found = [] %}
      {%- for name, sized in pg_sized_parameters.items()
            if name in pg_user_parameters %}
      {%-   set given = pg_user_parameters[name] %}
      {%-   if given is none or given | int < sized %}
      {%-     set _ = found.append(name ~ ' to '
                ~ ('null' if given is none else given)
                ~ ' where the cluster needs at least ' ~ sized) %}
      {%-   endif %}
      {%- endfor %}{{ found }}
  when: inventory_hostname in (groups.pgedge | default([]))

# An HA zone keeps one Postgres configuration, in Patroni's store, for every
# member: a replica has to be able to take over with the settings the leader
# ran with. Different values on two nodes of a zone would leave the store
# holding whichever node wrote last, so they are rejected like a half-pooled
# cluster is. Zones are separate Patroni clusters and may differ freely.

- name: Ensure every node of an HA zone agrees on pg_parameters
  assert:
    that:
    - zone_parameters | unique | length <= 1
    fail_msg: >-
      pg_parameters must be the same on every node of zone {{ zone }}: an HA
      zone shares a single Postgres configuration through Patroni. Set it on
      the 'pgedge' group, or on a group holding just this zone's nodes.
  vars:
    # Compared with every name in lower case, as Postgres compares them, so
    # TimeZone on one node and timezone on another still agree.
    zone_parameters: >-
      {% set found = [] %}
      {%- for node in groups['pgedge'] | map('extract', hostvars)
            | selectattr('zone', 'eq', zone) %}
      {%-   set given = node.pg_parameters | default({}) %}
      {%-   set _ = found.append(dict(given.keys() | map('lower')
                                      | zip(given.values()))) %}
      {%- endfor %}{{ found }}
  when:
  - is_ha_cluster | bool
  - inventory_hostname in (groups.pgedge | default([]))

# coldfront_enabled puts ColdFront's settings among the parameters
# setup_postgres writes, and they name the Lakekeeper catalog, so a node with
# no lakekeeper_host would run with an endpoint that reaches nothing.
# ColdFront has no HA support yet: setup_coldfront stores the object-store
# credential on every node, which an HA replica refuses. Its packages exist
# only for some Postgres releases, and install_coldfront would otherwise fail
# on a package name after install_pgedge had already installed Postgres.

- name: Ensure ColdFront has a catalog, a release and a simple cluster
  assert:
    that:
    - lakekeeper_host | length > 0
    - not is_ha_cluster | bool
    - pg_version | int in coldfront_supported_pg_versions | map('int')
    fail_msg: >-
      coldfront_enabled is set on {{ inventory_hostname }}, which needs
      lakekeeper_host set to the address of the Lakekeeper catalog, a
      pg_version ColdFront packages are published for
      ({{ coldfront_supported_pg_versions | join(', ') }}; pg_version is
      {{ pg_version }}), and a cluster without is_ha_cluster: ColdFront does
      not support HA clusters yet.
  when:
  - coldfront_enabled | bool
  - inventory_hostname in (groups.pgedge | default([]))

# Mesh mode orders commits through tables Spock replicates in coldfront_db,
# and setup_postgres and setup_pgedge put a database into Spock only when
# db_names lists it.

- name: Ensure ColdFront's mesh mode has its database in Spock
  assert:
    that:
    - coldfront_db in db_names
    fail_msg: >-
      coldfront_mesh is set on {{ inventory_hostname }}, which needs
      coldfront_db ({{ coldfront_db }}) listed in db_names, so that
      setup_postgres and setup_pgedge put it into Spock alongside
      {{ db_names | join(', ') }}.
  when:
  - coldfront_enabled | bool
  - coldfront_mesh | bool
  - inventory_hostname in (groups.pgedge | default([]))

# The object store settings, checked as the backup repository's S3 settings
# are and for the same reason. The credentials have no default, and left empty
# they fail only when Lakekeeper first writes to the bucket, or, on a node, when
# ColdFront first archives, long after the deployment has finished. Asked of
# both kinds of host that use them, since an inventory may set them on one
# group alone.

- name: Ensure the ColdFront object store settings are complete
  assert:
    that:
    - s3_problems | length == 0
    fail_msg: >-
      ColdFront's object store needs coldfront_s3_bucket, coldfront_s3_region,
      coldfront_s3_access_key and coldfront_s3_secret_key set -- the keys from
      Ansible Vault, beside the passwords -- and coldfront_s3_endpoint either
      empty, for AWS S3, or a URL of the form http(s)://host[:port]. Missing or
      invalid on {{ inventory_hostname }}: {{ s3_problems | join(', ') }}.
  vars:
    s3_problems: >-
      {{ ['coldfront_s3_bucket', 'coldfront_s3_region',
          'coldfront_s3_access_key', 'coldfront_s3_secret_key']
         | reject('in', s3_given) | list
         + (['coldfront_s3_endpoint'] if coldfront_s3_endpoint | length > 0
              and coldfront_s3_endpoint is not
                match('^https?://[^/:]+(:[0-9]+)?/?$')
            else []) }}
    s3_given: >-
      {{ {'coldfront_s3_bucket': coldfront_s3_bucket,
          'coldfront_s3_region': coldfront_s3_region,
          'coldfront_s3_access_key': coldfront_s3_access_key,
          'coldfront_s3_secret_key': coldfront_s3_secret_key}
         | dict2items | selectattr('value') | map(attribute='key') | list }}
  when: >-
    (coldfront_enabled | bool
     and inventory_hostname in (groups.pgedge | default([])))
    or inventory_hostname in (groups.lakekeeper | default([]))

- name: Ensure the Lakekeeper catalog password has been changed
  assert:
    that:
    - lakekeeper_db_password != 'secret'
    fail_msg: >-
      lakekeeper_db_password is still set to the default value 'secret'. It is
      the password of Lakekeeper's catalog database, written to the service's
      environment file, so it must be set explicitly.
  when: inventory_hostname in (groups.lakekeeper | default([]))

# A Lakekeeper host binds its catalog's Postgres and Lakekeeper's two ports, and
# Lakekeeper exits at startup if either of its own is taken. A SeaweedFS release
# from 4.x onward starts its own built-in Iceberg catalog on 8181, Lakekeeper's
# default, whenever its S3 gateway is enabled.

- name: Ensure the ports on a Lakekeeper host do not collide
  assert:
    that:
    - service_ports | count == service_ports | unique | count
    fail_msg: >-
      pg_port, lakekeeper_port and lakekeeper_metrics_port must differ on
      {{ inventory_hostname }}, which binds all three; they are
      {{ pg_port }}, {{ lakekeeper_port }} and {{ lakekeeper_metrics_port }}.
  vars:
    service_ports: >-
      {{ [pg_port, lakekeeper_port, lakekeeper_metrics_port]
         | map('int') | list }}
  when: inventory_hostname in (groups.lakekeeper | default([]))

# Ensure that only "supported" DCS types are used. These are pulled from the
# Patroni documentation:
#  - https://patroni.readthedocs.io/en/latest/yaml_configuration.html
#
# Patroni's kubernetes type is deliberately excluded. It takes no endpoint
# setting: Patroni discovers the API server from the environment variables and
# service account files injected into a pod, and otherwise falls back to a
# kubeconfig file. This collection installs Patroni under systemd on ordinary
# hosts, where neither source exists, so the type cannot work here.

- name: Check DCS type for HA clusters
  assert:
    that:
    - patroni_dcs.type | default('') in ('etcd', 'etcd3', 'consul', 'zookeeper', 'exhibitor')
    fail_msg: "DCS type must be one of: etcd, etcd3, consul, zookeeper, exhibitor"
  when:
  - is_ha_cluster
  - inventory_hostname in (groups.pgedge | default([]))

# The collection only knows how to reach the etcd cluster it builds itself, so
# it can substitute connection defaults for the etcd types alone. Every other
# store is unmanaged and the inventory is the only source of its address and
# credentials. Catch that here rather than in setup_patroni, where the missing
# key surfaces as an undefined-attribute error after the whole cluster has
# already been provisioned.

- name: Check DCS parameters are supplied for unmanaged stores
  assert:
    that:
    - patroni_dcs.parameters is defined
    - patroni_dcs.parameters is mapping
    - patroni_dcs.parameters | length > 0
    fail_msg: >-
      patroni_dcs.parameters is required when patroni_dcs.type is
      '{{ patroni_dcs.type | default('') }}'. The collection substitutes
      connection defaults only for the etcd and etcd3 types, because those
      describe the etcd cluster it deploys. Supply the settings this store
      needs, such as the host and any credentials, and see the DCS
      Configuration document for the settings each store accepts.
  when:
  - is_ha_cluster
  - inventory_hostname in (groups.pgedge | default([]))
  - patroni_dcs.type | default('etcd3') not in ('etcd', 'etcd3')
