---

# Debian and RHEL systems have _vastly_ different bootstrap processes. They
# are separated here for simplicity.

- name: Include Debian Postgres setup steps
  include_tasks: debian_pg_setup.yaml
  when: ansible_os_family == 'Debian'

- name: Include RedHat Postgres setup steps
  include_tasks: rhel_pg_setup.yaml
  when: ansible_os_family == 'RedHat'

# With the PGDATA folder established, it's safe to generate server certificates
# for SSL needs.

- include_tasks: certificate.yaml

# Override several Postgres configuration parameters so it all works better
# with pgEdge Distributed. This is just the initial bootstrap, so these can
# all be set to something else later; this is just for cluster setup.

- name: Configure Postgres for pgEdge compatibility
  blockinfile:
    path: "{{ pg_config_dir }}/postgresql.conf"
    block: |
      port = '{{ pg_port }}'
      ssl_cert_file = '{{ pg_data }}/server.crt'
      ssl_key_file = '{{ pg_data }}/server.key'
      listen_addresses = '0.0.0.0'
      archive_mode = 'on'
      archive_command = '/bin/true'
      TimeZone = 'UTC'
      wal_level = 'logical'
      max_worker_processes = 12
      max_replication_slots = 16
      max_wal_senders = 16
      hot_standby_feedback = 'on'
      track_commit_timestamp = 'on'
      shared_preload_libraries = '{{ pgedge_preload_libraries | join(', ') }}'
      {% if pg_supports_output_plugin_libraries | default(false) | bool %}
      output_plugin_libraries = 'pgoutput, test_decoding, spock_output'
      {% endif %}
      spock.conflict_resolution = 'last_update_wins'
      spock.enable_ddl_replication = 'on'
      spock.allow_ddl_from_functions = 'on'
      spock.include_ddl_repset = 'on'
      spock.exception_behaviour = '{{ spock_exception_behaviour }}'
      spock.save_resolutions = 'on'
      snowflake.node = {{ zone }}
    state: present
    marker: "# {mark} pgEdge ANSIBLE MANAGED BLOCK"
    insertafter: EOF
  become: true
  become_user: postgres
  register: pgedge_conf

# Ensure all necessary pg_hba.conf lines are listed for:
#
# - Local postgres peer user for automated administration.
# - The db_user superuser that will administer the cluster.
# - The pgedge user for node-to-node communication.
#
# Otherwise, follow the principal of least access and only name necessary
# database and user combinations.
#
# No overwrite: true here. primary_setup.yaml (HA) and finalize_backrest's
# add_hba_rules.yaml add their own rules to this same file later,
# independently of this task and each other, and overwrite compares
# the rules given in *this* task against the *entire* file — any rule
# left out of that list gets wiped the moment the file already
# contains it. An earlier version of this task did use overwrite:
# true, on the reasoning that it should have the file to itself since
# it runs first, and that looked idempotent right up until an HA or
# backup-enabled run added its own rules afterward, which the very
# next run of this task then deleted. Without overwrite, the module
# compares each rule here against the existing file individually and
# only touches the ones that changed, which is what lets those other
# additions coexist safely. One rule per list entry keeps them as easy
# to read and edit as separate tasks would.

- name: Ensure the required and custom pg_hba.conf rules are all present
  community.postgresql.postgresql_pg_hba:
    dest: "{{ pg_config_dir }}/pg_hba.conf"
    create: true
    rules: "{{ pg_hba_rules | from_yaml }}"
  vars:
    pg_hba_rules: |
      - contype: local
        users: postgres
        databases: all
        method: peer
      - contype: host
        users: all
        databases: all
        method: scram-sha-256
        source: 127.0.0.1/32
      {% for host in groups['pgedge'] %}
      - contype: host
        users: "{{ pgedge_user }},{{ db_user }}"
        databases: "{{ (db_names + ['postgres']) | join(',') }}"
        method: scram-sha-256
        source: "{{ hostvars[host].ansible_default_ipv4.address }}/32"
      {% endfor %}
      {% for rule in custom_hba_rules %}
      - contype: "{{ rule.contype | default('host') }}"
        users: "{{ rule.users | default('postgres') }}"
        databases: "{{ rule.databases | default('postgres') }}"
        method: "{{ rule.method | default('scram-sha-256') }}"
        source: "{{ rule.source | default('127.0.0.1/32') }}"
      {% endfor %}
  become: true
  become_user: postgres
  register: pg_hba_conf
