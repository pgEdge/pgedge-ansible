---

# A plain Postgres instance for a role that needs one of its own rather than a
# pgEdge Distributed Postgres node, such as setup_lakekeeper's catalog store.
# It is created exactly as setup_postgres creates a node's, by the same tasks,
# from pg_version, cluster_name, pg_port, pg_data and pg_service_name, and then
# started. Nothing here configures it for pgEdge Distributed Postgres: no
# Spock, Snowflake, cluster HBA rules or parameters. Roles that need such an
# instance include this file explicitly:
#
#   - name: Ensure the Postgres instance exists and is running
#     include_role:
#       name: setup_postgres
#       tasks_from: plain_instance

- name: Ensure RHEL pgedge Postgres service is set up
  include_tasks: rhel_prep.yaml
  when: ansible_os_family == 'RedHat'

- name: Ensure the Postgres data and configuration directories exist
  include_tasks: data_dirs.yaml

- name: Ensure the Postgres cluster exists on Debian
  include_tasks: debian_pg_setup.yaml
  when: ansible_os_family == 'Debian'

- name: Ensure the Postgres cluster exists on RHEL
  include_tasks: rhel_pg_setup.yaml
  when: ansible_os_family == 'RedHat'

- name: Ensure the Postgres instance is started
  service:
    name: "{{ pg_service_name }}"
    state: started
    enabled: true
  become: true
