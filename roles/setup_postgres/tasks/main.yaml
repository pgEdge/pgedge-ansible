---

# Postgres is installed by the time this role runs, so its binary can say which
# configuration parameters the installed release recognizes.

- name: Determine which configuration parameters Postgres recognizes
  include_role:
    name: role_config
    tasks_from: pg_feature_checks

# Before a data directory is initialized, ask whether the backup repository
# already holds a cluster. An empty data directory beside a repository full of
# backups means a restore was meant, not a build: deploying produces an empty
# cluster whose system identifier does not match the stanza, so it can never
# archive there, and the repository's recovery point stops advancing while the
# cluster looks healthy. Refusing here costs nothing; the alternative is a whole
# deployment that has to be thrown away.
#
# Skipped when backup_repo_reuse says the caller means it: recover_postgres
# builds every zone's cluster this way, restores one of them, and upgrades
# each stanza to describe what it built.
#
# In an HA zone only the primary is asked. Replicas are never initialized here;
# Patroni clones them from the leader, so a new or wiped replica has an empty
# data directory beside a full repository by design. After a failover the
# primary is not the zone's first node, and the first node, wiped to be
# re-cloned, is just such a replica.
#
# On a new zone the primary is the first node, which Patroni later bootstraps
# from. On a built zone it is wherever Patroni put it, and only there can the
# users, databases and extensions ha_setup creates be written. A built zone
# whose Patroni is stopped everywhere has it started here so its members can
# elect that leader.

- name: Find the node that runs this zone's primary
  include_role:
    name: role_config
    tasks_from: zone_primary
  when: is_ha_cluster | bool

- name: Ensure the backup repository does not already hold this cluster
  include_role:
    name: role_config
    tasks_from: repo_identity
  vars:
    repo_identity_required: false
  when:
  - backup_repo_configured | bool
  - not backup_repo_reuse | bool
  - not is_ha_cluster or inventory_hostname == zone_primary

- name: Ensure RHEL pgedge Postgres service is set up
  include_tasks: rhel_prep.yaml
  when: ansible_os_family == 'RedHat'

# If the pg_data directory is in a non-default location, the Postgres user may
# not be able to create it. Downstream tools will have problems with this so
# this will be a universal step.

- name: Ensure Postgres data directory exists and is owned by postgres user
  file:
    path: "{{ pg_data }}"
    state: directory
    owner: postgres
    mode: "0700"
  become: true

# The configuration directory is given no mode. On RHEL it is the data
# directory, whose mode the task above sets. On Debian pg_createcluster sets
# it, both here and when Patroni clones a replica, and a mode set here would
# be undone by every clone and set again by the next run.

- name: Ensure Postgres configuration path exists and is owned by postgres user
  file:
    path: "{{ pg_config_dir }}"
    state: directory
    owner: postgres
  become: true

# This code branches to either normal setup or HA setup. In the case of HA
# setup, the primary node and replicas have divergent steps, so those are also
# explicit branches.

- include_tasks: setup.yaml
  when:
  - not is_ha_cluster

- include_tasks: ha_setup.yaml
  when:
  - is_ha_cluster
