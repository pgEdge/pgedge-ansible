---

# Configuring a server for PgBackRest is slightly different than a client.
# Servers need to know about all Postgres hosts in their zone so they can
# connect to any of them. Since this is a dedicated server, it also runs as
# a specified user rather than postgres.

- include_tasks: config_backrest.yaml
  vars:
    os_user: "{{ backup_repo_user }}"

# Now we need to allow client systems to connect via SSH for file transfers.
# It's also good to set up a reciprocal relationship since the server may
# reach into Postgres hosts as well.

- name: Allow SSH access from all hosts in this zone
  authorized_key:
    user: "{{ backup_repo_user }}"
    key: "{{ lookup('file', 'host-keys/' + item) }}"
    state: present
  loop: "{{ nodes_in_zone }}"
  become: true

# known_hosts compares one key per call, so each host is given exactly one:
# its ed25519 key. A host in the inventory has its keys among the facts the
# deployment gathered, which every run reads alike. Only a host outside the
# inventory is scanned for it. Handing known_hosts every key ssh-keyscan
# returned made the result depend on the order the keys arrived in, which
# changes from one scan to the next, and a scan run by every fork at once can
# be refused and return nothing.

- name: Make sure backup targets are known SSH hosts
  known_hosts:
    name: "{{ item }}"
    state: present
    key: >-
      {{ item ~ ' ssh-ed25519 ' ~ host_key if host_key
         else lookup('pipe', 'ssh-keyscan -t ed25519 ' ~ (item | quote)
                             ~ " | grep -v '^#'") }}
    hash_host: false
  vars:
    host_key: >-
      {{ (hostvars[item] | default({})).ansible_ssh_host_key_ed25519_public
         | default('') }}
  become: true
  become_user: "{{ backup_repo_user }}"
  loop: "{{ nodes_in_zone }}"

# Make sure that the backup user has an appropriate .pgpass entry. This is
# likely only used to put the server in backup mode and invoke checkpoints,
# but needs to exist.

- name: Ensure backup user can connect to Postgres
  include_role:
    name: role_config
    tasks_from: pgpass_entry
  vars:
    pgpass_os_user: "{{ backup_repo_user }}"
    pgpass_role: "{{ backup_user }}"
    pgpass_password: "{{ backup_password }}"
