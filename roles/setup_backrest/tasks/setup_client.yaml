---

# Everything this role does is writing files, and none of it touches Postgres.
# That is deliberate, and it is what lets the role be applied before Postgres
# exists at all.
#
# Two things depend on it. An HA cluster gets its archive command from the
# Patroni configuration, so Postgres begins archiving the moment Patroni starts
# it, and a pgbackrest.conf written after that point leaves a window where every
# archive attempt fails and WAL piles up in pg_wal. And setup_postgres asks the
# repository whether it already holds a cluster before it initializes a data
# directory, which it can only do once pgbackrest.conf names the repository.
#
# The steps that need a live cluster -- the backup user, the archive commands of
# a non-HA cluster, the stanza, the first backup, the schedule -- live in
# finalize_backrest, which runs at the end of the deployment.

# If backups run from the client, they should always execute as the postgres
# user so we can use a local peer connection.

- include_tasks: config_backrest.yaml
  vars:
    os_user: postgres

# Now we need to allow backup servers to connect via SSH for file transfers,
# and are in our known_hosts to avoid SSH prompts. Only do this if in SSH mode.

- include_tasks: setup_ssh_access.yaml
  when:
  - backup_server > ''
  - backup_type == 'ssh'
