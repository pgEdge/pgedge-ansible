---

# Ask the repository what this stanza already holds. Every decision below reads
# this, so the command is deliberately allowed to fail the play: the expensive
# mistake is concluding "no backups here" from a repository that could not be
# read, because a moment of SSH trouble or a mistyped S3 credential would then
# expire a good backup. A repository that has never been written reports an
# empty list rather than an error, so a genuine first run still passes.

- name: Ask the repository what this stanza already holds
  command:
    argv:
    - pgbackrest
    - "--stanza={{ backup_stanza }}"
    - "--output=json"
    - info
  register: backrest_info
  changed_when: false
  check_mode: false
  become: true
  become_user: "{{ os_user }}"

- name: Record what the repository reports for this stanza
  set_fact:
    backrest_stanza: >-
      {{ backrest_info.stdout | from_json |
         selectattr('name', 'eq', backup_stanza) | first | default({}) }}

# A stanza that has been through stanza-upgrade holds backups of more than one
# cluster: one db entry per system identifier it has described, and each backup
# tagged with the entry it was taken from. Only backups of the newest entry are
# backups of the cluster running now. The others belong to a cluster that was
# replaced -- the old cluster of a zone a recovery rebuilt -- and restoring one
# would bring that cluster back, not this one. So a stanza holding only those
# has no recovery point for this cluster, however many backups it lists.

- name: Record which of those backups belong to the cluster running now
  set_fact:
    backrest_current_backups: >-
      {{ backrest_stanza.backup | default([]) |
         selectattr('database.id', 'eq',
           (backrest_stanza.db | default([]) | map(attribute='id') | list
            + [0]) | max) | list }}
