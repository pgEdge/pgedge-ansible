---

# The standard setup for PgBackRest is to transmit WAL files to the defined
# repo endpoint, and to pull them back from it for a restore. Both commands are
# among the parameters setup_postgres writes, derived from the same backup
# settings this role reads, so by now the running server should be using them.
#
# They used to be edited into postgresql.conf here, on a line setup_postgres
# then wrote back to its placeholder on the next run, so every run changed the
# file twice and left the cluster not archiving in between. This only checks
# the result, so that a first backup is never started against a server whose
# WAL goes nowhere.
#
# This is the non-HA path only. An HA cluster gets the same two commands from
# the Patroni configuration template, because Patroni owns postgresql.conf on
# those nodes and rewrites whatever is put here.

- name: Read the archive command Postgres is using
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: postgres
    login_unix_socket: /var/run/postgresql
    query: SHOW archive_command
  register: live_archive_command
  changed_when: false
  become: true
  become_user: postgres

- name: Ensure Postgres archives to the repository
  assert:
    that:
    - live_archive_command.query_result[0].archive_command
      == pg_required_parameters.archive_command
    fail_msg: >-
      Postgres on {{ inventory_hostname }} is archiving with
      '{{ live_archive_command.query_result[0].archive_command }}', not
      '{{ pg_required_parameters.archive_command }}'. setup_postgres writes the
      archive command; run it before this role, in the same play or an
      earlier one.
    quiet: true
