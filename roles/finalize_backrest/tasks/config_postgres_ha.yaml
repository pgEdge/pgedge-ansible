---

# Make sure the Patroni configuration store holds the PgBackRest archive and
# restore commands.
#
# The Patroni template already renders them, but Patroni reads bootstrap.dcs
# only when it bootstraps a cluster. A cluster deployed without a repository and
# given one later bootstrapped with the /bin/true placeholder, and the store
# keeps that no matter what the template says now. That cluster would get a
# stanza and a backup schedule and never archive a thing, and its first backup
# would wait for WAL that never arrives.
#
# The store is read first and patched only when it disagrees, so a cluster that
# already archives is left alone. Patroni pushes the change to every member and
# reloads Postgres itself.

- name: Read the Patroni configuration store
  command:
    argv:
    - patronictl
    - -c
    - "{{ patroni_config_dir }}/{{ patroni_config_file }}"
    - show-config
    - "{{ patroni_scope }}"
  register: dcs_config
  changed_when: false
  become: true
  become_user: postgres
  when: inventory_hostname == first_node_in_zone

- name: Point the Patroni configuration store at the repository
  command:
    argv:
    - patronictl
    - -c
    - "{{ patroni_config_dir }}/{{ patroni_config_file }}"
    - edit-config
    - --force
    - --apply
    - "-"
    - "{{ patroni_scope }}"
    stdin: "{{ {'postgresql': {'parameters': archive_params}} | to_nice_yaml }}"
  become: true
  become_user: postgres
  vars:
    stored: >-
      {{ ((dcs_config.stdout | from_yaml | default({}, true)).postgresql
          | default({}, true)).parameters | default({}, true) }}
  when:
  - inventory_hostname == first_node_in_zone
  - stored | combine(archive_params) != stored

# The first backup cannot finish until archiving works, and Patroni applies a
# store change on its own schedule rather than when edit-config returns. Only
# the leader archives, so only the leader is waited for. The replicas are no
# good for this anyway: setup_patroni waits for the primary and not for them,
# so on a fresh deployment a replica can still be cloning when this runs and
# has no Postgres to ask.
#
# patronictl shows Host as host:port once any member runs on a port other than
# 5432 (or two members share a host), so the port is stripped before the name
# is compared with the inventory. pipefail keeps a patronictl failure from
# passing as an empty list.

- name: Find this zone's leader
  shell: |-
    set -o pipefail
    {{ ctl }} list {{ patroni_scope }} -f json \
        | jq -r '.[] | select(.Role == "Leader") | .Host | sub(":[0-9]+$"; "")'
  args:
    executable: /bin/bash
  vars:
    ctl: "patronictl -c {{ patroni_config_dir }}/{{ patroni_config_file }}"
  register: zone_leader
  changed_when: false
  become: true
  become_user: postgres
  when: inventory_hostname == first_node_in_zone

# Without a leader the wait below would match no host and skip, and the first
# backup would then hang waiting for WAL instead of saying why.

- name: Ensure this zone has exactly one leader among its nodes
  assert:
    that:
    - zone_leader.stdout_lines | length == 1
    - zone_leader.stdout | trim in nodes_in_zone
    fail_msg: >-
      Patroni cluster {{ patroni_scope }} should have one leader among
      {{ nodes_in_zone | join(', ') }}, but patronictl list reported
      {{ zone_leader.stdout_lines | join(', ') if zone_leader.stdout_lines
         else 'none' }}. Postgres cannot be checked for the archive command
      until the cluster has a leader; see 'patronictl list {{ patroni_scope }}'
      on {{ inventory_hostname }}.
  when: inventory_hostname == first_node_in_zone

- name: Wait for Postgres to take up the archive command
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: postgres
    login_unix_socket: /var/run/postgresql
    query: SHOW archive_command
  register: live_archive_command
  until: >-
    live_archive_command.query_result is defined and
    live_archive_command.query_result[0].archive_command
    == archive_params.archive_command
  retries: 12
  delay: 5
  changed_when: false
  become: true
  become_user: postgres
  when: inventory_hostname == hostvars[first_node_in_zone].zone_leader.stdout | trim
