---

- include_tasks: tls.yaml
  when: patroni_dcs.type in ('etcd', 'etcd3')

# The pgbackrest replica method is a script that restores only a backup that
# can become a replica of the leader, and on Debian then creates the
# configuration directory the restore does not. Patroni runs it as postgres,
# which only needs to execute it; root owns it so the postgres user cannot
# change what Patroni runs.

- name: Install the replica method that restores from the repository
  template:
    src: templates/pgbackrest_replica.sh.j2
    dest: "{{ patroni_pgbackrest_replica_script }}"
    mode: "0755"
    owner: root
    group: root
  become: true
  when: replica_from_backup | bool

- name: Create configuration file for Patroni node
  template:
    src: templates/patroni.yml.j2
    dest: "{{ patroni_config_dir }}/{{ patroni_config_file }}"
    mode: 0600
    owner: postgres
    group: postgres
  become: true
  # The file holds the superuser and replication passwords, and --diff would
  # print both.
  diff: false

- name: Ensure the Postgres service is disabled in favor of Patroni
  systemd_service:
    name: "{{ pg_service_name }}"
    enabled: false
  become: true

# If this is a replica, __DO NOT__ let it start before the primary establishes
# the cluster. Patroni will adopt the ID of the first node to join it and
# we need the intended primary to do this for controlled setup.

- name: Enable and start the Patroni service
  systemd_service:
    daemon_reload: true
    name: "{{ patroni_service_name }}"
    enabled: true
    state: started
  become: true
  register: patroni_takeover
  when: inventory_hostname == first_node_in_zone

- include_tasks: wait_for_primary.yaml
  when: inventory_hostname != first_node_in_zone

- name: Enable and start the Patroni service
  systemd_service:
    daemon_reload: true
    name: "{{ patroni_service_name }}"
    enabled: true
    state: started
  become: true
  when: inventory_hostname != first_node_in_zone

# Wait for Patroni to become ready before sending it commands.

- include_tasks: wait_for_primary.yaml

# The parameters in the zone's store may have changed since it bootstrapped.

- include_tasks: dcs_parameters.yaml

# Patroni applies what it can with a reload, but leaves a parameter that needs
# a restart pending and does not restart Postgres on its own. Restart through
# patronictl rather than the service, because a direct Postgres restart does
# not clear Patroni's "Pending restart" flag.
#
# Only members with a restart pending are restarted, and one at a time, so a
# zone never has more than one member down. With pg_allow_restart off the
# pending members are only reported, which leaves the restarts to a separate
# rolling-restart playbook or a maintenance window.
#
# A first node whose Patroni this run started is restarted regardless, and
# whatever pg_allow_restart says: that restart is part of building the zone,
# not a change to a running one. Patroni took over the Postgres setup_postgres
# left running, configured only for running outside Patroni, and may not have
# flagged it yet by the time it reports the member running. Stopping that
# Postgres first and letting Patroni start it instead would avoid the restart,
# but Patroni starts a stopped data directory with no leader as a replica and
# promotes it, so every new zone would begin on timeline 2. Replicas need no
# such care: Patroni starts their Postgres itself, with the zone's
# configuration.

- name: Find the members waiting on a restart
  include_tasks: pending_restart.yaml
  vars:
    restart_regardless: "{{ patroni_takeover is changed }}"

# Replicas go first. Raising a parameter such as max_worker_processes or
# max_connections on the leader before its replicas leaves them unable to
# replay WAL written under the larger value, and Postgres pauses or stops
# recovery until they catch up; a replica running with more than its leader is
# no trouble at all.

- name: Restart replicas to apply parameters that need it
  command:
    argv: "{{ restart_argv }}"
  throttle: 1
  become: true
  become_user: postgres
  when:
  - restart_pending | bool
  - not zone_leader | bool
  - pg_allow_restart | bool

- name: Restart the leader to apply parameters that need it
  command:
    argv: "{{ restart_argv }}"
  register: leader_restart
  throttle: 1
  become: true
  become_user: postgres
  when:
  - restart_pending | bool
  - zone_leader | bool
  - pg_allow_restart | bool or patroni_takeover is changed

# Lowering one of those parameters works the other way round. Patroni starts a
# replica with the larger of the zone's value and the one in its control file,
# which follows the leader's, so a replica has nothing to apply until the
# leader has restarted with the smaller value and the replica has replayed the
# record of it. Patroni flags it then, a cycle or so later, and it is restarted
# in a second pass. A raised parameter leaves nothing for this pass to do.

- name: Wait for the replicas to replay their leader's new settings
  wait_for:
    timeout: 20
  when: zone_leader_restarted | bool
  vars:
    zone_leader_restarted: >-
      {{ nodes_in_zone | map('extract', hostvars)
         | selectattr('leader_restart', 'defined')
         | map(attribute='leader_restart') | select('changed')
         | list | length > 0 }}

- name: Find the replicas waiting on their leader's restart
  include_tasks: pending_restart.yaml
  vars:
    restart_regardless: false
  when:
  - pg_allow_restart | bool
  - not zone_leader | bool

- name: Restart replicas to apply what their leader's restart changed
  command:
    argv: "{{ restart_argv }}"
  throttle: 1
  become: true
  become_user: postgres
  when:
  - restart_pending | bool
  - not zone_leader | bool
  - pg_allow_restart | bool

- name: Report a restart left pending
  debug:
    msg: >-
      Postgres on {{ inventory_hostname }} needs a restart to apply its new
      configuration. pg_allow_restart is off, so it was left running as it is;
      restart it with patronictl restart --pending.
  when:
  - restart_pending | bool
  - not pg_allow_restart | bool
  - patroni_takeover is not changed
