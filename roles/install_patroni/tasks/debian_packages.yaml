---

- name: Install Patroni and DCS Python dependencies
  package:
    name: >-
      {{ ['pgedge-patroni'] +
         patroni_dcs_packages[ansible_os_family][patroni_dcs.type] }}
    state: present
    lock_timeout: 300
  retries: 5
  delay: 20
  register: result
  until: result is success
  become: true
