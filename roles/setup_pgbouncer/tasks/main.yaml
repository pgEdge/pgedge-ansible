---

# Configure and run pgBouncer on each pooled pgEdge node (the package is
# installed by install_pgbouncer). pgBouncer listens on pgbouncer_port and
# forwards to the node's local Postgres on 127.0.0.1; the Patroni-managed
# pg_hba.conf already permits "host all all 127.0.0.1/32 scram-sha-256", so
# Patroni is untouched.
#
# Pooled and direct connections are not interchangeable — they resolve against
# different pg_hba rules — so nothing here fails a pooled client over to
# Postgres. A dead pooler is an outage of the pooled endpoint by design, and
# Restart=always below is the mitigation.

- name: Ensure pgBouncer configuration directory exists
  file:
    path: /etc/pgbouncer
    state: directory
    owner: "{{ pgbouncer_user }}"
    group: "{{ pgbouncer_group }}"
    mode: "0750"
  become: true

# Written before the service is ever started, so the first start already has
# the restart policy and the descriptor limit in place. StartLimitIntervalSec=0
# disables the systemd rate-limit that would otherwise stop retrying after a
# few crashes.

- name: Ensure pgBouncer systemd drop-in directory exists
  file:
    path: /etc/systemd/system/pgbouncer.service.d
    state: directory
    mode: "0755"
  become: true

- name: Configure pgBouncer to always restart
  copy:
    dest: /etc/systemd/system/pgbouncer.service.d/override.conf
    mode: "0644"
    content: |
      [Unit]
      StartLimitIntervalSec=0

      [Service]
      Restart=always
      RestartSec=2
      LimitNOFILE={{ pgbouncer_limit_nofile }}
  register: dropin_status
  become: true

# Write the userlist with plain passwords so pgBouncer can both verify clients
# and authenticate to the backend Postgres. auth_type = scram-sha-256 keeps
# SCRAM on the wire; pgBouncer derives the verifier from the plain password.

- name: Write pgBouncer userlist
  copy:
    dest: /etc/pgbouncer/userlist.txt
    owner: "{{ pgbouncer_user }}"
    group: "{{ pgbouncer_group }}"
    mode: "0640"
    content: |
      {% for u in pgbouncer_userlist %}
      "{{ u.user | replace('"', '""') }}" "{{ u.password | replace('"', '""') }}"
      {% endfor %}
  register: userlist_status
  become: true
  no_log: true

- name: Write pgBouncer configuration
  template:
    src: pgbouncer.ini.j2
    dest: /etc/pgbouncer/pgbouncer.ini
    owner: "{{ pgbouncer_user }}"
    group: "{{ pgbouncer_group }}"
    mode: "0640"
  register: config_status
  become: true

# Debian's package also ships a pgbouncer.socket that listens on 6432. Nothing
# uses it: the service unit's "Requires=pgbouncer.socket" line is commented out
# and the package's postinst enables only the service. But the two units bind
# the same port, so a socket someone starts by hand takes 6432 and the pooler
# then fails its next restart — with the socket answering connections it cannot
# hand off. Mask it, so that cannot happen.

- name: Mask the packaged pgBouncer socket unit
  systemd:
    name: pgbouncer.socket
    state: stopped
    enabled: false
    masked: true
  when: ansible_facts['os_family'] == 'Debian'
  become: true

# Only restart pgBouncer on subsequent runs if something it reads changed.
# Otherwise, just make sure it's up and running. This is deliberately not a
# handler: with any_errors_fatal, a notified handler never fires when a later
# role fails, which would leave the pooler running stale configuration while
# Ansible reported the change as applied.

- name: Ensure pgBouncer is enabled and running
  systemd:
    name: pgbouncer
    enabled: true
    daemon_reload: "{{ dropin_status.changed }}"
    state: >-
      {{ 'restarted'
         if (dropin_status.changed or userlist_status.changed or
             config_status.changed)
         else 'started' }}
  become: true
