---

# Join one zone, pgedge_join_zone (N below), to every database that holds data
# and that it is not yet a member of. Every task runs on N's primary only.
#
# Its roles first, once for the zone, since roles belong to the whole server
# rather than to a database. Then each database through the whole procedure,
# in db_names order.

# A zone that joins before N in this run is one of N's members by the time N
# starts. If its join failed, its primary has left the play, and N must not
# treat a zone that is half joined as a member, let alone copy from it. A
# failed host is no longer in ansible_play_hosts.

- name: Stop zone {{ pgedge_join_zone }}, since a zone before it did not finish joining
  fail:
    msg: >-
      Zone {{ unfinished | join(', ') }}, which joins before zone
      {{ pgedge_join_zone }} in this run, did not finish joining, so zone
      {{ pgedge_join_zone }} has not started and holds nothing on the other
      zones. Deal with zone {{ unfinished | join(', ') }} as its own failure
      says, then run the same command again.
  vars:
    unfinished: >-
      {%- set out = [] -%}
      {%- for z in pgedge_join_plan[:pgedge_join_plan.index(pgedge_join_zone)]
            if pgedge_join_layout[z | string] | default({}) | length > 0
               and pgedge_zone_hosts[z | string] not in ansible_play_hosts -%}
      {%-   set _ = out.append(z) -%}
      {%- endfor -%}
      {{ out }}
  when:
  - inventory_hostname == pgedge_zone_hosts[pgedge_join_zone | string]
  - pgedge_join_dbs | length > 0
  - unfinished | length > 0

- name: Copy zone {{ pgedge_join_zone }}'s roles from its source zone
  include_tasks: join_seed.yaml
  vars:
    pgedge_join_seed_step: roles
    # Roles are the same on every member, so any member is a good source. The
    # first database's source keeps a resumed join on the zone it started with.
    pgedge_join_db: "{{ pgedge_join_dbs | first }}"
  when:
  - inventory_hostname == pgedge_zone_hosts[pgedge_join_zone | string]
  - pgedge_join_dbs | length > 0

- name: Join zone {{ pgedge_join_zone }} to each database that holds data
  include_tasks: join_database.yaml
  loop: "{{ pgedge_join_dbs }}"
  loop_control:
    loop_var: pgedge_join_db
  when: inventory_hostname == pgedge_zone_hosts[pgedge_join_zone | string]
