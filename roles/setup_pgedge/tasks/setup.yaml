---

# The node and every subscription below are created only if missing. A query
# that selects the create call only when the object is absent returns a row
# exactly when it made one, so the row count says whether anything changed; a
# DO block reports a change whether or not it did anything.

- name: Set up Spock to manage node metadata
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
    login_unix_socket: /var/run/postgresql
    query: |-
      SELECT spock.node_create(node_name := %(node_name)s, dsn := %(dsn)s)
       WHERE NOT EXISTS (SELECT FROM spock.node WHERE node_name = %(node_name)s)
    named_args:
      node_name: "edge{{ zone }}"
      dsn: "host={{ inventory_hostname }} user={{ pgedge_user }} dbname={{ item }} port={{ pg_port }}"
  loop: "{{ db_names }}"
  register: spock_node
  changed_when: spock_node.rowcount > 0
  become: true
  become_user: postgres

# Loop through every other known pgEdge node and subscribe to it.
# This is technically a nested loop, since we need to subscribe to each DB on
# every node.

- name: Subscribe to other pgEdge nodes and databases in the cluster, by zone
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item.1 }}"
    login_unix_socket: /var/run/postgresql
    query: |-
      SELECT spock.sub_create(
               subscription_name := %(sub_name)s, provider_dsn := %(dsn)s
             )
       WHERE NOT EXISTS (
               SELECT FROM spock.subscription WHERE sub_name = %(sub_name)s
             )
    named_args:
      sub_name: "sub_n{{ zone }}_n{{ remote_zone }}"
      dsn: "host={{ item.0 }} user={{ pgedge_user }} dbname={{ item.1 }} port={{ pg_port }}"
  vars:
    remote_zone: "{{ hostvars[item.0]['zone'] }}"
  loop: >-
    {{ groups['pgedge'] | reject('equalto', inventory_hostname) | 
    product(db_names) | list }}
  register: spock_sub
  changed_when: spock_sub.rowcount > 0
  become: true
  become_user: postgres
