---

# The node and every subscription below are created only if missing. A query
# that selects the create call only when the object is absent returns a row
# exactly when it made one, so the row count says whether anything changed; a
# DO block reports a change whether or not it did anything.
#
# A zone joining a database that already holds data gets its node from the
# join instead, once the join's checks have passed (see pgedge_mesh_allowed).

- name: Set up Spock to manage node metadata
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
    login_unix_socket: /var/run/postgresql
    query: |-
      SELECT spock.node_create(node_name := %(node_name)s, dsn := %(dsn)s)
       WHERE NOT EXISTS (SELECT FROM spock.node WHERE node_name = %(node_name)s)
    named_args:
      node_name: "edge{{ zone }}"
      dsn: "{{ pgedge_zone_dsn }}"
  vars:
    pgedge_dsn_zone: "{{ zone }}"
    pgedge_dsn_db: "{{ item }}"
    pgedge_mesh_db: "{{ item }}"
    pgedge_mesh_zones: ["{{ zone }}"]
  loop: "{{ db_names }}"
  register: spock_node
  changed_when: spock_node.rowcount > 0
  become: true
  become_user: postgres
  when: pgedge_mesh_allowed | bool

# Loop through every other known pgEdge node and subscribe to it.
# This is technically a nested loop, since we need to subscribe to each DB on
# every node.
#
# A subscription is recognised by the node it comes from as well as by its
# name. Spock allows two subscriptions from the same provider under different
# names, and both would apply every change, so finding either one is enough to
# create neither.
#
# In a database that already holds data, no subscription is created here to or
# from a zone that is not yet a member: the join creates those, in the order
# that keeps every write accounted for (see pgedge_mesh_allowed).

- name: Subscribe to other pgEdge nodes and databases in the cluster, by zone
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item.1 }}"
    login_unix_socket: /var/run/postgresql
    query: |-
      SELECT spock.sub_create(
               subscription_name := %(sub_name)s, provider_dsn := %(dsn)s
             )
       WHERE NOT EXISTS (
               SELECT FROM spock.subscription s
                 JOIN spock.node n ON n.node_id = s.sub_origin
                WHERE s.sub_name = %(sub_name)s
                   OR n.node_name = %(provider)s
             )
    named_args:
      sub_name: "sub_n{{ zone }}_n{{ remote_zone }}"
      provider: "edge{{ remote_zone }}"
      dsn: "{{ pgedge_zone_dsn }}"
  vars:
    remote_zone: "{{ hostvars[item.0]['zone'] }}"
    pgedge_dsn_zone: "{{ remote_zone }}"
    pgedge_dsn_db: "{{ item.1 }}"
    pgedge_mesh_db: "{{ item.1 }}"
    pgedge_mesh_zones: ["{{ zone }}", "{{ remote_zone }}"]
  loop: >-
    {{ groups['pgedge'] | reject('equalto', inventory_hostname) | 
    product(db_names) | list }}
  register: spock_sub
  changed_when: spock_sub.rowcount > 0
  become: true
  become_user: postgres
  when: pgedge_mesh_allowed | bool
