---

# A DO $$ ... $$ block always reports changed, on every run, whether
# or not its IF NOT FOUND branch actually fired: Postgres's own
# command tag for an anonymous block is just "DO", with no row count,
# so postgresql_query has nothing to detect a real change from. Check
# for existence as its own SELECT first (which the module correctly
# never reports as changed) and only run the plain function-call
# creation query when the check found nothing, so changed_when: true
# on that second query is always accurate.

- name: Check whether this node is already known to Spock
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
    login_unix_socket: /var/run/postgresql
    query: "SELECT 1 FROM spock.node WHERE node_name = %(node_name)s"
    named_args:
      node_name: "edge{{ zone }}"
  register: spock_node_status
  loop: "{{ db_names }}"
  become: true
  become_user: postgres
  changed_when: false

- name: Set up Spock to manage node metadata
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item.item }}"
    login_unix_socket: /var/run/postgresql
    query: >-
      SELECT spock.node_create(node_name := %(node_name)s,
      dsn := %(dsn)s)
    named_args:
      node_name: "edge{{ zone }}"
      dsn: >-
        host={{ inventory_hostname }} user={{ pgedge_user }}
        dbname={{ item.item }} port={{ pg_port }}
  loop: "{{ spock_node_status.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.query_result | length == 0
  changed_when: true
  become: true
  become_user: postgres

# Loop through every other known pgEdge node and subscribe to it.
# This is technically a nested loop, since we need to subscribe to each DB on
# every node.

- name: Check which subscriptions to other pgEdge nodes already exist
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item.1 }}"
    login_unix_socket: /var/run/postgresql
    query: "SELECT 1 FROM spock.subscription WHERE sub_name = %(sub_name)s"
    named_args:
      sub_name: "sub_n{{ zone }}_n{{ remote_zone }}"
  vars:
    remote_zone: "{{ hostvars[item.0]['zone'] }}"
  register: spock_subscription_status
  loop: >-
    {{ groups['pgedge'] | reject('equalto', inventory_hostname) |
    product(db_names) | list }}
  become: true
  become_user: postgres
  changed_when: false

- name: Subscribe to other pgEdge nodes and databases in the cluster, by zone
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item.item.1 }}"
    login_unix_socket: /var/run/postgresql
    query: >-
      SELECT spock.sub_create(subscription_name := %(sub_name)s,
      provider_dsn := %(dsn)s)
    named_args:
      sub_name: "sub_n{{ zone }}_n{{ remote_zone }}"
      dsn: >-
        host={{ item.item.0 }} user={{ pgedge_user }}
        dbname={{ item.item.1 }} port={{ pg_port }}
  vars:
    remote_zone: "{{ hostvars[item.item.0]['zone'] }}"
  loop: "{{ spock_subscription_status.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.query_result | length == 0
  changed_when: true
  become: true
  become_user: postgres
