---

# Make sure that the pgedge node communication user has an appropriate .pgpass
# entry so the nodes can communicate with each other.

- name: Ensure pgedge communication user can connect to cluster
  include_role:
    name: role_config
    tasks_from: pgpass_entry
  vars:
    pgpass_os_user: postgres
    pgpass_role: "{{ pgedge_user }}"
    pgpass_password: "{{ pgedge_password }}"
