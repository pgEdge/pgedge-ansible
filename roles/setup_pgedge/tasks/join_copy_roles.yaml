---

# Step 1 of a join: copy the source zone's roles to the joining zone, before
# any table, so that the copied tables' owners and grants have roles to name.
# Roles belong to the whole server rather than to a database, so this runs once
# for the zone. Runs on the joining zone's primary.
#
# pg_dumpall --roles-only is the only complete account of a role: every
# attribute, its password hash, its settings and its memberships. Its output
# is piped straight into psql on this server, so the password hashes are never
# written to disk, and the task logs nothing.
#
# A role this server already has is left as it is: its CREATE ROLE, ALTER
# ROLE and COMMENT ON ROLE lines are dropped from the stream on the way. That
# keeps the roles the collection manages here -- postgres, the cluster's own
# users, the pooler's -- exactly as this zone's deployment made them, and
# makes a second copy a no-op. Membership grants are kept, so a copied role is
# granted what it had on the source.
#
# pg_dumpall runs from this server's binaries against the source, which is
# what PostgreSQL supports when the joining zone runs a newer major release
# than the members. It reaches the source where a subscription would, as the
# cluster's own user, with the password in postgres's .pgpass.
#
# Done when every role on the source, other than Postgres's own pg_ roles,
# exists here. A failure can be resumed.

- name: "Step 1: list the roles zone {{ pgedge_join_source }} has"
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: postgres
    login_unix_socket: /var/run/postgresql
    query: >-
      SELECT coalesce(json_agg(rolname::text ORDER BY rolname), '[]'::json)
             AS roles
        FROM pg_roles
       WHERE rolname !~ '^pg_'
  register: pgedge_join_source_roles
  changed_when: false
  delegate_to: "{{ pgedge_zone_hosts[pgedge_join_source | string] }}"
  become: true
  become_user: postgres

- name: "Step 1: list the roles zone {{ pgedge_join_zone }} has"
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: postgres
    login_unix_socket: /var/run/postgresql
    query: >-
      SELECT coalesce(json_agg(rolname::text ORDER BY rolname), '[]'::json)
             AS roles,
             coalesce(string_agg(quote_ident(rolname), E'\n'), '') AS quoted
        FROM pg_roles
  register: pgedge_join_own_roles
  changed_when: false
  become: true
  become_user: postgres

# The filter compares each statement's start with the role names as
# pg_dumpall writes them, quoted where they need it, so a name with spaces or
# capitals is matched whole.

- name: "Step 1: copy the roles zone {{ pgedge_join_zone }} lacks from zone {{ pgedge_join_source }}"
  shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      "{{ pg_path }}/bin/pg_dumpall" --roles-only -w \
          -h "$SOURCE_HOST" -p "$SOURCE_PORT" -U "$SOURCE_USER" -l postgres |
        awk '
          BEGIN {
            n = split(ENVIRON["EXISTING"], names, "\n")
            for (i = 1; i <= n; i++) if (names[i] != "") have[names[i]] = 1
          }
          function existing(prefix,   r) {
            if (index($0, prefix) != 1) return 0
            for (r in have)
              if (index($0, prefix r " ") == 1 || index($0, prefix r ";") == 1)
                return 1
            return 0
          }
          existing("CREATE ROLE ") { next }
          existing("ALTER ROLE ") { next }
          existing("COMMENT ON ROLE ") { next }
          { print }
        ' |
        "{{ pg_path }}/bin/psql" -X -q -v ON_ERROR_STOP=1 --single-transaction \
          -h /var/run/postgresql -p {{ pg_port }} -d postgres -f - 2>&1 >/dev/null
  environment:
    SOURCE_HOST: "{{ pgedge_dsn_host | trim }}"
    SOURCE_PORT: "{{ pgedge_dsn_port | trim }}"
    SOURCE_USER: "{{ pgedge_user }}"
    EXISTING: "{{ pgedge_join_own_roles.query_result[0].quoted }}"
  vars:
    pgedge_dsn_zone: "{{ pgedge_join_source }}"
    pgedge_dsn_db: postgres
    missing: >-
      {{ pgedge_join_source_roles.query_result[0].roles
         | reject('in', pgedge_join_own_roles.query_result[0].roles) | list }}
  register: pgedge_join_roles_copy
  changed_when: pgedge_join_roles_copy.rc | default(1) == 0
  failed_when: false
  no_log: true
  become: true
  become_user: postgres
  when: missing | length > 0

# The copy logs nothing, since what it reads holds password hashes. Its errors
# are shown here instead, with any password literal blanked out.

- name: "Step 1: ensure the roles were copied"
  assert:
    that:
    - pgedge_join_roles_copy is skipped or pgedge_join_roles_copy.rc == 0
    fail_msg: >-
      Copying the roles of zone {{ pgedge_join_source }} to zone
      {{ pgedge_join_zone }} failed, and nothing was changed on zone
      {{ pgedge_join_zone }}:
      {{ (pgedge_join_roles_copy.stdout | default('')
          ~ ' ' ~ pgedge_join_roles_copy.stderr | default(''))
         | regex_replace("(?i)password\\s+'[^']*'", "PASSWORD '***'")
         | trim | truncate(2000) }}
    quiet: true

- name: "Step 1: read the roles zone {{ pgedge_join_zone }} has now"
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: postgres
    login_unix_socket: /var/run/postgresql
    query: >-
      SELECT coalesce(json_agg(rolname::text ORDER BY rolname), '[]'::json)
             AS roles
        FROM pg_roles
  register: pgedge_join_own_roles_after
  changed_when: false
  become: true
  become_user: postgres
  when: pgedge_join_roles_copy is not skipped

- name: "Step 1: ensure zone {{ pgedge_join_zone }} has every role zone {{ pgedge_join_source }} has"
  assert:
    that:
    - missing | length == 0
    fail_msg: >-
      After copying the roles of zone {{ pgedge_join_source }}, zone
      {{ pgedge_join_zone }} still lacks {{ missing | join(', ') }}.
    quiet: true
  vars:
    missing: >-
      {{ pgedge_join_source_roles.query_result[0].roles
         | reject('in', pgedge_join_own_roles_after.query_result[0].roles)
         | list }}
  when: pgedge_join_roles_copy is not skipped
