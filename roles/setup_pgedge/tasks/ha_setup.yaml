---

# Try to connect to all proxy nodes to ensure they're all working 
# properly, as our subscriptions will route through them.

- name: Verify this host can contact Postgres through known proxies
  community.postgresql.postgresql_ping:
    login_port: "{{ proxy_port }}"
    login_db: postgres
    login_host: "{{ item }}"
    login_user: "{{ pgedge_user }}"
  register: result
  loop: >-
    {{ ( (hostvars.values() | map(attribute = 'proxy_node', default = '')) +
       (groups['haproxy'] | default([])) ) | select() }}
  retries: 5
  delay: 10
  until: result.is_available
  become: true
  become_user: postgres

# Now that proxies are verified, it's safe to start wiring the cluster
# together, starting with establishing our own node.
#
# The node and every subscription below are created only if missing. A query
# that selects the create call only when the object is absent returns a row
# exactly when it made one, so the row count says whether anything changed; a
# DO block reports a change whether or not it did anything.
#
# A zone joining a database that already holds data gets its node from the
# join instead, once the join's checks have passed (see pgedge_mesh_allowed).

- name: Set up Spock to manage node metadata
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
    login_unix_socket: /var/run/postgresql
    query: |-
      SELECT spock.node_create(node_name := %(node_name)s, dsn := %(dsn)s)
       WHERE NOT EXISTS (SELECT FROM spock.node WHERE node_name = %(node_name)s)
    named_args:
      node_name: "edge{{ zone }}"
      dsn: "{{ pgedge_zone_dsn }}"
  vars:
    pgedge_dsn_zone: "{{ zone }}"
    pgedge_dsn_db: "{{ item }}"
    pgedge_mesh_db: "{{ item }}"
    pgedge_mesh_zones: ["{{ zone }}"]
  loop: "{{ db_names }}"
  register: spock_node
  changed_when: spock_node.rowcount > 0
  become: true
  become_user: postgres
  when: pgedge_mesh_allowed | bool

# When one zone already holds the cluster's data and the others are empty --
# the zone a recovery restored -- the empty zones copy that seed zone before
# the rest of the mesh exists. Outside a join, this is the one subscription in
# the collection that copies anything. Every other subscription is created
# between zones that already hold the same data, and only streams forward from
# the moment it exists. A zone joining a running cluster copies an existing
# zone too, but by the join's own procedure, since there the other zones keep
# taking writes while it copies.
#
# The copy has to finish before any other subscription is created, and it does:
# under the linear strategy every host finishes this wait before any host moves
# on to the mesh below, which then finds this subscription and skips it. The
# seed zone's own hosts skip both tasks.

- name: Copy the seed zone's schema and data into this zone
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
    login_unix_socket: /var/run/postgresql
    query: |-
      SELECT spock.sub_create(
               subscription_name := %(sub_name)s,
               provider_dsn := %(dsn)s,
               synchronize_structure := true,
               synchronize_data := true
             )
       WHERE NOT EXISTS (
               SELECT FROM spock.subscription WHERE sub_name = %(sub_name)s
             )
    named_args:
      sub_name: "sub_n{{ zone }}_n{{ pgedge_seed_zone }}"
      dsn: "{{ pgedge_zone_dsn }}"
  vars:
    pgedge_dsn_zone: "{{ pgedge_seed_zone }}"
    pgedge_dsn_db: "{{ item }}"
  loop: "{{ db_names }}"
  register: spock_seed_sub
  changed_when: spock_seed_sub.rowcount > 0
  become: true
  become_user: postgres
  when:
  - pgedge_seed_zone | string > ''
  - zone | string != pgedge_seed_zone | string

# The wait lives in its own file, which a joining zone's copy uses too. It is
# described there.

- name: Wait for this zone to finish copying the seed zone
  include_tasks: wait_for_copy.yaml
  vars:
    pgedge_copy_source: the seed zone
    pgedge_copy_waits: >-
      {{ db_names | map('community.general.dict_kv', 'db')
         | map('combine', {'sub': 'sub_n' ~ zone ~ '_n' ~ pgedge_seed_zone})
         | list }}
  when:
  - pgedge_seed_zone | string > ''
  - zone | string != pgedge_seed_zone | string

# Loop through every _other_ zone than our own and subscribe in this order:
#
# - The user-specified proxy_node for the host, if present.
# - The first node in the `haproxy` group for this zone, if any.
# - The first pgedge node in the zone itself, assuming no proxies match.
#
# A subscription is recognised by the node it comes from as well as by its
# name. Spock allows two subscriptions from the same provider under different
# names, and both would apply every change, so finding either one is enough to
# create neither.
#
# In a database that already holds data, no subscription is created here to or
# from a zone that is not yet a member: the join creates those, in the order
# that keeps every write accounted for (see pgedge_mesh_allowed).

- name: Subscribe to any other pgEdge nodes in the cluster, by zone
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item.1 }}"
    login_unix_socket: /var/run/postgresql
    query: |-
      SELECT spock.sub_create(
               subscription_name := %(sub_name)s, provider_dsn := %(dsn)s
             )
       WHERE NOT EXISTS (
               SELECT FROM spock.subscription s
                 JOIN spock.node n ON n.node_id = s.sub_origin
                WHERE s.sub_name = %(sub_name)s
                   OR n.node_name = %(provider)s
             )
    named_args:
      sub_name: "sub_n{{ zone }}_n{{ item.0 }}"
      provider: "edge{{ item.0 }}"
      dsn: "{{ pgedge_zone_dsn }}"
  vars:
    pgedge_dsn_zone: "{{ item.0 }}"
    pgedge_dsn_db: "{{ item.1 }}"
    pgedge_mesh_db: "{{ item.1 }}"
    pgedge_mesh_zones: ["{{ zone }}", "{{ item.0 }}"]
  loop: "{{ zone_list | reject('equalto', zone) | product(db_names) | list }}"
  register: spock_sub
  changed_when: spock_sub.rowcount > 0
  become: true
  become_user: postgres
  when: pgedge_mesh_allowed | bool

# This may not be strictly necessary, but it's good practice to wait until the
# subscriptions are synced before continuing. If this is preventing cluster
# setup from completing, it will be moved to an optional validation step.
#
# A zone partway into a join is left out in the databases it is joining: its
# copy, if a stopped join left one running, is waited for by the join itself,
# which can tell a copy that is still moving from one that never will.
# spock.sub_wait_for_sync() cannot, and would wait for either.

- name: Wait for subscriptions to sync
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
    login_unix_socket: /var/run/postgresql
    query: |
      SELECT spock.sub_wait_for_sync(subscription_name := sub_name)
        FROM spock.subscription;
  vars:
    pgedge_mesh_db: "{{ item }}"
    pgedge_mesh_zones: ["{{ zone }}"]
  loop: "{{ db_names }}"
  become: true
  become_user: postgres
  when: pgedge_mesh_allowed | bool
