---

# Before anything is created, find out what the cluster already is.
#
# A zone added to the inventory of a cluster that already holds data cannot be
# wired in the way a new cluster is. The plain subscriptions an ordinary run
# creates stream changes forward from the moment they exist: they copy nothing
# that was written before, so the new zone would start without the data every
# other zone holds and go on disagreeing with them. Such a zone has to join, by
# a procedure that copies the data and accounts for every write in flight, and
# only the operator can ask for that, with pgedge_join_zones.
#
# So every zone's primary is asked, for every database in db_names, what Spock
# has there: whether the zone's own node exists, whether there are tables
# holding data, which subscriptions it has and from where, and whether one of
# them is a copy. Nothing here writes. The answers are pooled into one picture
# of the cluster, and the run goes on only if that picture is one it knows how
# to handle. A zone whose primary cannot be asked fails the run: assuming it
# empty would treat a running cluster as a new one, which is the very mistake
# this exists to prevent.

# The list is checked first, since that needs nothing from any database.

- name: Ensure every zone in pgedge_join_zones is in the inventory
  assert:
    that:
    - unknown | length == 0
    fail_msg: >-
      pgedge_join_zones names {{ unknown | join(', ') }}, which
      {{ 'is not a zone' if unknown | length == 1 else 'are not zones' }} of
      this inventory. Its zones are
      {{ zone_list | map('int') | sort | join(', ') }}. Add the new zone's
      hosts to the inventory, or correct the list.
    quiet: true
  vars:
    unknown: >-
      {{ pgedge_join_zones_given
         | reject('in', zone_list | map('string') | list) | list }}
  run_once: true
  when: pgedge_join_zones_given | length > 0

# pgedge_seed_zone is for a recovery, where one zone was restored and every
# other zone is empty and stopped, so copying the restored zone loses nothing.
# A join copies from a zone that keeps taking writes, which needs a different
# procedure. Asked for both, the run cannot do what was meant by either.

- name: Ensure pgedge_join_zones and pgedge_seed_zone are not both given
  fail:
    msg: >-
      pgedge_join_zones and pgedge_seed_zone cannot be given together.
      pgedge_seed_zone is for a recovery, which the recovery playbook sets on
      its own; pgedge_join_zones adds zones to a cluster that is running. Run
      again with only one of them.
  run_once: true
  when:
  - pgedge_join_zones_given | length > 0
  - pgedge_seed_zone | string > ''

# Cleared everywhere first, so the only answers pooled below are the ones this
# run's zone primaries gave just now, never one left from an earlier play.

- name: Clear any earlier record of this zone's Spock state
  set_fact:
    pgedge_zone_state: {}

# A database in db_names may not exist yet on a zone that has never been built.
# It is then simply absent there, and connecting to it would fail, so only the
# databases that exist are read.
#
# The names go in as one JSON array. postgresql_query turns a list argument
# into an array literal with every element still in quotes, which matches no
# database at all, and that would make every zone look empty.

- name: Find which databases in db_names exist in this zone
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: postgres
    login_unix_socket: /var/run/postgresql
    query: >-
      SELECT datname FROM pg_database
       WHERE datname IN (SELECT json_array_elements_text(%(dbs)s::json))
    named_args:
      dbs: "{{ db_names | to_json }}"
  register: pgedge_classify_dbs
  changed_when: false
  become: true
  become_user: postgres
  when: inventory_hostname == pgedge_zone_primary

# Whether Spock is installed, and whether the database holds tables of its own.
# The tables are counted as Spock's add-node procedure counts them, leaving out
# Postgres's own schemas, Spock's, and temporary ones, and also leaving out
# tables an extension created: those come with the extension on every zone and
# say nothing about whether anyone has stored data. Nothing here touches Spock's
# schema, which a database without the extension does not have.

- name: Read whether each database has Spock and tables holding data
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
    login_unix_socket: /var/run/postgresql
    query: >-
      SELECT (SELECT extversion FROM pg_extension
               WHERE extname = 'spock') AS spock_version,
             EXISTS (
               SELECT FROM pg_class c
                 JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE c.relkind IN ('r', 'p')
                  AND n.nspname NOT IN ('information_schema', 'pg_catalog',
                                        'pg_toast', 'spock')
                  AND left(n.nspname, 8) <> 'pg_temp_'
                  AND left(n.nspname, 14) <> 'pg_toast_temp_'
                  AND NOT EXISTS (
                        SELECT FROM pg_depend d
                         WHERE d.classid = 'pg_class'::regclass
                           AND d.objid = c.oid
                           AND d.deptype = 'e')
             ) AS has_user_tables
  loop: "{{ db_names | select('in', existing) | list }}"
  vars:
    existing: >-
      {{ (pgedge_classify_dbs.query_result | default([])
          if pgedge_classify_dbs.query_result | default([]) is not mapping
          else []) | map(attribute='datname') | list }}
  register: pgedge_classify_basic
  changed_when: false
  become: true
  become_user: postgres
  when: inventory_hostname == pgedge_zone_primary

# Then, where Spock is installed, what it holds: this zone's own node, every
# subscription with the node it comes from and whether it is enabled and
# replicating, and the subscription that copied this zone's schema and data, if
# one did, with how far that copy has got.
#
# spock.local_node names the node this database is; it has been in Spock's
# catalog unchanged since 5.0.0. spock.sub_show_status() is called once for each
# subscription row, never on its own, because it raises an error in a database
# that has no local node yet.

- name: Read each database's Spock node and subscriptions
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item.item }}"
    login_unix_socket: /var/run/postgresql
    query: >-
      SELECT
        (SELECT n.node_name::text
           FROM spock.local_node l
           JOIN spock.node n ON n.node_id = l.node_id) AS node,
        coalesce((
          SELECT json_agg(json_build_object(
                   'name', s.sub_name,
                   'provider', n.node_name,
                   'enabled', s.sub_enabled,
                   'status', st.status) ORDER BY s.sub_name)
            FROM spock.subscription s
            JOIN spock.node n ON n.node_id = s.sub_origin
            LEFT JOIN LATERAL spock.sub_show_status(s.sub_name) st ON true
        ), '[]'::json) AS subs,
        (SELECT json_build_object(
                  'name', s.sub_name,
                  'provider', n.node_name,
                  'sync_status', l.sync_status,
                  'tables_pending', (
                    SELECT count(*) FROM spock.local_sync_status t
                     WHERE t.sync_subid = s.sub_id
                       AND t.sync_relname IS NOT NULL
                       AND t.sync_status <> 'r'))
           FROM spock.local_sync_status l
           JOIN spock.subscription s ON s.sub_id = l.sync_subid
           JOIN spock.node n ON n.node_id = s.sub_origin
          WHERE l.sync_kind = 'f'
            AND l.sync_nspname IS NULL
            AND l.sync_relname IS NULL
          ORDER BY s.sub_name
          LIMIT 1) AS copy_sub
  loop: >-
    {{ pgedge_classify_basic.results | default([])
       | selectattr('query_result', 'defined')
       | rejectattr('query_result', 'mapping')
       | selectattr('query_result.0.spock_version') | list }}
  loop_control:
    label: "{{ item.item }}"
  register: pgedge_classify_spock
  changed_when: false
  become: true
  become_user: postgres
  when: inventory_hostname == pgedge_zone_primary

- name: Record this zone's Spock state
  set_fact:
    pgedge_zone_state: "{{ state_json | from_json }}"
  vars:
    state_json: >-
      {%- set dbs = {} -%}
      {%- for r in pgedge_classify_basic.results | default([])
            | selectattr('query_result', 'defined')
            | rejectattr('query_result', 'mapping') -%}
      {%-   set _ = dbs.update({r.item: {
                'spock_version': r.query_result[0].spock_version,
                'has_user_tables': r.query_result[0].has_user_tables | bool,
                'node': none, 'subs': [], 'copy_sub': none}}) -%}
      {%- endfor -%}
      {%- for r in pgedge_classify_spock.results | default([])
            | selectattr('query_result', 'defined')
            | rejectattr('query_result', 'mapping') -%}
      {%-   set _ = dbs[r.item.item].update(r.query_result[0]) -%}
      {%- endfor -%}
      {{ {'zone': zone | int, 'host': inventory_hostname, 'dbs': dbs}
         | to_json }}
  when: inventory_hostname == pgedge_zone_primary

# Now the whole cluster, from what each zone primary recorded. For each
# database:
#
# - It is established when some zone has its node there and tables holding
#   data. Only an established database needs a join. In any other one, every
#   zone takes the ordinary path, which is also how a first deployment that
#   stopped partway resumes: it has nodes and subscriptions but no data yet.
#
# - In an established database a zone is absent when it has no node. The zones
#   that have one are members when every ordered pair of them is linked by a
#   subscription. Enabled or not does not matter here: Spock disables a
#   subscription on its own after some apply errors, and an ordinary run must
#   not stop for that. A join checks that every subscription is enabled before
#   it starts. When they are not, and every missing link involves
#   the same zone, that zone is joining and the rest are members. Joins run one
#   at a time, so any other shape was made outside this collection, and the run
#   stops with the missing links listed rather than guess.
#
#   In a two-zone cluster both zones fit that description when one link is
#   missing. The joining one is then the zone whose copy subscription exists,
#   or failing that the one without data.
#
# The result is one fact every host reads, built once.

- name: Classify each zone in each database
  set_fact:
    pgedge_cluster: "{{ cluster_json | from_json }}"
  vars:
    zones: "{{ zone_list | map('int') | sort }}"
    cluster_json: >-
      {%- set zs = {} -%}
      {%- for z in zones -%}
      {%-   for h in ansible_play_hosts -%}
      {%-     set st = hostvars[h].pgedge_zone_state | default({}) -%}
      {%-     if st and st.zone | int == z and (z | string) not in zs -%}
      {%-       set _ = zs.update({z | string: st}) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endfor -%}
      {%- set out = {'zones': zs, 'dbs': {}, 'established': [],
                     'nodeless': [], 'incomplete': [], 'errors': [],
                     'missing': zones | reject('in', zs.keys() | map('int') | list) | list} -%}
      {%- for db in db_names -%}
      {%-   set node_zones = [] -%}
      {%-   set table_zones = [] -%}
      {%-   set copy_zones = [] -%}
      {%-   set providers = {} -%}
      {%-   for z in zones -%}
      {%-     set d = ((zs[z | string] | default({}))['dbs'] | default({}))[db] | default({}) -%}
      {%-     if d.node | default(none) -%}
      {%-       if d.node != 'edge' ~ z -%}
      {%-         set _ = out.errors.append('In ' ~ db ~ ', zone ' ~ z
                      ~ "'s node is named " ~ d.node ~ ', not edge' ~ z
                      ~ ', which this collection did not create.') -%}
      {%-       endif -%}
      {%-       set _ = node_zones.append(z) -%}
      {%-       set _ = providers.update({z | string: d.subs | default([]) | map(attribute='provider') | list}) -%}
      {%-       if d.has_user_tables | default(false) -%}{%- set _ = table_zones.append(z) -%}{%- endif -%}
      {%-       if d.copy_sub | default(none) -%}{%- set _ = copy_zones.append(z) -%}{%- endif -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%-   set info = {'established': table_zones | length > 0,
                        'node_zones': node_zones, 'members': [],
                        'joining': [], 'absent': [], 'outside': [],
                        'missing_links': []} -%}
      {%-   if not node_zones -%}{%- set _ = out.nodeless.append(db) -%}{%- endif -%}
      {%-   if info.established -%}
      {%-     set _ = out.established.append(db) -%}
      {%-     set missing = [] -%}
      {%-     for a in node_zones -%}{%- for b in node_zones -%}
      {%-       if a != b and ('edge' ~ b) not in providers[a | string] -%}
      {%-         set _ = missing.append([a, b]) -%}
      {%-       endif -%}
      {%-     endfor -%}{%- endfor -%}
      {%-     set cands = [] -%}
      {%-     for x in node_zones -%}
      {%-       if missing | reject('contains', x) | list | length == 0 -%}
      {%-         set _ = cands.append(x) -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-     set by_copy = cands | select('in', copy_zones) | list -%}
      {%-     set no_data = cands | reject('in', table_zones) | list -%}
      {#-       A copy's record stays after it finishes, so a zone that joined
                earlier counts in by_copy too. A join that stopped in step 9,
                with only a member that joined before it left to subscribe to
                it, is the zone the missing subscriptions come from. -#}
      {%-     set by_provider = [] -%}
      {%-     for x in by_copy
                if missing | map('last') | reject('eq', x) | list
                   | length == 0 -%}
      {%-       set _ = by_provider.append(x) -%}
      {%-     endfor -%}
      {%-     set joining = [] if not missing
                       else cands if cands | length == 1
                       else by_provider if by_provider | length == 1
                       else by_copy if by_copy | length == 1
                       else no_data if no_data | length == 1
                       else none -%}
      {%-     if joining is none -%}
      {%-       set links = [] -%}
      {%-       for p in missing -%}
      {%-         set _ = links.append('zone ' ~ p[0] ~ ' has none from zone ' ~ p[1]) -%}
      {%-       endfor -%}
      {%-       set _ = out.errors.append('In ' ~ db
                    ~ ', the zones with a Spock node ('
                    ~ node_zones | join(', ') ~ ') are not one cluster with'
                    ~ ' at most one zone joining it. Subscriptions'
                    ~ ' are missing: ' ~ links | join('; ') ~ '.') -%}
      {%-       set joining = [] -%}
      {%-     endif -%}
      {%-     set _ = info.update({'missing_links': missing, 'joining': joining,
                     'members': node_zones | reject('in', joining) | list,
                     'absent': zones | reject('in', node_zones) | list}) -%}
      {%-     set _ = info.update({'outside': (info.absent + joining) | sort}) -%}
      {%-     for z in info.outside -%}
      {%-       if z not in out.incomplete -%}{%- set _ = out.incomplete.append(z) -%}{%- endif -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%-   set _ = out.dbs.update({db: info}) -%}
      {%- endfor -%}
      {%- set _ = out.update({'incomplete': out.incomplete | sort}) -%}
      {{ out | to_json }}
  run_once: true

# Every zone has to have answered. One that did not -- its primary failed
# earlier in this run, or could not be reached -- may hold data, and the
# picture above would have counted it as empty.

- name: Ensure every zone's Spock state was read
  assert:
    that:
    - pgedge_cluster.missing | length == 0
    fail_msg: >-
      Spock's state could not be read in
      {{ 'zone' if pgedge_cluster.missing | length == 1 else 'zones' }}
      {{ pgedge_cluster.missing | join(', ') }}: none of this play's hosts
      answered for {{ 'it' if pgedge_cluster.missing | length == 1
      else 'them' }}. Without that, a zone that holds data could be taken for
      an empty one, so nothing has been created in Spock. Make sure every
      zone's primary is reachable and included in the run, and run this again.
    quiet: true
  run_once: true

- name: Ensure every established database has a shape this run understands
  assert:
    that:
    - pgedge_cluster.errors | length == 0
    fail_msg: >-
      {{ pgedge_cluster.errors | join(' ') }} Nothing has been created in
      Spock. Each
      zone of a cluster subscribes to every other one, and a zone added by
      pgedge_join_zones is the only one that may be partway there. Repair the
      subscriptions, or remove the zone that is out of step, and run this
      again.
    quiet: true
  run_once: true

# The gate. A recovery (pgedge_seed_zone) is exempt: there the restored zone is
# the only one with a node and data, so every other zone looks absent, and the
# seed copy is what fills them. That path goes on exactly as it always has.
#
# Otherwise, a zone that is absent from or partway into an established
# database stops the run unless pgedge_join_zones names it, and naming a zone
# when there is no running cluster to join stops it too.

- name: Ensure no zone is left out of a cluster that holds data
  fail:
    msg: >-
      {{ 'Zone' if one else 'Zones' }}
      {{ pgedge_cluster.incomplete | join(', ') }}
      {{ 'is' if one else 'are' }} not yet part of this cluster, which already
      holds data in {{ pgedge_cluster.established | join(', ') }}. An ordinary
      run would subscribe {{ 'it' if one else 'them' }} without copying that
      data, and the zones would disagree from then on, so nothing has been
      created in Spock. To join {{ 'it' if one else 'them' }}, run this again
      with -e pgedge_join_zones={{ pgedge_cluster.incomplete | join(',') }}.
  vars:
    one: "{{ pgedge_cluster.incomplete | length == 1 }}"
  run_once: true
  when:
  - pgedge_seed_zone | string == ''
  - pgedge_join_zones_given | length == 0
  - pgedge_cluster.incomplete | length > 0

- name: Ensure there is a running cluster to join
  fail:
    msg: >-
      pgedge_join_zones names {{ pgedge_join_zones_given | join(', ') }}, but
      no database in db_names holds data on any zone with a Spock node, so
      there is no running cluster to join. A new cluster is built by an
      ordinary run: run this again without pgedge_join_zones.
  run_once: true
  when:
  - pgedge_join_zones_given | length > 0
  - pgedge_cluster.established | length == 0

# One major change per run. A database new to db_names has no node anywhere
# yet, so it would be created by the ordinary path in the same run as a join,
# and the two have each been tested only alone.

- name: Ensure no database is added to db_names in the same run as a join
  fail:
    msg: >-
      {{ pgedge_cluster.nodeless | join(', ') }}
      {{ 'is' if pgedge_cluster.nodeless | length == 1 else 'are' }} in
      db_names but not yet in Spock on any zone. Adding a database and joining
      a zone are separate changes, made in separate runs. Run this first
      without pgedge_join_zones to add the database to the existing zones, then
      again with it; or leave the database out of db_names until the join is
      done.
  run_once: true
  when:
  - pgedge_join_zones_given | length > 0
  - pgedge_cluster.nodeless | length > 0

- name: Ensure every zone that has to join is named in pgedge_join_zones
  fail:
    msg: >-
      {{ 'Zone' if one else 'Zones' }} {{ unlisted | join(', ') }}
      {{ 'is' if one else 'are' }} not yet part of this cluster, which already
      holds data in {{ pgedge_cluster.established | join(', ') }}, but
      pgedge_join_zones names only {{ pgedge_join_zones_given | join(', ') }}.
      Every zone outside a cluster that holds data has to join it, so nothing
      has been created in Spock. Add {{ 'it' if one else 'them' }} to
      pgedge_join_zones, or take {{ 'it' if one else 'them' }} out of the
      inventory, and run this again.
  vars:
    unlisted: >-
      {{ pgedge_cluster.incomplete | map('string')
         | reject('in', pgedge_join_zones_given) | list }}
    one: "{{ unlisted | length == 1 }}"
  run_once: true
  when:
  - pgedge_join_zones_given | length > 0
  - unlisted | length > 0

- name: Report zones in pgedge_join_zones that are already members
  debug:
    msg: >-
      {{ 'Zone' if already | length == 1 else 'Zones' }}
      {{ already | join(', ') }} in pgedge_join_zones
      {{ 'is' if already | length == 1 else 'are' }} already a member of every
      database that holds data, and {{ 'is' if already | length == 1
      else 'are' }} skipped.
  vars:
    already: >-
      {{ pgedge_join_zones_given | map('int')
         | reject('in', pgedge_cluster.incomplete) | list }}
  run_once: true
  when:
  - pgedge_join_zones_given | length > 0
  - already | length > 0
