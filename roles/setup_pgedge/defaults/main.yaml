---

# The zone that already holds the cluster's data, when the other zones are
# empty and have to copy it before they replicate with anything. Empty in an
# ordinary deployment, where every zone starts empty and nothing is copied. The
# recovery playbook sets it to the zone it restored. HA clusters only.

pgedge_seed_zone: ""

# How long to wait for the copy from the seed zone. Not an estimate: the copy
# takes as long as the database is large. The wait gives up when nothing has
# moved for pgedge_seed_stall_minutes, or sooner if Spock reports the copy has
# failed; pgedge_seed_max_hours is a backstop against a wait that never returns.

pgedge_seed_stall_minutes: 15
pgedge_seed_max_hours: 24
