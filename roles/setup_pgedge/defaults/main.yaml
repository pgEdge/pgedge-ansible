---

# The zone that already holds the cluster's data, when the other zones are
# empty and have to copy it before they replicate with anything. Empty in an
# ordinary deployment, where every zone starts empty and nothing is copied. The
# recovery playbook sets it to the zone it restored. HA clusters only.
#
# This is for recovery, where no other zone holds data or takes writes while it
# copies. Adding a zone to a cluster that is running is pgedge_join_zones'
# job, and the role refuses the two together.

pgedge_seed_zone: ""

# How long to wait for the copy from the seed zone. Not an estimate: the copy
# takes as long as the database is large. The wait gives up when nothing has
# moved for pgedge_seed_stall_minutes, or sooner if Spock reports the copy has
# failed; pgedge_seed_max_hours is a backstop against a wait that never returns.

pgedge_seed_stall_minutes: 15
pgedge_seed_max_hours: 24

# The zones to join to a cluster that already holds data, as a list of zone
# numbers. Empty in an ordinary deployment. Pass it on the command line rather
# than keeping it in an inventory, as with wipe_confirm: it says what this run
# is for, not what the cluster is.
#
# A zone added to the inventory of a running cluster does not join it on its
# own. Without this list the run refuses to touch such a zone, naming it and
# this setting, because the plain subscriptions an ordinary deployment creates
# would leave the new zone without the data the others already hold. The list
# is also what keeps a typo in the inventory from starting a join nobody asked
# for: a zone joins only when it is both missing from the cluster and named
# here.

pgedge_join_zones: []

# How long a join waits, in minutes, for each zone to reach a bookmark another
# zone has set, the way it confirms that every write has arrived before moving
# on. The bulk copy is governed by pgedge_seed_stall_minutes and
# pgedge_seed_max_hours instead.

pgedge_join_wait_minutes: 30
