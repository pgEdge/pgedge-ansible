---

# Every zone the cluster has, which is by definition the zones its pgEdge nodes
# are in. Derived from the pgedge group rather than from every host in the
# inventory: a host that belongs to no deployment group — a client, a bastion,
# a monitoring box — carries no zone, and counting it invents an empty zone
# that no node can satisfy. The subscription loop below then looks for the
# first pgEdge node in that zone and fails on an empty sequence.

zone_list: >
    {{ groups['pgedge'] | map('extract', hostvars) |
       map(attribute='zone', default='') | unique }}

# This variable serves several purposes:
# - Sets the proxy to any user-specified target.
# - Otherwise uses the first known haproxy member in this zone.
# - Otherwise ensures a subscription target even when there are no proxies.

subscribe_target: >-
  {{ proxy_node if proxy_node > '' 
     else proxies_in_zone | first if proxies_in_zone
     else first_node_in_zone }}

# Where this zone connects to reach the seed zone, chosen the same way as every
# other subscription target in this role: the seed zone's proxy_node, then its
# first HAProxy, then its first pgEdge node.

seed_first_node: >-
  {{ groups['pgedge'] | map('extract', hostvars) |
     selectattr('zone', 'eq', pgedge_seed_zone | int) |
     map(attribute='inventory_hostname') | list | first | default('') }}

seed_proxies: >-
  {{ groups['haproxy'] | default([]) | map('extract', hostvars) |
     selectattr('zone', 'eq', pgedge_seed_zone | int) |
     map(attribute='inventory_hostname') | list }}

seed_conn_target: >-
  {{ hostvars[seed_first_node].proxy_node | default('')
       if seed_first_node and hostvars[seed_first_node].proxy_node | default('')
     else seed_proxies | first if seed_proxies
     else seed_first_node }}
