---

# Bring the extensions the collection created up to the version their updated
# packages ship, in every database, on every zone's primary. A replica takes
# the change through physical replication.
#
# This waits until every pgEdge node is updated, so no zone is asked to run
# an extension's new SQL while one of its nodes still has the old library.
# Each zone updates its own extensions, so DDL replication is turned off for
# the session: a zone that received the statement from another would try to
# apply what it does itself.
#
# Most minor releases ship no new SQL, and then there is nothing to do.

- name: Find the extensions whose installed version is older than their package's
  community.postgresql.postgresql_query:
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
    login_unix_socket: /var/run/postgresql
    query: >-
      SELECT x.extname
        FROM pg_extension x
        JOIN pg_available_extensions a ON a.name = x.extname
       WHERE x.extname IN ('spock', 'snowflake')
         AND a.default_version <> x.extversion
       ORDER BY x.extname
  loop: "{{ db_names }}"
  register: update_software_extensions
  changed_when: false
  become: true
  become_user: postgres
  when: inventory_hostname == zone_primary

- name: Update the extensions to the version their packages ship
  command:
    argv:
    - psql
    - -X
    - --no-psqlrc
    - -v
    - ON_ERROR_STOP=1
    - -p
    - "{{ pg_port }}"
    - -d
    - "{{ item.db }}"
    - -c
    - SET spock.enable_ddl_replication = off
    - -c
    - ALTER EXTENSION {{ item.ext }} UPDATE
  # postgresql_query reports no rows as an empty mapping, not an empty list.
  loop: >-
    {%- set out = [] -%}
    {%- for r in update_software_extensions.results | default([])
          if r.query_result | default([]) is sequence
             and r.query_result | default([]) is not mapping -%}
    {%-   for row in r.query_result -%}
    {%-     set _ = out.append({'db': r.item, 'ext': row.extname}) -%}
    {%-   endfor -%}
    {%- endfor -%}
    {{ out }}
  loop_control:
    label: "{{ item.db }}: {{ item.ext }}"
  become: true
  become_user: postgres
  when: inventory_hostname == zone_primary
