global
    maxconn 1100

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen pg-cluster
    bind *:5432
    mode tcp
    option httpchk
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    server 192_168_6_10 192.168.6.10:5432 check port 8008
    server 192_168_6_11 192.168.6.11:5432 check port 8008
    server 192_168_6_12 192.168.6.12:5432 check port 8008


listen pg-cluster-replica
    bind *:5433
    mode tcp
    option httpchk /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    server 192_168_6_10 192.168.6.10:5432 check port 8008
    server 192_168_6_11 192.168.6.11:5432 check port 8008
    server 192_168_6_12 192.168.6.12:5432 check port 8008


listen pg-pooler
    bind *:6432 maxconn 1000
    mode tcp
    option httpchk
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    server 192_168_6_10 192.168.6.10:6432 check port 8008
    server 192_168_6_11 192.168.6.11:6432 check port 8008
    server 192_168_6_12 192.168.6.12:6432 check port 8008
