---
# Clear one zone from one database on every other zone, the way setup_pgedge
# does from the rescue of a join that cannot be resumed: include_role with
# remove_zone's remaining_zones entry point, from a single host in a run_once
# block, with the zone and the database as its only parameters.
#
#   ansible-playbook remove-zone-remaining.yml -i <inventory> \
#     -e clear_zone=3 -e clear_db=demo
#
# The inputs have names of their own, so that they reach the role only as the
# include passes them, which is how setup_pgedge passes its joining zone.
#
# The zone being removed is left out of the play, as a joining zone's hosts
# have nothing to do with this half. Every other zone's primary has to be
# known first, which on Ultra-HA means role_config's zone_primary tasks.

# Group the other zones' hosts without connecting to anything, since the zone
# being removed may be down.

- hosts: pgedge
  gather_facts: false

  tasks:
  - name: Group the hosts of the zones that stay
    group_by:
      key: "{{ 'remove_zone_others' if zone | int != clear_zone | int
               else 'remove_zone_target' }}"
    changed_when: false

- hosts: remove_zone_others
  any_errors_fatal: true

  collections:
  - pgedge.platform

  roles:
  - role_config

  tasks:
  - name: Find the node that runs each zone's primary
    include_role:
      name: role_config
      tasks_from: zone_primary
    when: is_ha_cluster | bool

  - name: Clear the zone from the other zones in one database
    include_role:
      name: remove_zone
      tasks_from: remaining_zones
    vars:
      remove_zone: "{{ clear_zone }}"
      remove_zone_db: "{{ clear_db }}"
    run_once: true
