---

- hosts: all
  any_errors_fatal: true

  collections:
  - pgedge.platform

  tasks:
  - include_role:
      name: init_server

- hosts: pgedge
  any_errors_fatal: true

  collections:
  - pgedge.platform

  tasks:
  - include_role:
      name: install_repos

  - include_tasks: switch-repo.yml

  - include_role:
      name: install_pgedge

  - include_role:
      name: setup_postgres

  - include_role:
      name: install_etcd
    when: patroni_dcs.type | default('etcd3') in ('etcd', 'etcd3')

  - include_role:
      name: install_patroni

  - include_role:
      name: install_backrest

  - include_role:
      name: install_pgbouncer
    when: pgbouncer_enabled | default(false) | bool

  - include_role:
      name: setup_etcd
    when: patroni_dcs.type | default('etcd3') in ('etcd', 'etcd3')

  - include_role:
      name: setup_patroni

  - include_role:
      name: setup_pgbouncer
    when: pgbouncer_enabled | default(false) | bool

  - include_role:
      name: setup_backrest

- hosts: haproxy

  collections:
  - pgedge.platform

  tasks:
  - include_role:
      name: setup_haproxy

- hosts: pgedge

  collections:
  - pgedge.platform

  tasks:
  - include_role:
      name: setup_pgedge

- hosts: backup

  collections:
  - pgedge.platform

  tasks:
  - include_role:
      name: install_repos

  - include_tasks: switch-repo.yml

  - include_role:
      name: install_backrest

  - include_role:
      name: setup_backrest
