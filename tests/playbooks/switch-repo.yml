---

# Only for pgEdge's own servers. A repo_url of the site's own takes its tier
# from repo_name, as an inventory would set it, and rewriting the definition
# install_repos wrote would be undone by its next run.

- name: Switch pgEdge repo from release to {{ repo_environment }}
  when:
  - repo_environment is defined and repo_environment != 'release'
  - repo_url | default('') | length == 0
  block:
  - name: Switch pgEdge yum repo
    command: sed -i 's/release/{{ repo_environment }}/' /etc/yum.repos.d/pgedge.repo
    when: ansible_facts['os_family'] == 'RedHat'
    become: true

  - name: Update DNF cache after repo switch
    dnf:
      update_cache: true
    when: ansible_facts['os_family'] == 'RedHat'
    become: true

  - name: Switch pgEdge apt repo
    command: sed -i 's/release/{{ repo_environment }}/' /etc/apt/sources.list.d/pgedge.sources
    when: ansible_facts['os_family'] == 'Debian'
    become: true

  - name: Update APT cache after repo switch
    apt:
      update_cache: true
    when: ansible_facts['os_family'] == 'Debian'
    become: true
