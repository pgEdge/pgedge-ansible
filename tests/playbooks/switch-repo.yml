---

# Only for pgEdge's own servers. A repo_url of the site's own takes its tier
# from repo_name, as an inventory would set it, and rewriting the definition
# install_repos wrote would be undone by its next run.

- name: Switch pgEdge repo from release to {{ repo_environment }}
  when:
  - repo_environment is defined and repo_environment != 'release'
  - repo_url | default('') | length == 0
  block:
  # replace rather than sed: the e2e tests run the deployment a second time and
  # fail on any change, and replace reports one only when it edits the file.
  # The pattern is the tier's segment of the repository path. replace swaps
  # every one in a single run, so a second run finds none, and names that only
  # contain the word, such as a pgedge-release key, are left alone.
  - name: Switch pgEdge yum repo
    replace:
      path: /etc/yum.repos.d/pgedge.repo
      regexp: '/release/'
      replace: '/{{ repo_environment }}/'
    when: ansible_facts['os_family'] == 'RedHat'
    become: true

  - name: Update DNF cache after repo switch
    dnf:
      update_cache: true
    when: ansible_facts['os_family'] == 'RedHat'
    become: true

  - name: Switch pgEdge apt repo
    replace:
      path: /etc/apt/sources.list.d/pgedge.sources
      regexp: '/release/'
      replace: '/{{ repo_environment }}/'
    when: ansible_facts['os_family'] == 'Debian'
    become: true

  - name: Update APT cache after repo switch
    apt:
      update_cache: true
    when: ansible_facts['os_family'] == 'Debian'
    become: true
