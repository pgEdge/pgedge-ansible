---

# Lakekeeper first. setup_coldfront waits on the catalog's /health and
# gives up after 30s, so the catalog has to be serving before the
# pgEdge nodes are configured.

- hosts: lakekeeper
  any_errors_fatal: true

  collections:
  - pgedge.platform

  tasks:
  - include_role:
      name: install_repos

  - include_tasks: switch-repo.yml

  - include_role:
      name: install_lakekeeper

  # The compose stack creates the bucket from a side container, so it
  # can still be arriving once this host is reachable. setup_lakekeeper
  # writes to the bucket to prove the warehouse credentials work, and a
  # bucket that does not exist yet fails that write rather than waiting
  # for it. Inert outside the test network, where seaweedfs_filer is
  # unset.

  - name: Wait for the object store bucket to exist
    uri:
      url: "{{ seaweedfs_filer }}/buckets/{{ coldfront_s3_bucket }}/"
      status_code: 200
    register: bucket
    retries: 30
    delay: 2
    until: bucket is success
    when: seaweedfs_filer is defined

  - include_role:
      name: setup_lakekeeper

- hosts: pgedge
  any_errors_fatal: true

  collections:
  - pgedge.platform

  tasks:
  - include_role:
      name: init_server

  - include_role:
      name: install_repos

  - include_tasks: switch-repo.yml

  - include_role:
      name: install_pgedge

  - include_role:
      name: setup_postgres

  - include_role:
      name: setup_pgedge

  - include_role:
      name: install_coldfront

  - include_role:
      name: setup_coldfront
