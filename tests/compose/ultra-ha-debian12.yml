networks:
  pgedge-test:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.6.0/24

x-common: &common
  build:
    context: ../docker
    dockerfile: Dockerfile.debian12
  privileged: true
  cgroup: host
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
  networks:
    pgedge-test: {}

services:
  pgedge1:
    <<: *common
    hostname: pgedge1
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.10

  pgedge2:
    <<: *common
    hostname: pgedge2
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.11

  pgedge3:
    <<: *common
    hostname: pgedge3
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.12

  pgedge4:
    <<: *common
    hostname: pgedge4
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.13

  pgedge5:
    <<: *common
    hostname: pgedge5
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.14

  pgedge6:
    <<: *common
    hostname: pgedge6
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.15

  haproxy1:
    <<: *common
    hostname: haproxy1
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.16

  haproxy2:
    <<: *common
    hostname: haproxy2
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.17

  backup1:
    <<: *common
    hostname: backup1
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.18

  backup2:
    <<: *common
    hostname: backup2
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.19

  # Two nodes for zone 1 that the deployment leaves out. They are added to the
  # zone afterwards, with tests/inventories/ultra-ha-node-add.yml layered on,
  # to check that nodes join a running zone: pgedge7 as a learner an earlier
  # run left unpromoted, pgedge8 fresh. Their addresses are clear of the
  # overlays', which take .20 and .21.
  pgedge7:
    <<: *common
    hostname: pgedge7
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.22

  pgedge8:
    <<: *common
    hostname: pgedge8
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.23

  # A third zone the deployment leaves out: two nodes and their proxy. It joins
  # the running cluster afterwards, with tests/inventories/ultra-ha-zone-join.yml
  # layered on, to check that a zone added to a cluster holding data copies it
  # and misses no write made while it joins. Started with the rest so that
  # adding it to the inventory is all a join test has to do. Its addresses
  # follow the added nodes' above.
  pgedge9:
    <<: *common
    hostname: pgedge9
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.24

  pgedge10:
    <<: *common
    hostname: pgedge10
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.25

  haproxy3:
    <<: *common
    hostname: haproxy3
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.26

  # A host in no deployment group, named by no pg_hba rule: the only vantage
  # point from which the access gates are observable. Its address is well clear
  # of the node range, and of 192.168.6.20 where the Consul overlay sits.
  client:
    <<: *common
    hostname: client
    networks:
      pgedge-test:
        ipv4_address: 192.168.6.30
