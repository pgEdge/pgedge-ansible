all:
  vars:
    ansible_user: ansible
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    debug_pgedge: false
    disable_selinux: false
    manage_host_file: false

pgedge:
  vars:
    db_password: TestPass123
    pgedge_password: TestPass456
    replication_password: TestPass789
    backup_password: TestBackup321
  hosts:
    192.168.6.10:
      zone: 1
    192.168.6.11:
      zone: 2
    192.168.6.12:
      zone: 3

# Pooling is opt-in by group. .12 is deliberately left out so the tests cover
# an unpooled node in a cluster that has pooled ones.
pgbouncer:
  hosts:
    192.168.6.10:
    192.168.6.11:

# A client with no deployment role at all: not in pgedge, haproxy or backup, and
# named by no pg_hba rule. Phase 4's whole point — the access gates cannot be
# observed from a node that every rule already names.
clients:
  hosts:
    192.168.6.30:
