all:
  vars:
    ansible_user: ansible
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    debug_pgedge: false
    disable_selinux: false
    manage_host_file: false
    # The pooler enforces its own HBA rules, which name the cluster's nodes,
    # this zone's proxies and the node's loopback -- and nothing else. The client
    # node is none of those, so the pooled endpoint has to be opened to it here.
    # Naming it in custom_hba_rules instead would open Postgres's own port to it
    # as well and cost the suite its clearest negative test. It is admitted for
    # the two application roles only: pgedge is deliberately left out, so the
    # verify playbooks can prove a valid credential is still refused when no
    # rule names it.
    pgbouncer_hba_rules:
    - databases: demo,postgres
      users: admin,pooltest
      source: 192.168.6.30/32

pgedge:
  vars:
    db_password: TestPass123
    pgedge_password: TestPass456
    replication_password: TestPass789
    backup_password: TestBackup321
    pgbouncer_auth_password: TestPool654
    pgbouncer_enabled: true
  hosts:
    192.168.6.10:
      zone: 1
    192.168.6.11:
      zone: 2
    192.168.6.12:
      zone: 3

# A client with no deployment role at all: not in pgedge, haproxy or backup, and
# named by no pg_hba rule. Phase 4's whole point — the access gates cannot be
# observed from a node that every rule already names.
clients:
  hosts:
    192.168.6.30:
