all:
  vars:
    ansible_user: ansible
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    debug_pgedge: false
    disable_selinux: false
    manage_host_file: false
    # Set on 'all' rather than on 'pgedge', because the backup servers render
    # the same repository configuration and have to arrive at the same value.
    # A repository whose nodes and server disagree about the cipher is one
    # neither can read.
    backup_repo_cipher: TestCipher987
    # No scheduled backups. set_cron installs nothing for a schedule that is not
    # five fields, and the default of 00:10 is one a CI run can cross: the
    # verify playbook would find a second backup where it asserts exactly one,
    # and a backup taken after the recovery test seeds its marker rows would
    # restore them itself, so the test would no longer prove WAL replay. Set on
    # 'all' because both the nodes and the backup servers install the jobs.
    full_backup_schedule: ""
    diff_backup_schedule: ""
    # The pooler enforces its own HBA rules, which name the cluster's nodes,
    # this zone's proxies and the node's loopback -- and nothing else. The client
    # node is none of those, so the pooled endpoint has to be opened to it here.
    # Naming it in custom_hba_rules instead would open Postgres's own port to it
    # as well and cost the suite its clearest negative test. It is admitted for
    # the two application roles only: pgedge is deliberately left out, so the
    # verify playbooks can prove a valid credential is still refused when no
    # rule names it.
    pgbouncer_hba_rules:
    - databases: demo,postgres
      users: admin,pooltest
      source: 192.168.6.30/32

pgedge:
  vars:
    db_password: TestPass123
    pgedge_password: TestPass456
    replication_password: TestPass789
    backup_password: TestBackup321
    pgbouncer_auth_password: TestPool654
    pgbouncer_enabled: true
    is_ha_cluster: true
  hosts:
    192.168.6.10:
      zone: 1
    192.168.6.11:
      zone: 1
    192.168.6.12:
      zone: 1
    192.168.6.13:
      zone: 2
    192.168.6.14:
      zone: 2
    192.168.6.15:
      zone: 2

haproxy:
  hosts:
    192.168.6.16:
      zone: 1
    192.168.6.17:
      zone: 2

# The repository is chosen by what is layered on top of this file: the
# ultra-ha-ssh.yml inventory adds the 'backup' group for an SSH repository, and
# tests/vars/backup-s3.yml points the cluster at an object store instead. The
# 'backup' group cannot live here, because init_server refuses a backup server
# in a zone whose repository is S3.

# A client with no deployment role at all: not in pgedge, haproxy or backup, and
# named by no pg_hba rule. Phase 4's whole point — the access gates cannot be
# observed from a node that every rule already names.
clients:
  hosts:
    192.168.6.30:
