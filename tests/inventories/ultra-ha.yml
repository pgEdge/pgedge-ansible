all:
  vars:
    ansible_user: ansible
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    debug_pgedge: false
    disable_selinux: false
    manage_host_file: false

pgedge:
  vars:
    db_password: TestPass123
    pgedge_password: TestPass456
    replication_password: TestPass789
    backup_password: TestBackup321
    pgbouncer_auth_password: TestPool654
    is_ha_cluster: true
  hosts:
    192.168.6.10:
      zone: 1
    192.168.6.11:
      zone: 1
    192.168.6.12:
      zone: 1
    192.168.6.13:
      zone: 2
    192.168.6.14:
      zone: 2
    192.168.6.15:
      zone: 2

haproxy:
  hosts:
    192.168.6.16:
      zone: 1
    192.168.6.17:
      zone: 2

backup:
  hosts:
    192.168.6.18:
      zone: 1
    192.168.6.19:
      zone: 2

# Every pgEdge node pools here: the pooled HAProxy listener follows the Patroni
# leader, and any node can hold that role.
pgbouncer:
  hosts:
    192.168.6.10:
    192.168.6.11:
    192.168.6.12:
    192.168.6.13:
    192.168.6.14:
    192.168.6.15:

# A client with no deployment role at all: not in pgedge, haproxy or backup, and
# named by no pg_hba rule. Phase 4's whole point — the access gates cannot be
# observed from a node that every rule already names.
clients:
  hosts:
    192.168.6.30:
