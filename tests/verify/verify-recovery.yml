---
# Verify a cluster that was rebuilt from its backup repository.
#
# The question this answers is the one no structural check can: did the data
# come back? An empty cluster satisfies every other assertion in the suite --
# Patroni has a leader, Spock has a mesh, the repository has a stanza -- so the
# marker rows seeded before the recovery are what separates a restore from a
# rebuild. They exist only in archived WAL, never in a backup.

- hosts: pgedge
  become: true

  vars:
    pg_port: 5432
    marker_rows: 25
    # Passed through from the recovery's own arguments by run-recovery-test.sh.
    recovery_target_type: ""
    zone_count: >-
      {{ groups['pgedge'] | map('extract', hostvars) |
      map(attribute='zone') | unique | list | length }}
    nodes_in_zone: >-
      {{ groups['pgedge'] | map('extract', hostvars) |
      selectattr('zone', 'eq', zone) |
      map(attribute='inventory_hostname') | list }}
    first_node_in_zone: "{{ nodes_in_zone | first }}"
    patroni_svc: >-
      {{ 'patroni@17-demo' if ansible_os_family == 'Debian' else 'patroni' }}

  tasks:
  - name: Check Patroni is running on every node
    command: systemctl is-active {{ patroni_svc }}
    changed_when: false

  - name: Determine whether this node is its zone's primary
    become_user: postgres
    command: >
      psql -d postgres -t -A -c "SELECT NOT pg_is_in_recovery()"
    register: node_is_primary
    changed_when: false

  # The assertion the whole exercise exists for. On the restored zone these rows
  # came back through WAL replay; on every other zone they arrived across Spock,
  # because those zones were rebuilt empty on purpose. Both paths have to work
  # or the recovery only looked successful.

  - name: Count the marker rows this zone came back with
    become_user: postgres
    command: >
      psql -d demo -t -A -c "SELECT count(*) FROM recovery_marker"
    register: marker
    changed_when: false
    retries: 60
    delay: 5
    until: marker.stdout | trim | int == marker_rows | int
    when: node_is_primary.stdout | trim == 't'

  - name: Assert the recovery returned the data rather than an empty cluster
    assert:
      that: marker.stdout | trim | int == marker_rows | int
      fail_msg: >-
        Zone {{ zone }} has {{ marker.stdout | trim }} marker rows, expected
        {{ marker_rows }}. These rows were written after the last backup and
        exist only in archived WAL, so a restored zone gets them by replaying
        the archive and a rebuilt zone gets them across Spock. Zero rows with
        the table present means the zone was rebuilt but never refilled; no
        table at all means the restore produced an empty cluster.
      success_msg: >-
        Zone {{ zone }} came back with all {{ marker_rows }} marker rows.
    when: node_is_primary.stdout | trim == 't'

  # The restored zone kept its own Spock node and had every other zone's entry
  # stripped before the mesh was rebuilt; the rebuilt zones created theirs from
  # nothing. Either way each zone should end with one node entry per zone and a
  # subscription to every zone but itself. A count that is short means a
  # subscription was never recreated; one that is over means stale metadata from
  # before the recovery survived, which is the failure that silently diverges.

  - name: Read this zone's Spock catalog
    become_user: postgres
    command: >
      psql -d demo -t -A -F'|' -c
      "SELECT (SELECT count(*) FROM spock.node),
              (SELECT count(*) FROM spock.subscription),
              (SELECT count(*) FROM pg_replication_origin
                WHERE left(roname, 3) <> 'pg_')"
    register: spock_state
    changed_when: false
    when: node_is_primary.stdout | trim == 't'

  - name: Assert the replication mesh was rebuilt exactly
    vars:
      counts: "{{ spock_state.stdout | trim | split('|') }}"
    assert:
      that:
      - counts[0] | int == zone_count | int
      - counts[1] | int == (zone_count | int) - 1
      - counts[2] | int == (zone_count | int) - 1
      fail_msg: >-
        Zone {{ zone }} has {{ counts[0] }} Spock node entries,
        {{ counts[1] }} subscriptions and {{ counts[2] }} replication origins.
        Expected {{ zone_count }}, {{ (zone_count | int) - 1 }} and
        {{ (zone_count | int) - 1 }}. Too many means metadata from before the
        recovery survived, and a subscription that resumes against a stale
        origin acknowledges changes it never applied.
    when: node_is_primary.stdout | trim == 't'

  # A rebuilt zone carries a system identifier its stanza never saw, so the
  # recovery ran stanza-upgrade on it. If that did not take, archiving is
  # refused and the zone finishes the recovery unable to back itself up.

  - name: Read the archiver's history
    become_user: postgres
    command: >
      psql -d postgres -t -A -F'|' -c
      "SELECT archived_count,
              CASE
                WHEN last_archived_time IS NULL THEN 'never archived'
                WHEN last_failed_time IS NULL THEN 'healthy'
                WHEN last_archived_time > last_failed_time THEN 'healthy'
                ELSE 'failing'
              END
         FROM pg_stat_archiver"
    register: archiver
    changed_when: false
    retries: 12
    delay: 5
    until: (archiver.stdout | trim | split('|'))[1] == 'healthy'
    when: node_is_primary.stdout | trim == 't'

  - name: Assert the zone can archive again after the recovery
    vars:
      fields: "{{ archiver.stdout | trim | split('|') }}"
    assert:
      that: fields[1] == 'healthy'
      fail_msg: >-
        WAL archiving on zone {{ zone }} is {{ fields[1] }} after the recovery.
        A zone rebuilt from an empty data directory carries a system identifier
        its stanza has never seen, and PgBackRest refuses to archive until
        stanza-upgrade records it. Check that the recovery's upgrade_stanza step
        ran for this zone.
    when: node_is_primary.stdout | trim == 't'

  # Archiving again is not the same as having a recovery point. A rebuilt
  # zone's stanza still lists every backup of the cluster it replaced, so the
  # recovery takes a full backup there, and that is what a second incident in
  # this zone would restore. The newest backup has to belong to the stanza's
  # newest db entry, the one stanza-upgrade recorded for the cluster running
  # now; the restored zone passes because its cluster never changed.
  #
  # After a point-in-time recovery the restored zone has to have taken one as
  # well, because its earlier backups past the target are on the timeline the
  # recovery abandoned. So under a target, the newest backup in every zone must
  # also be on the timeline that zone is running on.

  # Named, because the repository may hold more than this zone's stanza: every
  # zone shares an S3 bucket, and an unnamed info lists all of them, in an order
  # that has nothing to do with which zone is asking.

  - name: Ask the repository what it holds for this zone
    become_user: postgres
    command: pgbackrest --output=json --stanza=pgedge-demo-{{ zone }} info
    register: repo_info
    changed_when: false
    when: node_is_primary.stdout | trim == 't'

  - name: Read the timeline this zone is running on
    become_user: postgres
    command: >
      psql -d postgres -t -A -c
      "SELECT timeline_id FROM pg_control_checkpoint()"
    register: timeline
    changed_when: false
    when: node_is_primary.stdout | trim == 't'

  - name: Assert the zone has a backup of the cluster it holds now
    vars:
      stanza: "{{ repo_info.stdout | from_json | first }}"
      current_db: >-
        {{ (stanza.db | default([]) | map(attribute='id') | list + [0]) | max }}
      newest: "{{ stanza.backup | default([]) | last | default({}, true) }}"
      newest_tli: "{{ (newest.archive.start | default('0' * 24))[:8] }}"
    assert:
      that:
      - newest.database.id | default(-1) | int == current_db | int
      - recovery_target_type == '' or
        newest_tli | int(base=16) == timeline.stdout | trim | int
      fail_msg: >-
        Zone {{ zone }}'s newest backup, {{ newest.label | default('none') }},
        is from db entry {{ newest.database.id | default('none') }} on timeline
        {{ newest_tli | int(base=16) }}, but stanza {{ stanza.name }} now
        describes db entry {{ current_db }} and the zone runs on timeline
        {{ timeline.stdout | trim }}. A backup from an older db entry is of the
        cluster a recovery replaced; one from an older timeline after a
        point-in-time recovery is on the timeline the recovery abandoned.
        Either way the recovery's backup_zones step did not leave this zone a
        recovery point.
      success_msg: >-
        Zone {{ zone }}'s newest backup, {{ newest.label }}, is of the cluster
        running there now.
    when: node_is_primary.stdout | trim == 't'

# Every replica should have rebuilt from its own zone's leader.

- hosts: pgedge
  become: true

  vars:
    nodes_in_zone: >-
      {{ groups['pgedge'] | map('extract', hostvars) |
      selectattr('zone', 'eq', zone) |
      map(attribute='inventory_hostname') | list }}
    first_node_in_zone: "{{ nodes_in_zone | first }}"
    patroni_cfg: >-
      {{ '/etc/patroni/17-demo.yml' if ansible_os_family == 'Debian'
         else '/etc/patroni/patroni.yml' }}

  tasks:
  # Waited for, not sampled. A replica rebuilds by cloning its zone's leader,
  # and in a recovery that leader holds the whole rehydrated dataset rather than
  # the nearly-empty one a fresh deployment starts from, so the clone takes real
  # time. A single reading taken the moment the playbook finishes catches the
  # zone mid-build and calls it broken.

  - name: Wait for every node in the zone to come back
    become_user: postgres
    command: >
      patronictl -c {{ patroni_cfg }} list 17-demo -f json
    register: patroni_list
    changed_when: false
    failed_when: false
    retries: 120
    delay: 10
    until: >-
      patroni_list.rc == 0 and
      (patroni_list.stdout | default('[]', true) | from_json |
       selectattr('State', 'in', ['running', 'streaming']) | list | length)
      == (nodes_in_zone | length)
    when: inventory_hostname == first_node_in_zone

  - name: Assert every node in the zone came back
    vars:
      members: "{{ patroni_list.stdout | from_json }}"
      running: >-
        {{ members | selectattr('State', 'in', ['running', 'streaming']) | list }}
    assert:
      that:
      - members | length == nodes_in_zone | length
      - running | length == nodes_in_zone | length
      - members | selectattr('Role', 'eq', 'Leader') | list | length == 1
      fail_msg: >-
        Zone {{ zone }} has {{ members | length }} Patroni members of
        {{ nodes_in_zone | length }} expected, {{ running | length }} of them
        running or streaming, after waiting twenty minutes. Members report:
        {{ members | map(attribute='Host') | zip(members | map(attribute='State'))
           | map('join', '=') | join(', ') }}.
        A member stuck in "creating replica" is still cloning and needs longer;
        one that is "stopped" or missing altogether means Patroni could not
        rebuild it from the recovered leader -- check its journal.
      success_msg: >-
        Zone {{ zone }}: {{ running | length }} members running, one leader.
    when: inventory_hostname == first_node_in_zone

# Every zone's writes have to reach every other zone, and nothing above shows
# that. The marker rows reached the rebuilt zones through the initial copy, not
# through streaming, and the mesh counts say the subscriptions exist, not that
# anything flows through them. The direction most at risk is out of a rebuilt
# zone: its Spock node is new, so its replication set holds only what was added
# to it, and its tables arrived by synchronize_structure rather than by DDL
# anyone ran there. A table missing from that set replicates nothing, silently.
#
# So each zone's leader changes a marker row of its own -- the row whose id is
# its zone number, so the count the first play checks stays the same and a
# re-run still passes -- and every other zone waits to see the change. The note
# carries the time it was written, so a value left by an earlier run cannot
# stand in for this one.

- hosts: pgedge
  become: true

  vars:
    marker_wait_retries: 60

  tasks:
  - name: Determine whether this node is its zone's primary
    become_user: postgres
    command: >
      psql -d postgres -t -A -c "SELECT NOT pg_is_in_recovery()"
    register: writeback_primary
    changed_when: false

  - name: Change this zone's own marker row
    become_user: postgres
    command: >
      psql -d demo -q -t -A -v ON_ERROR_STOP=1 -c
      "UPDATE recovery_marker
          SET note = format('written on zone %s after the recovery at %s',
                            {{ zone | int }}, clock_timestamp())
        WHERE id = {{ zone | int }}
       RETURNING note"
    register: writeback
    when: writeback_primary.stdout | trim == 't'

  - name: Wait for every other zone's change to arrive here
    become_user: postgres
    vars:
      writers: >-
        {{ groups['pgedge'] | map('extract', hostvars)
           | selectattr('writeback.stdout', 'defined')
           | rejectattr('zone', 'eq', zone) | list }}
      expected: >-
        {{ writers | map(attribute='zone') | map('int')
           | zip(writers | map(attribute='writeback.stdout') | map('trim'))
           | map('join', '|') | sort | list }}
    command: >
      psql -d demo -t -A -F'|' -c
      "SELECT id, note FROM recovery_marker
        WHERE id IN ({{ writers | map(attribute='zone') | map('int')
                        | join(', ') }})
        ORDER BY id"
    register: writeback_seen
    changed_when: false
    retries: "{{ marker_wait_retries }}"
    delay: 5
    until: writeback_seen.stdout_lines | sort == expected
    failed_when: false
    when: writeback_primary.stdout | trim == 't'

  - name: Assert writes made after the recovery reach every zone
    vars:
      writers: >-
        {{ groups['pgedge'] | map('extract', hostvars)
           | selectattr('writeback.stdout', 'defined')
           | rejectattr('zone', 'eq', zone) | list }}
      expected: >-
        {{ writers | map(attribute='zone') | map('int')
           | zip(writers | map(attribute='writeback.stdout') | map('trim'))
           | map('join', '|') | sort | list }}
    assert:
      that: writeback_seen.stdout_lines | sort == expected
      fail_msg: >-
        Zone {{ zone }} did not receive every other zone's change after
        {{ marker_wait_retries | int * 5 }} seconds. Expected {{ expected }},
        found {{ writeback_seen.stdout_lines }}. A change missing from a rebuilt
        zone means that zone's Spock node is not publishing recovery_marker:
        check spock.replication_set_table on it, since its tables arrived by
        synchronize_structure rather than by DDL run there.
      success_msg: >-
        Zone {{ zone }} received the changes made on every other zone after
        the recovery.
    when: writeback_primary.stdout | trim == 't'
