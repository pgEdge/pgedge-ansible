---
- hosts: pgedge
  become: true

  collections:
  - pgedge.platform

  vars:
    pg_version: 17
    cluster_name: demo
    db_names:
    - demo
    db_user: admin
    db_password: TestPass123
    pgedge_user: pgedge
    pgedge_password: TestPass456
    pgbouncer_auth_user: pgbouncer_auth
    pool_test_user: pooltest
    pool_test_password: PoolTest987
    client_protocol_version: "3.0"

  environment:
  # Pin the wire protocol these tests use. pgEdge's bookworm repo currently
  # publishes the PG19 beta in 'release', and Debian builds one shared libpq5
  # from the newest tree in the component, so every pgEdge bookworm host gets
  # libpq5 19~beta3. During the PG19 beta libpq deliberately "greases" the
  # handshake (version 3.9999) to flush out software that mis-negotiates, and
  # pgBouncer <= 1.25.2 is such software: it answers NegotiateProtocolVersion
  # twice whenever it cannot assign a server immediately, which auth_query
  # always triggers because the login pauses for the lookup. Upstream
  # https://github.com/pgbouncer/pgbouncer/issues/1459, fixed by PR #1460
  # (merged 2026-05-30), unreleased as of 1.25.2.
  #
  # That is a transient packaging problem, not something this collection causes
  # or can fix, so the suite does not encode it -- the pooler documentation
  # carries the operator-facing note instead. 3.0 is the default for every
  # stable libpq and the workaround the PostgreSQL docs name, so pinning it
  # keeps these tests measuring our own configuration rather than the client
  # library's beta behaviour.
    PGMAXPROTOCOLVERSION: "{{ client_protocol_version }}"
    PATH: "/usr/pgsql-{{ pg_version }}/bin:/usr/lib/postgresql/{{ pg_version }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  tasks:
  - name: Check Postgres is accepting connections
    command: >
      pg_isready -h 127.0.0.1 -p {{ pg_port | default(5432) }}
    changed_when: false

  # Postgres versions carrying the fix for CVE-2026-6471 refuse to load
  # spock_output unless it is named in output_plugin_libraries. Versions
  # predating the fix have no such parameter, and pg_settings comes back empty
  # for them, so this check gates itself on the running server.

  - name: Check the permitted logical decoding output plugins
    become_user: postgres
    command: >
      psql -d postgres -t -A -c
      "SELECT setting FROM pg_settings WHERE name = 'output_plugin_libraries'"
    register: output_plugins
    changed_when: false

  - name: Assert Spock's output plugin is permitted
    assert:
      that: "'spock_output' in output_plugins.stdout"
      fail_msg: >
        output_plugin_libraries does not permit spock_output:
        {{ output_plugins.stdout }}
    when: output_plugins.stdout | length > 0

  - name: Check Spock extension is installed
    become_user: postgres
    command: >
      psql -d demo -t -A -c "SELECT extname FROM pg_extension WHERE extname='spock'"
    register: spock_ext
    changed_when: false

  - name: Assert Spock extension exists
    assert:
      that: "'spock' in spock_ext.stdout"
      fail_msg: "Spock extension not found in database demo"

  - name: Check Spock node exists
    become_user: postgres
    command: >
      psql -d demo -t -A -c "SELECT count(*) FROM spock.node"
    register: spock_node_count
    changed_when: false

  - name: Assert Spock node is created
    assert:
      that: "spock_node_count.stdout | int >= 1"
      fail_msg: "No Spock node found"

  - name: Check Spock subscriptions
    become_user: postgres
    command: >
      psql -d demo -t -A -c "SELECT count(*) FROM spock.subscription"
    register: sub_count
    changed_when: false

  - name: Assert subscriptions exist
    assert:
      that: "sub_count.stdout | int == (groups['pgedge'] | length) - 1"
      fail_msg: >
        Expected {{ (groups['pgedge'] | length) - 1 }} subscriptions,
        got {{ sub_count.stdout }}

  # Replication test: create table and insert data on first node
  - name: Create test table for replication check
    become_user: postgres
    command: >
      psql -d demo -c "
        CREATE TABLE IF NOT EXISTS repl_test (id serial PRIMARY KEY, val text);
        INSERT INTO repl_test (val) VALUES ('hello_from_{{ inventory_hostname }}');
      "
    run_once: true
    changed_when: false

  - name: Wait for replication
    pause:
      seconds: 5
    run_once: true

  - name: Verify replicated data exists
    become_user: postgres
    command: >
      psql -d demo -t -A -c "SELECT count(*) FROM repl_test"
    register: repl_count
    changed_when: false

  - name: Assert replication worked
    assert:
      that: "repl_count.stdout | int >= 1"
      fail_msg: "Replication test failed: no rows found in repl_test on {{ inventory_hostname }}"

  - name: Show replication success
    debug:
      msg: "Replication verified on {{ inventory_hostname }}: {{ repl_count.stdout }} row(s) in repl_test"

  # Spock must never route through the pooler: replication is a long-lived
  # session on a fixed node, and pooled and direct connections do not resolve
  # against the same rules. The DSNs name proxy_port or pg_port, both 5432 by
  # default, so the assertion is that no interface mentions the pooled port.

  - name: Read the Spock node interface DSNs
    become_user: postgres
    command: >
      psql -d {{ db_names | first }} -t -A -c
      "SELECT if_dsn FROM spock.node_interface"
    register: spock_dsns
    changed_when: false

  - name: Assert no Spock DSN routes through the pooler
    assert:
      that: >-
        spock_dsns.stdout_lines |
        select('search', 'port=' ~ (pgbouncer_port | default(6432))) |
        list | length == 0
      fail_msg: >-
        A Spock DSN on {{ inventory_hostname }} points at the pooled port:
        {{ spock_dsns.stdout_lines }}

  # Pooling is opt-in by group membership. The pgBouncer package itself is a
  # dependency of the pgEdge metapackage, so it is present on every node; what
  # the group gates is configuration and the service. Debian's packaging goes
  # further and enables *and starts* the packaged pooler on install (bound to
  # localhost, md5, empty userlist), so service state alone cannot tell a
  # deployed pooler from an untouched node. Test the contract instead: pooled
  # nodes run a pooler this collection configured; unpooled nodes are left with
  # whatever the package installed.

  - name: Read the pgBouncer configuration file
    slurp:
      src: /etc/pgbouncer/pgbouncer.ini
    register: pgbouncer_ini

  - name: Assert only pooled nodes have an Ansible-managed pooler configuration
    assert:
      that: >-
        ('Managed by Ansible' in (pgbouncer_ini.content | b64decode))
        == (inventory_hostname in (groups['pgbouncer'] | default([])))
      fail_msg: >-
        /etc/pgbouncer/pgbouncer.ini on {{ inventory_hostname }} is
        {{ 'not ' if inventory_hostname in (groups['pgbouncer'] | default([]))
           else '' }}Ansible-managed, but the host is
        {{ 'in' if inventory_hostname in (groups['pgbouncer'] | default([]))
           else 'not in' }} the pgbouncer group.

  - name: Check the pgBouncer service is running on pooled nodes
    command: systemctl is-active pgbouncer
    changed_when: false
    when: inventory_hostname in (groups['pgbouncer'] | default([]))

  - name: Query Postgres through the node's own pooler
    become_user: postgres
    command: >
      psql "host=127.0.0.1 port={{ pgbouncer_port | default(6432) }}
      dbname={{ db_names | first }} user={{ db_user }}" -t -A -c "SELECT 1"
    environment:
      PGPASSWORD: "{{ db_password }}"
    register: pooled_select
    changed_when: false
    when: inventory_hostname in (groups['pgbouncer'] | default([]))

  - name: Assert the pooled query returned
    assert:
      that: pooled_select.stdout == '1'
      fail_msg: >-
        SELECT 1 through the pooler on {{ inventory_hostname }} returned
        "{{ pooled_select.stdout | default('') }}"
    when: inventory_hostname in (groups['pgbouncer'] | default([]))

  # Client credentials come from auth_query, not from a list on the pooler, so a
  # role this collection never created has to work through the pooled endpoint.
  # It is created here, after the pooler has been running since deployment —
  # exactly the case that would fail if the verifier came from a file. The
  # userlist is checked first, because a pooled connection below proves nothing
  # unless this role is genuinely absent from it.

  - name: Create a Postgres role that no userlist names
    community.postgresql.postgresql_user:
      name: "{{ pool_test_user }}"
      password: "{{ pool_test_password }}"
      role_attr_flags: LOGIN
      login_port: "{{ pg_port | default(5432) }}"
      login_unix_socket: /var/run/postgresql
    become_user: postgres
    when: inventory_hostname in (groups['pgbouncer'] | default([]))

  - name: Read the pooler's userlist
    slurp:
      src: /etc/pgbouncer/userlist.txt
    register: pgbouncer_userlist
    no_log: true
    when: inventory_hostname in (groups['pgbouncer'] | default([]))

  - name: Assert the userlist holds nothing but the pooler's own login
    vars:
      entries: >-
        {{ (pgbouncer_userlist.content | b64decode).splitlines() |
           select | list }}
    assert:
      that:
      - entries | length == 1
      - entries[0] is match('"' ~ pgbouncer_auth_user ~ '"')
      fail_msg: >-
        /etc/pgbouncer/userlist.txt on {{ inventory_hostname }} holds
        {{ entries | length }} entries and does not begin with
        "{{ pgbouncer_auth_user }}", so the pooled connections below would not
        be testing auth_query.
    when: inventory_hostname in (groups['pgbouncer'] | default([]))

  # Client TLS is served from a copy of the certificate Postgres presents on its
  # own port, staged where the pooler's service user can read it. On RHEL that
  # user is pgbouncer while PGDATA is 0700 postgres, so the ownership and mode
  # are the whole reason the copy exists.

  - name: Stat the pooler's staged TLS key
    stat:
      path: /etc/pgbouncer/server.key
    register: pgbouncer_tls_key
    when: inventory_hostname in (groups['pgbouncer'] | default([]))

  - name: Assert the pooler holds a private key its own user can read
    vars:
      service_user: >-
        {{ 'pgbouncer' if ansible_facts['os_family'] == 'RedHat'
           else 'postgres' }}
    assert:
      that:
      - pgbouncer_tls_key.stat.exists
      - pgbouncer_tls_key.stat.pw_name == service_user
      - pgbouncer_tls_key.stat.mode == '0600'
      fail_msg: >-
        /etc/pgbouncer/server.key on {{ inventory_hostname }} is
        {{ 'missing' if not pgbouncer_tls_key.stat.exists else
           'owned by ' ~ pgbouncer_tls_key.stat.pw_name ~ ' mode ' ~
           pgbouncer_tls_key.stat.mode }}, so the pooler running as
        {{ service_user }} cannot serve client TLS from it.
    when: inventory_hostname in (groups['pgbouncer'] | default([]))

  # The drop-in has to raise the descriptor ceiling off systemd's default of
  # 1024, which is below max_client_conn on its own. The exact figure is derived
  # from max_client_conn in the role's defaults and is not visible here, so
  # assert only that the default was left behind.

  - name: Read the pooler's descriptor limit
    command: systemctl show -p LimitNOFILE --value pgbouncer
    register: pgbouncer_nofile
    changed_when: false
    when: inventory_hostname in (groups['pgbouncer'] | default([]))

  - name: Assert the pooler's descriptor limit was raised
    assert:
      that: pgbouncer_nofile.stdout | int > 1024
      fail_msg: >-
        pgBouncer on {{ inventory_hostname }} has LimitNOFILE
        {{ pgbouncer_nofile.stdout }}, so the systemd drop-in did not take
        effect.
    when: inventory_hostname in (groups['pgbouncer'] | default([]))

  # Each platform's own log path, which is also the one its logrotate
  # configuration already covers: RHEL ships /etc/logrotate.d/pgbouncer, and on
  # Debian pgedge-postgresql-common rotates /var/log/postgresql/*.log.

  - name: Stat the pooler log file
    stat:
      path: >-
        {{ '/var/log/pgbouncer/pgbouncer.log'
           if ansible_facts['os_family'] == 'RedHat'
           else '/var/log/postgresql/pgbouncer.log' }}
    register: pgbouncer_log
    when: inventory_hostname in (groups['pgbouncer'] | default([]))

  - name: Assert the pooler logs where the platform expects
    assert:
      that: pgbouncer_log.stat.exists
      fail_msg: >-
        No pgBouncer log at the platform's path on {{ inventory_hostname }}
    when: inventory_hostname in (groups['pgbouncer'] | default([]))

# Verify the access gates from a host that no pg_hba rule names and no role was
# applied to. From a pgEdge node these checks are meaningless — every rule the
# collection writes already names those addresses.
#
# Interpretation matters here: through either HAProxy listener, Postgres sees
# the *proxy's* address, so those paths do not exercise client-IP gating at all.
# Only the direct-to-node paths do.
- hosts: clients
  become: true

  vars:
    db_names:
    - demo
    db_user: admin
    db_password: TestPass123
    pool_test_user: pooltest
    pool_test_password: PoolTest987
    pooled_nodes: "{{ groups['pgbouncer'] | default([]) }}"
    unpooled_nodes: >-
      {{ groups['pgedge'] | difference(groups['pgbouncer'] | default([])) }}
    proxies: "{{ groups['haproxy'] | default([]) }}"
    client_protocol_version: "3.0"

  environment:
  # Pin the wire protocol these tests use. pgEdge's bookworm repo currently
  # publishes the PG19 beta in 'release', and Debian builds one shared libpq5
  # from the newest tree in the component, so every pgEdge bookworm host gets
  # libpq5 19~beta3. During the PG19 beta libpq deliberately "greases" the
  # handshake (version 3.9999) to flush out software that mis-negotiates, and
  # pgBouncer <= 1.25.2 is such software: it answers NegotiateProtocolVersion
  # twice whenever it cannot assign a server immediately, which auth_query
  # always triggers because the login pauses for the lookup. Upstream
  # https://github.com/pgbouncer/pgbouncer/issues/1459, fixed by PR #1460
  # (merged 2026-05-30), unreleased as of 1.25.2.
  #
  # That is a transient packaging problem, not something this collection causes
  # or can fix, so the suite does not encode it -- the pooler documentation
  # carries the operator-facing note instead. 3.0 is the default for every
  # stable libpq and the workaround the PostgreSQL docs name, so pinning it
  # keeps these tests measuring our own configuration rather than the client
  # library's beta behaviour.
    PGMAXPROTOCOLVERSION: "{{ client_protocol_version }}"
    PGPASSWORD: "{{ db_password }}"
    PGCONNECT_TIMEOUT: "5"

  tasks:
  - name: Install a Postgres client
    package:
      name: >-
        {{ 'postgresql' if ansible_facts['os_family'] == 'RedHat'
           else 'postgresql-client' }}
      state: present
      update_cache: true
    retries: 5
    delay: 20
    register: result
    until: result is success

  # Positive: the pooler answers a client no Postgres rule names, because the
  # pooled hop terminates at pgBouncer and reaches Postgres over loopback.

  - name: Query a pooled node's pooler directly
    command: >
      psql "host={{ pooled_nodes | first }}
      port={{ pgbouncer_port | default(6432) }}
      dbname={{ db_names | first }} user={{ db_user }}" -t -A -c "SELECT 1"
    register: via_pooler
    changed_when: false
    when: pooled_nodes | length > 0

  - name: Assert the pooler served the client
    assert:
      that: via_pooler.stdout == '1'
      fail_msg: >-
        SELECT 1 against {{ pooled_nodes | first }}:{{ pgbouncer_port | default(6432) }}
        returned "{{ via_pooler.stdout | default('') }}"
    when: pooled_nodes | length > 0

  # The gate for auth_query, from the only host that can observe it. This role
  # was created after the pooler started and appears in no userlist, so the
  # verifier it authenticates against can only have come from the lookup
  # function in Postgres.

  - name: Query a pooled node's pooler as the post-deployment role
    command: >
      psql "host={{ pooled_nodes | first }}
      port={{ pgbouncer_port | default(6432) }}
      dbname={{ db_names | first }} user={{ pool_test_user }}" -t -A -c "SELECT 1"
    environment:
      PGPASSWORD: "{{ pool_test_password }}"
    register: via_pooler_new_role
    changed_when: false
    when: pooled_nodes | length > 0

  - name: Assert the pooler resolved a credential it was never given
    assert:
      that: via_pooler_new_role.stdout == '1'
      fail_msg: >-
        {{ pool_test_user }} could not authenticate through
        {{ pooled_nodes | first }}:{{ pgbouncer_port | default(6432) }}, so
        auth_query did not resolve it. stderr="{{ via_pooler_new_role.stderr | default('') }}"
    when: pooled_nodes | length > 0

  # Client TLS, from the one host that reaches the pooler over a real network.
  # sslmode=require is the assertion in itself: libpq abandons the connection
  # when the server declines TLS, so a row coming back cannot have crossed the
  # wire in cleartext. \conninfo then says which protocol was negotiated.

  - name: Query a pooled node's pooler over TLS
    command: >
      psql "host={{ pooled_nodes | first }}
      port={{ pgbouncer_port | default(6432) }}
      dbname={{ db_names | first }} user={{ db_user }} sslmode=require"
      -t -A -c "SELECT 1"
    register: via_pooler_tls
    changed_when: false
    when: pooled_nodes | length > 0

  - name: Assert the pooler served the client over TLS
    assert:
      that: via_pooler_tls.stdout == '1'
      fail_msg: >-
        sslmode=require against {{ pooled_nodes | first }}:{{
        pgbouncer_port | default(6432) }} returned
        "{{ via_pooler_tls.stdout | default('') }}".
        stderr="{{ via_pooler_tls.stderr | default('') }}"
    when: pooled_nodes | length > 0

  - name: Ask the pooled connection what it negotiated
    command: >
      psql "host={{ pooled_nodes | first }}
      port={{ pgbouncer_port | default(6432) }}
      dbname={{ db_names | first }} user={{ db_user }} sslmode=require"
      -c "\conninfo"
    register: pooler_conninfo
    changed_when: false
    when: pooled_nodes | length > 0

  - name: Assert the pooled connection reports itself encrypted
    assert:
      that: "'SSL connection' in pooler_conninfo.stdout"
      fail_msg: >-
        The pooled connection to {{ pooled_nodes | first }} does not report an
        SSL connection: {{ pooler_conninfo.stdout | default('') }}
    when: pooled_nodes | length > 0

  # The pooled listener is TCP passthrough, so the client negotiates TLS with
  # whichever node's pooler HAProxy picked, not with HAProxy.

  - name: Query the pooled HAProxy listener over TLS
    command: >
      psql "host={{ proxies | first }} port={{ pooler_port | default(6432) }}
      dbname={{ db_names | first }} user={{ db_user }} sslmode=require"
      -t -A -c "SELECT 1"
    register: via_pooled_proxy_tls
    changed_when: false
    when:
    - proxies | length > 0
    - pooled_nodes | length > 0

  - name: Assert the pooled listener served the client over TLS
    assert:
      that: via_pooled_proxy_tls.stdout == '1'
      fail_msg: >-
        sslmode=require through {{ proxies | first }}:{{
        pooler_port | default(6432) }} returned
        "{{ via_pooled_proxy_tls.stdout | default('') }}".
        stderr="{{ via_pooled_proxy_tls.stderr | default('') }}"
    when:
    - proxies | length > 0
    - pooled_nodes | length > 0

  - name: Query the direct HAProxy listener
    command: >
      psql "host={{ proxies | first }} port={{ proxy_port | default(5432) }}
      dbname={{ db_names | first }} user={{ db_user }}" -t -A -c "SELECT 1"
    register: via_proxy
    changed_when: false
    when: proxies | length > 0

  - name: Assert the direct listener served the client
    assert:
      that: via_proxy.stdout == '1'
      fail_msg: >-
        SELECT 1 through {{ proxies | first }}:{{ proxy_port | default(5432) }}
        returned "{{ via_proxy.stdout | default('') }}"
    when: proxies | length > 0

  - name: Query the pooled HAProxy listener
    command: >
      psql "host={{ proxies | first }} port={{ pooler_port | default(6432) }}
      dbname={{ db_names | first }} user={{ db_user }}" -t -A -c "SELECT 1"
    register: via_pooled_proxy
    changed_when: false
    when:
    - proxies | length > 0
    - pooled_nodes | length > 0

  - name: Assert the pooled listener served the client
    assert:
      that: via_pooled_proxy.stdout == '1'
      fail_msg: >-
        SELECT 1 through {{ proxies | first }}:{{ pooler_port | default(6432) }}
        returned "{{ via_pooled_proxy.stdout | default('') }}"
    when:
    - proxies | length > 0
    - pooled_nodes | length > 0

  # Negative: the same credentials straight at Postgres, which does gate on the
  # client's address and has no rule for this one.

  - name: Connect straight to a node's Postgres port
    command: >
      psql "host={{ groups['pgedge'] | first }} port={{ pg_port | default(5432) }}
      dbname={{ db_names | first }} user={{ db_user }}" -t -A -c "SELECT 1"
    register: via_postgres
    changed_when: false
    failed_when: false

  - name: Assert Postgres refused the unnamed client
    assert:
      that:
      - via_postgres.rc != 0
      - "'no pg_hba.conf entry' in via_postgres.stderr"
      fail_msg: >-
        Postgres on {{ groups['pgedge'] | first }} did not refuse this host on
        its own address. rc={{ via_postgres.rc }},
        stderr="{{ via_postgres.stderr }}"

  # Negative: an unpooled node has no pooler to reach. On RHEL nothing is
  # listening; on Debian the packaged pooler the metapackage started is bound to
  # localhost. Either way the client cannot get in, which is the assertion that
  # holds on both platforms.

  - name: Connect to an unpooled node's pooler port
    command: >
      psql "host={{ unpooled_nodes | first }}
      port={{ pgbouncer_port | default(6432) }}
      dbname={{ db_names | first }} user={{ db_user }}" -t -A -c "SELECT 1"
    register: via_unpooled
    changed_when: false
    failed_when: false
    when: unpooled_nodes | length > 0

  - name: Assert an unpooled node serves nothing on the pooler port
    assert:
      that: via_unpooled.rc != 0
      fail_msg: >-
        {{ unpooled_nodes | first }} answered on
        {{ pgbouncer_port | default(6432) }} but is not in the pgbouncer group.
    when: unpooled_nodes | length > 0
