---

# Run after verify-ultra-ha.yml on a cluster with ColdFront layered on, as
# run-test.sh and the Ultra-HA workflow do. That playbook checks the HA
# stack underneath, expecting ColdFront's libraries in the preload list;
# this then checks what ColdFront adds to it, on the leaders and replicas
# of both zones.
#
# As in verify-simple-cluster-coldfront.yml, the data check creates
# public.e2e_events and never drops it, so re-running against a kept
# cluster fails on the create.

- hosts: lakekeeper
  become: true

  vars:
    lakekeeper_port: 8181
    lakekeeper_warehouse: wh

  tasks:
  - name: Check Lakekeeper reports itself healthy
    uri:
      url: "http://{{ lakekeeper_host }}:{{ lakekeeper_port }}/health"
      status_code: 200
    register: lakekeeper_health

  - name: Assert the catalog is healthy
    assert:
      that: lakekeeper_health.json.health | default('') == 'ok'
      fail_msg: "Lakekeeper /health returned {{ lakekeeper_health.json }}"

  - name: List the Lakekeeper warehouses
    uri:
      url: >-
        http://{{ lakekeeper_host }}:{{ lakekeeper_port
        }}/management/v1/warehouse
      status_code: 200
    register: warehouses

  - name: Assert the warehouse over the object store exists
    assert:
      that: >-
        lakekeeper_warehouse in (warehouses.json['warehouses']
        | default([]) | map(attribute='name') | list)
      fail_msg: >-
        No warehouse named {{ lakekeeper_warehouse }}, only
        {{ warehouses.json['warehouses'] | default([])
           | map(attribute='name') | join(', ') or 'none' }}.

- hosts: pgedge
  become: true

  collections:
  - pgedge.platform

  vars:
    pg_version: 17
    coldfront_db: coldfront
    coldfront_schema: public
    # Rows each zone's leader inserts at once, one transaction each.
    concurrent_rows: 10
    zone_count: >-
      {{ groups['pgedge'] | map('extract', hostvars, 'zone') | unique
         | list | length }}
    first_zone: "{{ hostvars[groups['pgedge'] | first].zone | string }}"

  environment:
    PATH: "/usr/pgsql-{{ pg_version }}/bin:/usr/lib/postgresql/{{ pg_version }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  tasks:
  - name: Ask each node whether it is a standby
    become_user: postgres
    command: >
      psql -d {{ coldfront_db }} -t -A -c "SELECT pg_is_in_recovery()"
    register: recovery
    changed_when: false

  - name: Record which nodes are their zone's leader
    set_fact:
      is_leader: "{{ recovery.stdout == 'f' }}"

  # Patroni writes every member's postgresql.conf, so the replicas have
  # to show the same settings as the leaders.

  - name: Read the preloaded shared libraries
    become_user: postgres
    command: >
      psql -d {{ coldfront_db }} -t -A -c "SHOW shared_preload_libraries"
    register: preload
    changed_when: false

  - name: Assert ColdFront extended the preload list on every member
    assert:
      that:
      - "'spock' in preload.stdout"
      - "'snowflake' in preload.stdout"
      - "'pg_duckdb' in preload.stdout"
      - "'coldfront' in preload.stdout"
      fail_msg: >
        shared_preload_libraries is "{{ preload.stdout }}", which has lost
        one of spock, snowflake, pg_duckdb or coldfront.

  - name: Check the ColdFront extensions are installed
    become_user: postgres
    command: >
      psql -d {{ coldfront_db }} -t -A -c
      "SELECT extname FROM pg_extension
       WHERE extname IN ('dblink', 'pg_duckdb', 'coldfront')
       ORDER BY extname"
    register: coldfront_ext
    changed_when: false

  - name: Assert the ColdFront extensions exist
    assert:
      that:
      - "'coldfront' in coldfront_ext.stdout_lines"
      - "'dblink' in coldfront_ext.stdout_lines"
      - "'pg_duckdb' in coldfront_ext.stdout_lines"
      fail_msg: >
        Expected dblink, pg_duckdb and coldfront in {{ coldfront_db }},
        found {{ coldfront_ext.stdout_lines | default([]) | join(', ')
                 or 'none' }}.

  - name: Ask ColdFront whether its bakery is armed
    become_user: postgres
    command: >
      psql -d {{ coldfront_db }} -t -A -c "SELECT coldfront._bakery_armed()"
    register: bakery_armed
    changed_when: false

  - name: Assert the bakery is armed
    assert:
      that: bakery_armed.stdout == 't'
      fail_msg: >
        coldfront._bakery_armed() is "{{ bakery_armed.stdout }}", so this
        node would order only its own cold-tier commits.

  - name: List the ColdFront tables Spock replicates
    become_user: postgres
    command: >
      psql -d {{ coldfront_db }} -t -A -c
      "SELECT rst.set_reloid::regclass::text
       FROM spock.replication_set rs
       JOIN spock.replication_set_table rst ON rst.set_id = rs.set_id
       WHERE rs.set_name = 'default'
       AND rst.set_reloid::regclass::text LIKE 'coldfront.%'
       ORDER BY 1"
    register: replicated_tables
    changed_when: false

  - name: Assert the bakery and catalog tables replicate, and only those
    assert:
      that:
      - "'coldfront.claims' in replicated_tables.stdout_lines"
      - "'coldfront.claim_acks' in replicated_tables.stdout_lines"
      - "'coldfront.storage_secret' in replicated_tables.stdout_lines"
      - "'coldfront.partition_config' in replicated_tables.stdout_lines"
      - "'coldfront.tiered_views' in replicated_tables.stdout_lines"
      - "'coldfront.archive_watermark' in replicated_tables.stdout_lines"
      - "'coldfront.deferred_acks' not in replicated_tables.stdout_lines"
      fail_msg: >
        Spock's default replication set holds
        {{ replicated_tables.stdout_lines | join(', ') or 'no ColdFront
        table' }}.

  # One leader set the storage secret; Spock carried the row to the
  # other zone and physical replication to every replica.

  - name: Check every member has the storage secret row
    become_user: postgres
    command: >
      psql -d {{ coldfront_db }} -t -A -c
      "SELECT count(*) FROM coldfront.storage_secret"
    register: secret_rows
    changed_when: false

  - name: Assert every member has the storage secret row
    assert:
      that: secret_rows.stdout == '1'
      fail_msg: >
        coldfront.storage_secret holds {{ secret_rows.stdout }} rows here.

  # Each statement gets its own connection. Batched into one psql
  # invocation they would share an implicit transaction, where a failure
  # in the last statement silently discards the earlier ones.

  - name: Create a decoupled Iceberg table on the first zone's leader
    community.postgresql.postgresql_query:
      login_db: "{{ coldfront_db }}"
      login_unix_socket: /var/run/postgresql
      query: >-
        SELECT coldfront.create_iceberg_table(%(schema)s, %(table)s,
        %(columns)s::jsonb)
      named_args:
        schema: "{{ coldfront_schema }}"
        table: e2e_events
        columns: >-
          [{"name": "id", "type": "bigint"},
           {"name": "ts", "type": "timestamptz"},
           {"name": "note", "type": "text"}]
    become_user: postgres
    when:
    - is_leader | bool
    - zone | string == first_zone

  - name: Insert rows into the Iceberg table
    community.postgresql.postgresql_query:
      login_db: "{{ coldfront_db }}"
      login_unix_socket: /var/run/postgresql
      query: >-
        INSERT INTO {{ coldfront_schema }}.e2e_events (id, ts, note)
        VALUES (1, now(), 'one'), (2, now(), 'two'), (3, now(), 'three')
    become_user: postgres
    when:
    - is_leader | bool
    - zone | string == first_zone

  # DDL replication creates the table's wrapper view in the other zone,
  # and physical replication on every replica.

  - name: Wait for the table to reach every member
    become_user: postgres
    command: >
      psql -d {{ coldfront_db }} -t -A -c
      "SELECT to_regclass('{{ coldfront_schema }}.e2e_events') IS NOT NULL"
    register: table_present
    until: table_present.stdout == 't'
    retries: 30
    delay: 2
    changed_when: false

  # Both zones' leaders commit to the same Iceberg table at the same
  # time, one row per transaction. Lakekeeper refuses a commit that races
  # another with a 409, and duckdb-iceberg does not retry it, so that row
  # would be dropped without an error. Only the bakery ordering commits
  # across zones keeps every row.

  - name: Insert from every zone's leader at the same time
    become_user: postgres
    shell: |
      set -e
      i=1
      while [ "${i}" -le {{ concurrent_rows }} ]; do
        psql -v ON_ERROR_STOP=1 -q -d {{ coldfront_db }} -c \
          "INSERT INTO {{ coldfront_schema }}.e2e_events (id, ts, note)
           VALUES ({{ zone | int * 1000 }} + ${i}, now(), 'zone {{ zone }}')"
        i=$((i + 1))
      done
    when: is_leader | bool

  # A replica reads the cold tier through the same catalog, with the
  # DuckDB secret setup_coldfront wrote from the replicated row.

  - name: Count the rows from every member
    community.postgresql.postgresql_query:
      login_db: "{{ coldfront_db }}"
      login_unix_socket: /var/run/postgresql
      query: "SELECT count(*) AS n FROM {{ coldfront_schema }}.e2e_events"
    register: coldfront_count
    changed_when: false
    become_user: postgres

  - name: Assert every member sees every row
    assert:
      that: coldfront_count.query_result[0].n | int == expected | int
      fail_msg: >
        Expected {{ expected }} rows in {{ coldfront_schema }}.e2e_events,
        got {{ coldfront_count.query_result[0].n }}. A shortfall means
        commits that raced were dropped.
    vars:
      expected: "{{ 3 + concurrent_rows * (zone_count | int) }}"

  - name: Try a cold-tier write on a replica
    become_user: postgres
    command: >
      psql -v ON_ERROR_STOP=1 -d {{ coldfront_db }} -c
      "INSERT INTO {{ coldfront_schema }}.e2e_events (id, ts, note)
       VALUES (-1, now(), 'replica')"
    register: replica_write
    failed_when: replica_write.rc == 0
    changed_when: false
    when: not is_leader | bool
